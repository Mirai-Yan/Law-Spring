# 未完成形态：张明楷《刑法学》（第七版）中的论述
bookViews:
  - id: zmk7-attempt-basis
    work: zmk-xingfaxue-7
    question: q-attempt-basis
    pages: "501-503"
    answer: objective
    summary: >-
      作者认为我国刑法实质上采取客观的未遂论，具体采实质的客观说中的「危险结果说」：只有行为造成了侵害法益的紧迫危险（作为结果的危险）时，
      才处罚未遂犯。
    reasons:
      - 刑法的目的是保护法益，犯罪的本质是侵犯法益，这否定了以犯罪意思为处罚根据的主观未遂论。
      - 我国刑法事实上只例外地处罚未遂（很多犯罪以数额较大、情节严重为成立条件），这种例外性表明采取了客观的未遂论。
      - 若以行为本身的危险为根据，可能把预备行为当作未遂处罚；既然以危险结果为根据，就无须再并用行为的危险。
      - 印象说以远离法定构成要件的国民印象为根据，最终只能求助于行为人的主观意思，实际上是主观的未遂论。
    reported:
      - label: 客观的未遂论
        answer: objective
        summary: 未遂犯的处罚根据在于发生了法益侵害的客观危险；其内部有形式的客观说与实质的客观说（行为危险说、危险结果说、综合说）之分。
        pages: "501"
      - label: 主观的未遂论
        answer: subjective
        summary: 处罚根据在于行为显示出的行为人的危险性格或犯罪意思。
        pages: "501"
      - label: 印象说（德国支配说）
        answer: impression
        summary: 行为人落实的法敌对意思动摇了公众对法秩序效力的信赖；作者认为它实际上是主观的未遂论。
        pages: "501-502"

  - id: zmk7-commencement
    work: zmk-xingfaxue-7
    question: q-commencement
    pages: "504-507"
    answer: material-result
    summary: >-
      作者采结果说：行为对法益的侵害危险达到紧迫程度（产生作为未遂结果的危险）时，才是实行的着手。着手是划定未遂处罚时期的概念，
      因而可能前置或后置于实行行为。
    reasons:
      - 犯罪的本质是侵犯法益；危险非常微小或只达到预备程度时，不应作为未遂处罚。
      - 形式的客观说没有从实质上说明什么是着手，「开始实行构成要件行为」本身就是需要解释的问题。
      - 主观说以犯罪意思的显现为标准，丧失了区分预备与未遂的机能，使着手的认定过于提前。
    reported:
      - label: 主观说
        answer: subjective
        summary: 行为人的犯罪意思（危险性格）被发现、表现于外部时就是着手；作者认为标准含糊、使着手提前。
        pages: "505"
      - label: 形式的客观说（定型说）
        answer: formal
        summary: 以实施一部分符合构成要件的行为为必要且为足；我国传统观点大体如此。
        pages: "505-506"
      - label: 实质的行为说
        answer: material-act
        summary: 开始实施具有实现犯罪的现实危险性的行为时就是着手，基本上重视行为无价值。
        pages: "505"
      - label: 主观的折中说
        answer: individual
        summary: 以行为人的整体计划为基础，对保护法益造成直接危险的行为明确表现出犯罪意思时就是着手。
        pages: "505"

  - id: zmk7-danger-standard
    work: zmk-xingfaxue-7
    question: q-danger-standard
    pages: "521-532"
    answer: objective
    summary: >-
      作者贯彻客观的未遂犯论，采「修正的客观的危险说」：以行为时存在的全部客观事实（包括事后查明的事实）为判断资料，
      站在行为时、以一般人能够理解的科学概率判断结果发生的可能性；对细微事实作一定抽象，并分析结果没有发生的原因及当时具备该原因的可能性。
    reasons:
      - 判断资料不限于行为人的计划内容；以为是仇人而射击稻草人时，要以客观上射击稻草人的事实为资料。
      - 不能彻底事后判断，否则一切危险犯都成为不能犯；对客观事实作适度抽象，以行为造成结果的通常性为标准。
      - 对结果没有发生的原因作分析：缺乏的要素在行为当时有无存在的可能；有可能时成立未遂，没有可能时是不能犯。
      - 不能犯只是否定该罪的未遂，不当然否定预备犯或他罪的成立。
    reported:
      - label: 纯粹主观说
        answer: null
        summary: 只要行为人以犯罪意思实施行为，即使没有危险也成立未遂；作者指出此说已被彻底否认。
        pages: "522-523"
      - label: 抽象的危险说（主观的危险说）
        answer: abstract
        summary: 以行为人行为时认识到的事实为基础，按一般人的看法判断有无危险；作者认为是主观主义的产物。
        pages: "523-524"
      - label: 印象说
        answer: null
        summary: 行为的客观危险无法作为标准，应以行为人的法敌对意思给社会造成的印象为准；作者认为基本上是抽象危险说的另一种表述。
        pages: "525"
      - label: 具体的危险说（新客观说）
        answer: concrete
        summary: 以行为时行为人特别认识到的事实和一般人可能认识到的事实为基础，以一般人的判断决定有无危险。
        pages: "525-527"
      - label: 原本意义上的客观的危险说
        answer: objective
        summary: 以事后查明的全部客观事实为基础判断；侵害结果一开始就不可能实现的是不能犯。
        pages: "527-528"

  - id: zmk7-empty-bed
    work: zmk-xingfaxue-7
    question: q-empty-bed
    pages: "529-532"
    answer: impossible
    summary: >-
      按修正的客观的危险说，以为被害人在床上睡觉而开枪、但被害人当时根本不在家的，在行为当时不存在致人死亡的可能性，是不可罚的不能犯；
      但如果被害人原本在床上、只是碰巧短暂离开（如上卫生间），宜认定为故意杀人未遂。
    reasons:
      - 判断资料包括事后查明的客观事实：被害人不在家这一事实必须纳入判断。
      - 分析结果没有发生的原因：被害人不在场时，问题在于行为当时被害人出现在床上的可能性有多大；完全没有可能时是不能犯，可能性较大时是未遂。
    editorNote: 作者的结论取决于被害人不在床上的具体原因，与案情设定密切相关；见第 532 页正文与脚注。

  - id: zmk7-withdrawal-basis
    work: zmk-xingfaxue-7
    question: q-withdrawal-basis
    pages: "533-539"
    answer: purpose
    summary: >-
      作者采「违法性减少、责任减少与缺乏特殊预防必要性」的并合说：与既遂犯相比，中止犯的违法性与有责性都有减少，仅此即可减轻处罚；
      中止者自动回到合法立场，特殊预防的必要性丧失，所以可以免除处罚。作者也说，这可以看作只采取了量刑目的说。
    reasons:
      - 违法性一旦产生就不能在事后消灭，只能讨论是否减少；作者不承认主观的违法要素，只从法益侵害与危险是否减少判断。
      - 以「金桥理论」为内容的政策说只是对刑事政策效果的期待，本身存在缺陷。
    reported:
      - label: 违法性减少、消灭说
        answer: unrecht-decrease
        summary: 行为人基于自己的意志中止犯罪，使违法性减少或消灭。
        pages: "534"
      - label: 责任减少、消灭说
        answer: schuld-decrease
        summary: 基于自己的意志中止犯罪，使有责性减少或消灭。
        pages: "535"
      - label: 政策说（金桥理论）
        answer: policy
        summary: 为犯罪人架设回头的「金桥」，以刑罚减免鼓励其中止。
        pages: "536"

  - id: zmk7-voluntariness
    work: zmk-xingfaxue-7
    question: q-voluntariness
    pages: "539-542"
    answer: frank
    summary: >-
      作者把中止的自动性理解为：行为人认识到客观上可能继续实施犯罪或者可能既遂，继续实施对自己也有意义（符合原本的犯意），却自愿放弃原来的犯罪意图。
      自动性与「意志以外的原因」应联系起来理解；中止动机不需要具有伦理性。
    reasons:
      - 存在选择余地时不继续实施，才表明放弃是自愿的而不是被迫的。
      - 限定主观说把自动性与伦理性相混淆，过于缩小中止的范围；客观说以一般人为标准，与自动性这一主观要素不符。
    reported:
      - label: 主观说（弗兰克公式）
        answer: frank
        summary: 能达目的而不欲时为中止，欲达目的而不能时为未遂。
        pages: "539"
      - label: 限定主观说
        answer: normative
        summary: 只有基于悔悟、同情等对自己行为持否定评价的规范意识或动机而放弃的，才是自动中止。
        pages: "539-540"
      - label: 客观说
        answer: objective
        summary: 根据社会一般观念评价没有既遂的原因：对一般人不会产生强制性影响的情况下放弃的，是中止。
        pages: "540"
