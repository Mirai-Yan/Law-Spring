  chapter: 侵犯财产罪
  section: 抢劫罪与抢夺罪
  area: sp-property
  article: 第263条
  legalInterest: 财产，以及被害人的人身（意思活动自由、身体安全）。
  elements:
  - 以非法占有为目的，以暴力、胁迫或其他方法压制被害人反抗，当场强取财物。
  - 刑法第 269 条规定了转化型抢劫；入户抢劫、持枪抢劫等八种情形法定刑升格。
