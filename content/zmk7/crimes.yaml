  sources:
  - work: zmk-xingfaxue-7
    pages: 1438-1459
- id: crime-207
  name: 盗窃罪
  chapter: 侵犯财产罪
  section: 盗窃罪与侵占罪
  area: sp-property
  article: 第264条
  legalInterest: 财产所有权及其他本权，以及需要通过法定程序恢复应有状态的占有（作者的中间说）。
  elements:
  - 以非法占有为目的，违反被害人意志，将他人占有的财物转移为自己或第三者占有。
  - 数额较大，或者多次盗窃、入户盗窃、携带凶器盗窃、扒窃。
  - 对象包括财产性利益。
  issues:
  - q-theft-rechtsgut
  - q-self-help-recovery
  - q-theft-completion
  - q-appropriation-intent-required
  - q-appropriation-intent-content
  - q-dead-possession
  - q-atm-misuse
  - q-theft-secrecy
  related:
  - crime: crime-212
    note: 诈骗以被害人基于认识错误的处分行为为要件；没有处分行为的是盗窃。
  - crime: crime-208
    note: 盗窃的对象是他人占有的财物；侵占的对象是自己占有的他人财物或脱离占有物。
  - crime: crime-210
    note: 抢夺是对他人紧密占有的财物当场直接夺取。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1459-1501
- id: crime-208
  name: 侵占罪
  chapter: 侵犯财产罪
  section: 盗窃罪与侵占罪
  area: sp-property
  article: 第270条
  legalInterest: 财物的所有权（含其他本权）；委托物侵占还侵害委托信任关系。
  elements:
  - 将代为保管的他人财物非法占为己有，数额较大，拒不退还；或将遗忘物、埋藏物非法占为己有，数额较大，拒不交出。
  - 告诉才处理。
  issues:
  - q-dead-possession
  - q-illegal-cause-embezzlement
  - q-forgotten-property
  sources:
  - work: zmk-xingfaxue-7
    pages: 1501-1519
- id: crime-209
