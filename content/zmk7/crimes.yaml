  section: 抢劫罪与抢夺罪
  area: sp-property
  article: 第267条
  elements:
  - 以非法占有为目的，当场直接夺取他人紧密占有的数额较大的财物，或者多次抢夺。
  - 携带凶器抢夺的，依抢劫罪论处。
  issues:
  - q-theft-secrecy
  sources:
  - work: zmk-xingfaxue-7
    pages: 1549-1558
- id: crime-211
