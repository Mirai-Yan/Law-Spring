  legalInterest: 他人的生命。
  elements:
  - 行为是非法剥夺他人生命，作为与不作为均可实施。
  - 对象是行为人以外的有生命的自然人。
  - 主观上是故意，包括直接故意与间接故意。
  issues:
  - q-suicide-participation
  related:
  - crime: crime-166
    note: 区别在于故意的内容：是否有剥夺生命的故意（含放任死亡）。
  - crime: crime-165
    note: 对死亡结果是故意还是过失。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1307-1314
- id: crime-165
  name: 过失致人死亡罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯生命、健康的犯罪
  area: sp-person
  article: 第233条
  legalInterest: 他人的生命。
  elements:
  - 过失造成他人死亡的结果。
  - 刑法另有规定的（如交通肇事、重大责任事故致人死亡），依照特别规定。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1314-1316
- id: crime-166
  name: 故意伤害罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯生命、健康的犯罪
  area: sp-person
  article: 第234条
  legalInterest: 他人的身体健康（身体的完整性与生理机能的健全）。
  elements:
  - 非法损害他人身体健康，以造成轻伤以上的伤害为成立条件。
  - 致人重伤、致人死亡的，法定刑升格；致人死亡时对死亡结果至少须有过失。
  issues:
  - q-consented-injury
  related:
  - crime: crime-164
    note: 伤害故意与杀人故意的区分。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1316-1335
- id: crime-167
  name: 组织出卖人体器官罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯生命、健康的犯罪
  area: sp-person
  article: 第234条之一
  elements:
  - 组织他人出卖人体器官；未经本人同意摘取器官、摘取未成年人器官或强迫、欺骗他人捐献的，依故意伤害、故意杀人罪论处。
  editorNote: 书中讨论了本罪保护法益与被害人承诺的关系（第 1335—1336 页）。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1335-1336
- id: crime-168
  name: 过失致人重伤罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯生命、健康的犯罪
  area: sp-person
  article: 第235条
  legalInterest: 他人的身体健康。
  elements:
  - 过失伤害他人身体，致人重伤；造成轻伤的不成立本罪。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1336-1337
- id: crime-169
  name: 遗弃罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯生命、健康的犯罪
  area: sp-person
  article: 第261条
  legalInterest: 被遗弃者的生命、身体安全。
  elements:
  - 对年老、年幼、患病或其他没有独立生活能力的人负有扶养义务而拒绝扶养，情节恶劣。
  - 作者不赞成把本罪法益局限于家庭成员之间的扶养权利，因而行为主体不限于家庭成员。
  issues:
  - q-abandonment-rechtsgut
  sources:
  - work: zmk-xingfaxue-7
    pages: 1337-1340
- id: crime-170
  name: 强奸罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯性的决定权的犯罪
  area: sp-person
  article: 第236条
  legalInterest: 妇女的性行为自己决定权。
  elements:
  - 普通强奸：使用暴力、胁迫或其他手段，违背妇女意志与其发生性交。
  - 奸淫幼女：与不满 14 周岁的幼女发生性关系，无论幼女是否同意。
  issues:
  - q-marital-rape
  related:
  - crime: crime-172
    note: 强奸以性交为内容，强制猥亵针对性交以外的猥亵行为。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1340-1356
- id: crime-171
  name: 负有照护职责人员性侵罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯性的决定权的犯罪
  area: sp-person
  article: 第236条之一
  elements:
  - 对已满 14 周岁不满 16 周岁的未成年女性负有监护、收养、看护、教育、医疗等特殊职责的人员，与其发生性关系。
  - 不以违背被害人意志为要件；违背意志的，依强奸罪论处。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1356-1359
- id: crime-172
  name: 强制猥亵、侮辱罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯性的决定权的犯罪
  area: sp-person
  article: 第237条
  legalInterest: 他人的性行为自己决定权。
  elements:
  - 以暴力、胁迫或者其他方法强制猥亵他人，或者强制侮辱妇女。
  - 被害人不限于女性。
  issues:
  - q-indecency-tendency
  sources:
  - work: zmk-xingfaxue-7
    pages: 1359-1367
- id: crime-173
  name: 猥亵儿童罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯性的决定权的犯罪
  area: sp-person
  article: 第237条
  elements:
  - 猥亵不满 14 周岁的儿童，不要求使用强制手段。
  - 作者认为本罪法益不同于强制猥亵罪，因此诱使儿童自拍隐私部位等不接触身体的行为也可能构成本罪。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1367-1369
- id: crime-174
  name: 非法拘禁罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第238条
  legalInterest: 人的身体活动的自由。
  elements:
  - 非法拘禁他人或以其他方法非法剥夺他人人身自由。
  - 为索取债务（含非法债务）非法扣押、拘禁他人的，依本罪论处。
  issues:
  - q-detention-liberty
  related:
  - crime: crime-175
    note: 绑架罪以勒索财物或满足其他不法要求为目的，并利用第三人对被害人安危的忧虑。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1369-1375
- id: crime-175
  name: 绑架罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第239条
  elements:
  - 以勒索财物或满足其他不法要求为目的，以暴力、胁迫、麻醉等方法劫持或以实力控制他人。
  - 利用被绑架人的近亲属或其他人对其安危的忧虑。
  issues:
  - q-kidnapping-act
  - q-kidnapping-rechtsgut
  related:
  - crime: crime-174
    note: 目的不同；为索债而扣押人质的属于非法拘禁。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1375-1384
- id: crime-176
  name: 拐卖妇女、儿童罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第240条
  elements:
  - 以出卖为目的，拐骗、绑架、收买、贩卖、接送、中转妇女、儿童。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1384-1390
- id: crime-177
  name: 收买被拐卖的妇女、儿童罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第241条
  elements:
  - 收买被拐卖的妇女、儿童。
  - 作者认为本罪的保护法益与拐卖罪相同，法定刑本应相当。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1390-1394
- id: crime-178
  name: 聚众阻碍解救被收买的妇女、儿童罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第242条
  elements:
  - 首要分子聚集多人阻碍国家机关工作人员解救被收买的妇女、儿童。
  sources:
  - work: zmk-xingfaxue-7
    pages: '1394'
- id: crime-179
  name: 诬告陷害罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第243条
  elements:
  - 捏造犯罪事实向有关机关告发，意图使他人受刑事追究，情节严重。
  issues:
  - q-false-accusation-knowledge
  sources:
  - work: zmk-xingfaxue-7
    pages: 1394-1398
- id: crime-180
  name: 强迫劳动罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第244条
  elements:
  - 以暴力、威胁或者限制人身自由的方法强迫他人劳动；为此招募、运送人员或协助强迫的，同样处罚。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1398-1399
- id: crime-181
  name: 雇用童工从事危重劳动罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第244条之一
  elements:
  - 违反劳动管理法规，雇用未满 16 周岁的未成年人从事超强度体力劳动、高空井下作业或在危险环境下劳动，情节严重。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1399-1400
- id: crime-182
  name: 非法搜查罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第245条
  elements:
  - 无权搜查的人擅自对他人的身体或住宅进行搜查，或有权者滥用搜查权。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1400-1401
- id: crime-183
  name: 非法侵入住宅罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第245条
  elements:
  - 未经允许进入他人住宅，或经要求退出而拒不退出。
  - 本罪法益有「居住安宁（平稳）说」与「住宅权说」之争，见本卡所引页码。
  issues:
  - q-trespass-rechtsgut
  sources:
  - work: zmk-xingfaxue-7
    pages: 1401-1405
- id: crime-184
  name: 刑讯逼供罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第247条
  elements:
  - 司法工作人员对犯罪嫌疑人、被告人使用肉刑或变相肉刑逼取口供。
  - 致人伤残、死亡的，依故意伤害、故意杀人罪从重处罚。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1405-1407
- id: crime-185
  name: 暴力取证罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第247条
  elements:
  - 司法工作人员使用暴力逼取证人证言。
  sources:
  - work: zmk-xingfaxue-7
    pages: '1407'
- id: crime-186
  name: 虐待被监管人罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第248条
  elements:
  - 监管机构的监管人员对被监管人殴打或者体罚虐待，情节严重；也包括指使被监管人殴打、体罚虐待其他被监管人。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1407-1409
- id: crime-187
  name: 暴力干涉婚姻自由罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第257条
  legalInterest: 婚姻自由与人身自由。
  elements:
  - 以暴力干涉他人结婚或离婚的自由；未致人死亡的，告诉才处理。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1409-1410
- id: crime-188
  name: 虐待罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第260条
  legalInterest: 家庭成员身体的不可侵犯性与精神的健全。
  elements:
  - 对共同生活的家庭成员经常以打骂、冻饿、限制自由、凌辱人格等方法进行摧残、折磨，情节恶劣。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1410-1412
- id: crime-189
  name: 虐待被监护、看护人罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第260条之一
  elements:
  - 对未成年人、老年人、患病的人、残疾人等负有监护、看护职责的人，虐待被监护、看护的人，情节恶劣。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1412-1413
- id: crime-190
  name: 拐骗儿童罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第262条
  legalInterest: 未成年人的人身自由与身体安全（而非监护权）。
  elements:
  - 采用蒙骗、利诱等方法，使不满 14 周岁的未成年人脱离家庭或者监护人。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1413-1414
- id: crime-191
  name: 组织残疾人、儿童乞讨罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第262条之一
  elements:
  - 以暴力、胁迫手段组织残疾人或者不满 14 周岁的未成年人乞讨。
  sources:
  - work: zmk-xingfaxue-7
    pages: '1414'
- id: crime-192
  name: 组织未成年人进行违反治安管理活动罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯自由的犯罪
  area: sp-person
  article: 第262条之二
  elements:
  - 组织未成年人进行盗窃、诈骗、抢夺、敲诈勒索等违反治安管理的活动。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1414-1415
- id: crime-193
  name: 侮辱罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯名誉、隐私、信息的犯罪
  area: sp-person
  article: 第246条
  legalInterest: 他人的名誉。
  elements:
  - 以暴力或其他方法公然贬损他人人格、败坏其名誉，情节严重。
  - 原则上告诉才处理；严重危害社会秩序和国家利益的除外。
  related:
  - crime: crime-194
    note: 诽谤以散布捏造的事实为内容；侮辱不以捏造事实为必要。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1415-1418
- id: crime-194
  name: 诽谤罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯名誉、隐私、信息的犯罪
  area: sp-person
  article: 第246条
  legalInterest: 他人的名誉。
  elements:
  - 散布捏造的事实，足以败坏他人名誉，情节严重。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1418-1422
- id: crime-195
  name: 煽动民族仇恨、民族歧视罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯名誉、隐私、信息的犯罪
  area: sp-person
  article: 第249条
  elements:
  - 向不特定或多数人煽动民族仇恨、民族歧视，情节严重。
  sources:
  - work: zmk-xingfaxue-7
    pages: '1422'
- id: crime-196
  name: 出版歧视、侮辱少数民族作品罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯名誉、隐私、信息的犯罪
  area: sp-person
  article: 第250条
  elements:
  - 在出版物中刊载歧视、侮辱少数民族的内容，情节恶劣，造成严重后果。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1422-1423
- id: crime-197
  name: 侵犯公民个人信息罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯名誉、隐私、信息的犯罪
  area: sp-person
  article: 第253条之一
  elements:
  - 违反国家有关规定，向他人出售或提供公民个人信息，或窃取、以其他方法非法获取公民个人信息，情节严重。
  - 本罪保护法益存在争论，见本卡所引页码。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1423-1431
- id: crime-198
  name: 非法剥夺公民宗教信仰自由罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯民主权利的犯罪
  area: sp-person
  article: 第251条
  legalInterest: 公民的宗教信仰自由。
  elements:
  - 国家机关工作人员非法剥夺公民宗教信仰自由，情节严重。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1431-1432
- id: crime-199
  name: 侵犯少数民族风俗习惯罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯民主权利的犯罪
  area: sp-person
  article: 第251条
  legalInterest: 少数民族保持与改革本民族风俗习惯的权利。
  elements:
  - 国家机关工作人员以强制手段非法干涉、破坏少数民族风俗习惯，情节严重。
  sources:
  - work: zmk-xingfaxue-7
    pages: '1432'
- id: crime-200
  name: 侵犯通信自由罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯民主权利的犯罪
  area: sp-person
  article: 第252条
  elements:
  - 隐匿、毁弃或非法开拆他人信件，情节严重。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1432-1433
- id: crime-201
  name: 私自开拆、隐匿、毁弃邮件、电报罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯民主权利的犯罪
  area: sp-person
  article: 第253条
  elements:
  - 邮政工作人员私自开拆或者隐匿、毁弃邮件、电报。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1433-1434
- id: crime-202
  name: 报复陷害罪
  chapter: 侵犯公民人身权利、民主权利罪
  section: 侵犯民主权利的犯罪
  area: sp-person
  article: 第254条
  legalInterest: 公民的控告权、申诉权、批评监督权与举报权。
  elements:
  - 国家机关工作人员滥用职权、假公济私，对控告人、申诉人、批评人、举报人实行报复陷害。
