  - q-successive-nature
  - q-successive-liability
  - q-post-theft-robbery-precondition
  - q-home-robbery-purpose
  - q-robbery-completion
  related:
  - crime: crime-210
    note: 抢劫以压制被害人反抗的强制手段取得财物，抢夺则直接夺取。
  - crime: crime-213
    note: 敲诈勒索的胁迫程度未达到压制反抗，被害人仍有选择余地而交付财物。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1519-1549
