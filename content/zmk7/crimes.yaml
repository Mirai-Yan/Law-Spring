  section: 侵犯民主权利的犯罪
  area: sp-person
  article: 第255条
  elements:
  - 单位领导人对依法履行职责、抵制违反会计法统计法行为的会计、统计人员实行打击报复，情节恶劣。
  sources:
  - work: zmk-xingfaxue-7
    pages: '1435'
