  chapter: 侵犯财产罪
  section: 抢劫罪与抢夺罪
  area: sp-property
  article: 第268条
  elements:
  - 以非法占有为目的，聚众哄抢公私财物，数额较大或者有其他严重情节；只处罚首要分子和积极参加者。
