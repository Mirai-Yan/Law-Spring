- id: crime-013
  name: 放火罪、失火罪
  chapter: 危害公共安全罪
  section: 以危险方法危害公共安全的犯罪
  area: sp-public
  article: 第114条、第115条
  legalInterest: 公共安全，即不特定或多数人的生命、身体安全以及重大公私财产的安全。
  elements:
  - 放火罪：故意引起火灾，危害公共安全；尚未造成严重后果的适用第 114 条，致人重伤、死亡或使公私财产遭受重大损失的适用第 115 条第 1 款。
  - 失火罪：过失引起火灾，致人重伤、死亡或者使公私财产遭受重大损失。
  issues:
  - q-arson-completion
  sources:
  - work: zmk-xingfaxue-7
    pages: 1029-1033
