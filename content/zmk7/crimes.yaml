  - work: zmk-xingfaxue-7
    pages: 1558-1559
- id: crime-212
  name: 诈骗罪
  chapter: 侵犯财产罪
  section: 诈骗罪与敲诈勒索罪
  area: sp-property
  article: 第266条
  legalInterest: 财物的所有与占有以及财产性利益（作者采以经济的财产说为基础的折中说）。
  elements:
  - 构造：欺骗行为 → 对方产生（或维持）认识错误 → 基于认识错误处分财产 → 行为人或第三者取得财产 → 被害人遭受财产损失。
  - 以非法占有为目的，数额较大。
  issues:
  - q-fraud-property
  - q-fraud-disposal-awareness
  - q-triangle-fraud
  - q-crossing-statutes
  - q-fraud-whole-property
  related:
  - crime: crime-207
    note: 是否存在被害人（或受骗人）基于认识错误的处分行为。
  - crime: crime-213
    note: 诈骗利用认识错误，敲诈勒索利用恐惧心理。
  sources:
  - work: zmk-xingfaxue-7
    pages: 1559-1596
