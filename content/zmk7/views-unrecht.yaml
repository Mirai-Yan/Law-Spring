  - id: zmk7-just-principle
    work: zmk-xingfaxue-7
    question: q-just-principle
    pages: "292-295"
    answer: interest
    summary: >-
      作者认为违法阻却的根据与违法性的实质是一个问题的正反两面，应以法益侵害为中心理解违法阻却事由：
      依据「法益性阙如」原理（如被害人承诺）和「优越的利益（法益衡量）」原理（如正当防卫、紧急避险）阻却违法；并否认主观的正当化要素。
    reasons:
      - 目的说中「为了正当目的的适当手段」含义并不明确，容易导致以国家目的制约个人权利；衡量型目的说实际上与法益衡量说相差无几。
      - 社会相当性说依赖社会伦理秩序，与结果无价值论的立场不合。
    reported:
      - label: 目的说
        answer: purpose
        summary: 为了达到国家承认的共同生活目的而采取的适当手段，例外地阻却违法；内部又有衡量型与重视手段型之分。
        pages: "292"
      - label: 社会相当性说
        answer: social-adequacy
        summary: 在历史形成的社会伦理秩序范围内被允许的行为阻却违法；作者认为它属于行为无价值论的思路。
        pages: "292"

  - id: zmk7-defense-basis
    work: zmk-xingfaxue-7
    question: q-defense-basis
    pages: "297-298"
    answer: interest
    summary: >-
      作者不赞成以个人保全原理与法确证原理相结合的二元论说明正当防卫的正当化根据，而采优越的利益保护原理：
      不法侵害者的利益在防卫的必要限度内要保护性降低，防卫者保护的利益因而优越。
    reasons:
      - 个人保全原理无法说明为第三人、为公共利益实施的正当防卫。
      - 法确证原理内容空泛模糊，既可用来否定比例原则，又可用来限制防卫，几乎能由解释者任意填充，成了万能原理。
    reported:
      - label: 二元论（德国通说与判例）
        answer: dual-basis
        summary: 个人保全原理与法确证原理相结合说明正当防卫；在日本、韩国和我国也有赞成者。
        pages: "297"
      - label: 个人保全原理
        answer: individual
        summary: 受不法侵害攻击的个人可以采取必要手段保全自己，可以用社会契约论说明。
        pages: "297"
      - label: 法确证原理
        answer: rechtsbewaehrung
        summary: 法秩序即使受到侵害也不必退让，防卫在保护个人利益之外还确证了法秩序。
        pages: "297-298"

  - id: zmk7-defense-proportionality
    work: zmk-xingfaxue-7
    question: q-defense-proportionality
    pages: "319-325"
    answer: necessity-plus
    summary: >-
      作者依优越利益保护原理采「一体说」：只要结果不过当就不构成防卫过当；防卫限度以制止不法侵害的必要性为中心综合判断，
      不需要把手段的相当性设为防卫条件，但不能为保护微小利益而造成重大损害（如为一只笼中鸟、树上一个果子杀害盗窃者）。
    reasons:
      - 刑法第 20 条第 3 款不是特殊规定，而是对如何判断防卫限度的提示性规定。
      - 不能过分要求手段相适应，否则会把正当防卫不当地认定为防卫过当。
      - 要考虑不法侵害者在防卫过程中实施的新的暴力侵害，不能只把防卫行为与最初的侵害相比较。
    reported:
      - label: 基本相适应说
        answer: proportionality
        summary: 防卫行为造成的损害与不法侵害在轻重、大小上应大体相适应。
        pages: "319"
      - label: 必需说
        answer: no-balance
        summary: 以有效制止不法侵害的客观实际需要为限度，防卫强度可以大于、小于或相当于侵害强度。
        pages: "319"
      - label: 适当说
        answer: necessity-plus
        summary: 防卫行为正好足以制止不法侵害、又没有造成不应有的危害，主张把基本相适应说与必需说结合起来判断。
        pages: "319"

  - id: zmk7-necessity-nature
    work: zmk-xingfaxue-7
    question: q-necessity-nature
    pages: "333"
    answer: justification
    summary: >-
      作者原则上把紧急避险作为违法阻却事由：避险通常以损害较小法益保护较大法益，从法益衡量看阻却违法；
      不得已时损害与保护的法益价值相等，也没有造成法益侵害。只有以生命保护生命的避险，可能例外地只阻却责任。
    reasons:
      - 责任阻却事由说无法说明为无亲属关系的他人避险；若避险行为违法，对它就可以正当防卫，这不妥当。
      - 刑法第 21 条第 1 款并没有把紧急避险限定为违法阻却事由，因此可以原则上阻却违法、例外地阻却责任。
    reported:
      - label: 责任阻却事由说
        answer: excuse
        summary: 避险行为侵害了法益，是违法的，但行为人别无选择、缺乏期待可能性，因而阻却责任。
        pages: "333"
      - label: 违法阻却事由说
        answer: justification
        summary: 法益冲突且别无他法时，权衡后损害较小的法益，阻却实质的违法性。
        pages: "333"
      - label: 二分说
        answer: differentiated
        summary: 分为原则上阻却违法的二分说（德国通说）与原则上阻却责任的二分说。
        pages: "333"
      - label: 以阻却违法为中心的三分说
        answer: differentiated
        summary: 保护了更优越的利益且无民法上的违法性时阻却违法；有民法上的违法性时阻却可罚的违法性；保护等值法益时阻却责任。
        pages: "333"
    editorNote: 作者的表述是「原则上采取违法阻却事由说，例外地承认责任阻却事由」，例外主要指生命对生命的避险。

  - id: zmk7-life-vs-life
    work: zmk-xingfaxue-7
    question: q-life-vs-life
    pages: "340-342"
    answer: null
    summary: >-
      作者的初步看法是：所有人的生命等价，但要区分情形综合判断；对「不得已」的认定应极为严格。为保全生命而牺牲他人生命的避险，
      有的情形阻却违法（如被牺牲者同意牺牲自己保护他人），其余情形可能只阻却责任。
    reasons:
      - 人的生命不能作为他人的手段，但这并不意味着在任何生命冲突中牺牲他人都具有违法性。
    editorNote: 作者没有一概给出「正当化」或「免责」的结论，而是区分情形；具体情形见第 340—341 页。

  - id: zmk7-consent
    work: zmk-xingfaxue-7
    question: q-consent
    pages: "343-347"
    answer: no-interest
    summary: >-
      作者把被害人承诺归入「因法益性的阙如阻却违法」的事由：被害人允许他人侵害其可以处分的法益，表明其放弃了该法益和对它的保护；
      法律没有必要保护被放弃的法益，损害它的行为没有侵害法益，因而不违法。
    reasons:
      - 承诺须针对法益侵害的结果，只承诺行为而不承诺结果的，不能认为放弃了法益。
      - 关于受骗承诺，作者采法益关系错误说：只有对所放弃法益的种类、范围、危险程度发生错误时承诺才无效；关于承诺的有无，采意思方向说。

  - id: zmk7-pd-treatment
    work: zmk-xingfaxue-7
    question: q-pd-treatment
    pages: "332, 422-423"
    answer: negate-intent
    summary: >-
      作者认为，正当化事由的前提事实发生错误（如假想防卫）时，结论与限制责任说相同：行为人没有认识到不法事实，不成立故意；
      假想防卫要么只成立过失犯罪，要么属于意外事件。
    reasons:
      - 故意是对不法事实的认识与容认；误以为存在正当防卫状况的人，没有认识到自己行为的不法事实。
    reported:
      - label: 消极的构成要件要素理论
        answer: negate-intent
        summary: 违法阻却事由是消极的构成要件要素，对其前提事实的错误就是构成要件的错误，阻却故意；作者指出此理论本身没有被多数人认可。
        pages: "422"
      - label: 严格责任说
        answer: strict-culpability
        summary: 正当化事由的错误是禁止的错误，不影响故意，只在不可避免时阻却责任。
        pages: "422"
      - label: 限制责任说
        answer: negate-intent
        summary: 正当化事由前提事实的错误是事实的错误，而不是禁止的错误。
        pages: "422"
    editorNote: 作者注明，这一观点与消极的构成要件要素理论没有实质区别（第 423 页脚注）。

  - id: zmk7-tatbestand-function
    work: zmk-xingfaxue-7
    question: q-tatbestand-function
    pages: "172-180"
    answer: unrecht-type
    summary: >-
      作者基于违法类型说，认为只有表明违法行为类型的特征才属于构成要件；构成要件对大多数犯罪具有个别化机能，
      故意、过失等是责任类型的要素，不是构成要件的要素。
    reasons:
      - 采结果无价值论，不主张由构成要件实现犯罪的个别化，而由「犯罪类型」实现。
    reported:
      - label: 违法类型说
        answer: unrecht-type
        summary: 构成要件是违法行为的类型，使构成要件与违法性的关系更为密切（麦茨格尔等）。
        pages: "177"
      - label: 违法有责类型说
        answer: unrecht-schuld-type
        summary: 构成要件既包括违法要素，也包括表明责任要素的故意与过失。
        pages: "177"

  - id: zmk7-negative-elements
    work: zmk-xingfaxue-7
    question: q-negative-elements
    pages: "179-180, 423"
    answer: "no"
    summary: >-
      作者没有采用消极的构成要件要素理论，但认为自己的观点与该理论似乎没有本质区别：该理论可以把正当化事由的前提事实错误（如假想防卫）
      作为构成要件的错误处理，结论与作者相同；该理论是少数说，受到的批判是混淆了构成要件要素与正当化事由。
    editorNote: 第 423 页脚注说，作者关于正当化事由错误的观点「与消极的构成要件要素理论没有实质区别」。

  - id: zmk7-formal-material
    work: zmk-xingfaxue-7
    question: q-formal-material
    pages: "180"
    answer: material
    summary: >-
      作者认为，构成要件的违法类型性决定了必须对构成要件进行实质的解释：只有值得科处刑罚的法益侵害行为才符合构成要件；
      实质解释并不违反罪刑法定原则，它在用语可能含义的范围内进行。
    reasons:
      - 构成要件是违法类型，解释时必须以保护法益为指导，排除不具有可罚违法性的行为。

  - id: zmk7-causation-test
    work: zmk-xingfaxue-7
    question: q-causation-test
    pages: "261-290"
    answer: imputation
    summary: >-
      作者赞成「从存在论到规范论」的判断：先以条件关系确认事实上的因果关系，再作规范的结果归属；
      对实行行为缺乏定型性的单纯结果犯（如故意杀人），运用客观归责理论解决因果关系与结果归属比较合适；
      许多结果犯只要判断具体构成要件的符合性即可，因果关系已蕴含在构成要件的定型中。
    reasons:
      - 盗窃、诈骗等犯罪的构成要件本身要求对象的同一性，符合定型就能进行结果归属，不必逐一套用客观归责的规则。
      - 结果加重犯要求「危险的直接性关联」这种更严格的归属；我国刑法在一些场合又存在「缓和的结果归属」。
    editorNote: 作者在判断中也大量使用「行为危险的现实化」的表述（第 280—283 页）。

  - id: zmk7-duty-source
    work: zmk-xingfaxue-7
    question: q-duty-source
    pages: "222-233"
    answer: functional
    summary: >-
      作者从实质上说明作为义务的来源，并赞成保证人地位与作为义务的一体说：只有应当阻止危险而未排除或控制既存危险的不作为，才与作为相当。
      按不作为导致法益侵害的过程，作为义务分为三类：基于对危险源的支配产生的监督义务；法益处于无助状态、其保护具体依赖特定人时的保护义务；
      基于对特定领域的支配产生的阻止义务。
    reasons:
      - 单纯事实上可以控制危险源还不足以产生作为义务。
      - 「排他性支配设定」的实质仍然是法益存在紧迫的危险；没有紧迫危险就没有作为义务。

  - id: zmk7-prior-conduct
    work: zmk-xingfaxue-7
    question: q-prior-conduct
    pages: "227-229"
    answer: yes-all
    summary: >-
      作者认为，只要先前行为制造了法益侵害的危险，就会成为作为义务的来源，不要求先前行为本身违反义务。
      对正当防卫要分情形：防卫致人死亡也不过当，或伤害不可能导致死亡的，没有救助义务；防卫造成的伤害不过当但有导致死亡（从而过当）的紧迫危险时，应当肯定救助义务。
    reasons:
      - 德国否认正当防卫产生作为义务，是因为可以按「见危不救」罪处理；我国刑法没有规定这一犯罪，不能照搬。

  - id: zmk7-corp-possible
    work: zmk-xingfaxue-7
    question: q-corp-possible
    pages: "197-202"
    answer: "yes"
    summary: >-
      我国刑法规定单位可以成为犯罪的行为主体；作者认为单位犯罪是在单位整体意志支配下实施的，单位意志不同于个人意志的简单相加，
      并进一步认为国家机关事实上也完全可以实施犯罪。

  - id: zmk7-corp-model
    work: zmk-xingfaxue-7
    question: q-corp-model
    pages: "201-202"
    answer: null
    summary: >-
      作者认为，可以把我国刑法关于单位犯罪的规定理解为同一视理论与组织模式理论的结合：在决定层面，以直接负责的主管人员的行为认定单位行为，
      体现同一视理论；在具体实施层面，又反映出组织模式理论。同一视理论有利于处理单位经济犯罪，组织模式理论有利于处理单位公害犯罪。
    reported:
      - label: 同一视理论
        answer: identification
        summary: 把特定自然人（如单位的决策者）的犯罪视为单位犯罪，进而处罚单位。
        pages: "201"
    editorNote: 作者是对我国刑法规定的解读，没有在两种理论中只选其一，所以不归入单一答案。
