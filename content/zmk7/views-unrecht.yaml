# 违法性（不法）部分：张明楷《刑法学》（第七版）中的论述
bookViews:
  - id: zmk7-ad-treatment
    work: zmk-xingfaxue-7
    question: q-ad-treatment
    pages: "313-315"
    answer: acquit
    summary: >-
      作者坚持结果无价值论，认为偶然防卫不成立犯罪：行为人虽有犯罪故意，但客观上没有侵犯刑法保护的法益，
      反而在刑法允许的范围内保护了另一法益，既无实害也无危险，实质上属于不能犯。
    reasons:
      - 结果是否被刑法允许只能客观判断；偶然防卫造成的是刑法允许乃至鼓励的结果，不可能是犯罪既遂所要求的结果。
      - 行为无价值论的未遂说一面肯定好结果、一面禁止产生这一结果的行为，自相矛盾；对客观上完全相同的两个挽救行为，仅因认识不同就作出相反评价。
      - 结果无价值论的未遂说既已承认不要求防卫意识，偶然防卫就已符合正当防卫的条件；把行为人没有认识到的客观事实纳入判断后，造成侵害的盖然性几乎为零。
      - 二分说把保护他人与保护自己区别对待，掺入了伦理判断；两种防卫在刑法上完全等价。
      - 即便依刑法第 20 条的文字认为防卫意识是正当防卫的要件，不成立正当防卫也不等于直接以犯罪论处。
    reported:
      - label: 行为无价值论的既遂说
        answer: completed
        summary: 正当防卫以防卫意识为要件；偶然防卫欠缺防卫意识且造成了侵害结果，成立犯罪既遂。
        pages: "313"
      - label: 二元论的未遂说
        answer: attempt
        theory: dual-act-disvalue
        summary: 要求防卫意识；偶然防卫造成的是正当的结果，缺乏结果无价值，但存在行为无价值，成立未遂。
        pages: "313"
      - label: 结果无价值论的未遂说
        answer: attempt
        theory: result-disvalue
        summary: 不要求防卫意识，但侵害结果之所以没有发生只是出于偶然，行为仍有侵害法益的危险，成立未遂。
        pages: "313"
      - label: 结果无价值论的二分说
        answer: null
        theory: result-disvalue
        summary: 为他人防卫（紧急救助型）的偶然防卫是正当防卫；为自己防卫的偶然防卫成立未遂。
        pages: "313"
      - label: 结果无价值论的无罪说
        answer: acquit
        theory: result-disvalue
        summary: 不要求防卫意识，偶然防卫成立正当防卫。
        pages: "313"
    editorNote: 书中把分歧归结为三点：正当防卫是否需要防卫意识、如何判断行为的危险、违法性的实质是什么。

  - id: zmk7-ad-intent-required
    work: zmk-xingfaxue-7
    question: q-ad-intent-required
    pages: "309-310"
    answer: not-required
    summary: >-
      作者采防卫意识不要说：行为符合正当防卫的客观条件时，客观上保护了法益、没有违反法规范，缺乏违法性的根据；
      不能把「主客观相一致」从成立犯罪的要求倒过来套用到排除犯罪的事由上。
    reasons:
      - 成立犯罪要求主客观相一致，不意味着不成立犯罪的行为也必须主客观相一致；只要不符合犯罪成立条件，就不成立犯罪。
      - 没有防卫意识但符合客观条件时，最多只有「心情无价值」，并无行为无价值；反过来要求阻却事由主客观一致，等于主客观条件只具其一就可成立犯罪。
      - 退一步说，即使把防卫意识当作正当防卫的条件，欠缺它也只是不成立正当防卫，不能直接推出成立犯罪。
      - 刑法第 20 条「为了保护……」可以理解为表示客观原因的表述。
    reported:
      - label: 我国传统刑法理论
        answer: required
        summary: 具有防卫意识（主观的正当化要素）时才可能成立正当防卫；相关司法文件也要求准确把握防卫的「意图条件」。
        pages: "309"
      - label: 必要说
        answer: required
        theory: dual-act-disvalue
        summary: 防卫行为是主客观的统一体；只有既无行为无价值、也无结果无价值时才合法，偶然防卫至少存在行为无价值。
        pages: "310"
      - label: 不要说
        answer: not-required
        theory: result-disvalue
        summary: 只要符合正当防卫的客观条件，行为客观上就保护了法益，缺乏违法性的根据（法益侵害）。
        pages: "310"

  - id: zmk7-ad-intent-content
    work: zmk-xingfaxue-7
    question: q-ad-intent-content
    pages: "309-310"
    answer: cognition
    summary: >-
      作者本人不要求防卫意识；在说明防卫意识的内容时，认为其重点在于防卫认识：只要行为人认识到自己是在与正在进行的不法侵害相对抗，
      就具有防卫意识，这有利于把出于兴奋、愤怒等实施的防卫认定为正当防卫。
    reasons:
      - 以认识为重点，可以避免因防卫人情绪激动、动机混杂而否定正当防卫。
    reported:
      - label: 一般说明
        answer: null
        summary: 防卫意识包括防卫认识（认识到不法侵害正在进行）与防卫意志（出于保护合法权益免受侵害的目的）。
        pages: "309"
    editorNote: 作者在上一问题上采不要说，这里的结论是在讨论防卫意识内容时的立场。

  - id: zmk7-task
    work: zmk-xingfaxue-7
    question: q-task
    pages: "156-158"
    answer: rechtsgut
    summary: >-
      作者认为依我国刑法，刑法的任务与目的是保护法益；反过来，侵害或威胁法益就是刑法禁止某种行为的根据，即违法性的实质。
    reasons:
      - 法益侵害说本身要求行为侵害或威胁了法益才能处罚，单纯的危险想法不可能侵害法益，因此它反对而不是贯彻主观主义。
      - 法益侵害说不是「只要有法益侵害就违法」的形式判断，立法和司法都要选定值得科处刑罚的具体法益侵害。
      - 法益保护只在罪刑法定原则的框架内进行。
    reported:
      - label: 法规范维护说
        answer: ethic
        summary: 刑法的目的在于维护规范的效力；以保护法益为目的会把危险的主观想法当作犯罪处罚，导致处罚扩大。
        pages: "156-158"

  - id: zmk7-objective-wrong
    work: zmk-xingfaxue-7
    question: q-objective-wrong
    pages: "158-159"
    answer: objective
    summary: >-
      作者采客观的违法性论：违法性的实质是法益侵害与威胁，与行为人的主观能力、有无故意过失无关；精神病人杀人与常人杀人在侵害生命这一点上没有差别。
    reasons:
      - 判断违法与否的规范只是评价规范，不必包括意思决定规范。
      - 有利于区分违法性与有责性，避免笼统地判断是否构成犯罪。
      - 可以顺理成章地对精神病人的侵害行为进行制止乃至防卫，并把其盗窃所得评价为违法所得。
    reported:
      - label: 客观的违法性论
        answer: objective
        summary: 评价规范对应违法性，意思决定规范对应责任；无责任能力者的侵害行为也是违法的，可以对其正当防卫。
        pages: "159"
      - label: 主观的违法性论（命令说）
        answer: subjective
        summary: 刑法规范是对行为人的意思决定规范，只有能够理解规范的有责任能力者的行为才谈得上违法，不法与责任融为一体。
        pages: "159"
      - label: 新的客观的违法性论
        answer: objective
        summary: 评价规范与意思决定规范都是违法判断的基准；违法是违反针对抽象一般人的命令，责任是违反针对具体行为人的命令。
        pages: "159"

