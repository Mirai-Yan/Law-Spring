        pages: "159"

  - id: zmk7-unrecht-core
    work: zmk-xingfaxue-7
    question: q-unrecht-core
    pages: "160-166"
    answer: result
    summary: >-
      作者采结果无价值论：刑法的目的与任务是保护法益，违法性的根据是法益侵害及其危险；没有造成法益侵害或危险的行为，
      即使违反伦理、缺乏社会相当性或违反某种行为规则，也不是刑法处罚的对象；故意、过失是责任要素。
    reasons:
      - 刑法目的明确：没有侵害、威胁法益，刑法就不得干预，不至于用刑法推行伦理，有利于保障行为自由，这在价值多元的时代尤其重要。
      - 违法判断清晰：判断资料限于客观事实。
      - 刑法按行为方式规定不同罪名，是罪刑法定要求类型化的结果，并不表明立法者重视行为无价值。
    reported:
      - label: 一元的行为无价值论
        answer: monist-act
        theory: monist-act-disvalue
        summary: 行为的目的、故意、过失与行为样态决定违法性，结果只是客观处罚条件；作者指出现在采此说的学者极少。
        pages: "161"
      - label: 二元论（社会相当性说、行为规范违反说等）
        answer: dual
        theory: dual-act-disvalue
        summary: 违法性的根据兼有结果无价值与行为无价值，二者的侧重因学者而异。
        pages: "161-163"

  - id: zmk7-intent-position
    work: zmk-xingfaxue-7
    question: q-intent-position
    pages: "165-166"
    answer: schuld
    summary: >-
      作者不赞成把故意作为违法要素或不法的组成部分，故意属于责任要素。
    reasons:
      - 构成要件符合性与违法性需要分开判断；正当防卫致人死亡时同样具备「构成要件故意」，可见它并不说明行为更严重地违反了刑法保护的规范。
      - 把故意作为违法要素，与主观的违法论只有一纸之隔，而且会使违法判断几乎总是得出肯定结论。
    reported:
      - label: 行为无价值论
        answer: unrecht
        summary: 故意是违法要素而不是责任要素，或者构成要件故意是违法要素、责任故意是责任要素。
        pages: "165"

  - id: zmk7-su-exists
    work: zmk-xingfaxue-7
    question: q-su-exists
    pages: "159, 534, 1459"
    answer: none
    summary: >-
      作者暂不承认主观的违法要素，把目的犯的目的等主观内容作为责任要素处理；同时指出，即使承认目的犯的目的是主观的违法要素，也不影响客观违法论的成立。
    reasons:
      - 违法性的实质是客观的法益侵害与危险，判断资料原则上限于客观事实。
    editorNote: 第 1459 页的说法是「暂不承认」，讨论的是财产犯罪中的非法占有目的。

