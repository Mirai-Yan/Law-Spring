# 责任：责任的本质、违法性认识、原因自由行为、责任能力、严格责任与责任主义
# 起草：AI（Claude）。全部为 draft；日本判例与台湾地区 2005 年修法的条文表述尤需核实。

concepts:
  - id: culpability-essence
    name: 责任的本质
    original:
      de: Schuldbegriff（psychologisch / normativ / funktional）
      ja: 責任の本質
      en: culpability / blameworthiness
    kind: foundation
    area: schuld
    tradition: both
    summary: >-
      责任的根据是道义上的非难，还是社会防卫的需要？责任的结构是心理事实（故意、过失），是规范的非难可能性，还是由预防需要决定？
      从癖马案与弗兰克的规范责任论，到目的行为论的纯粹规范责任论，再到罗克辛的答责性与雅科布斯的功能责任论。期待可能性是这一专题的核心概念。

  - id: mistake-of-law
    name: 违法性认识（法律认识错误）
    original:
      de: Verbotsirrtum / Unrechtsbewusstsein
      ja: 違法性の意識
      en: ignorance / mistake of law
    kind: problem
    area: schuld
    tradition: both
    summary: >-
      行为人不知道自己的行为违法，是否影响责任？违法性认识是故意的要素（故意说），还是独立的责任要素（责任说）？
      「不知法不免责」的古老法谚在大陆法上被责任说修正，在英美法上则通过正当程序与信赖官方意见的抗辩被有限地松动。

  - id: alic
    name: 原因自由行为
    original:
      de: actio libera in causa
      ja: 原因において自由な行為
      en: prior fault / voluntary intoxication
    kind: problem
    area: schuld
    tradition: both
    summary: >-
      行为人故意或过失地使自己陷入无责任能力状态，并在该状态下实施犯罪（典型是醉酒）。按照「行为与责任同时存在」的原则本应无罪，
      原因自由行为理论试图说明为什么仍然可以处罚：把原因行为视为实行行为（构成要件模式），还是承认同时存在原则的例外（例外模式）。

  - id: insanity
    name: 责任能力（精神障碍）
    original:
      de: Schuldfähigkeit（§ 20 StGB）
      ja: 責任能力（心神喪失・心神耗弱）
      en: insanity defence
    kind: problem
    area: schuld
    tradition: both
    summary: >-
      精神障碍在什么条件下排除或减轻刑事责任：生物学方法、心理学方法，还是混合方法？
      英美法从 M'Naghten 规则出发，在认知标准、意志标准（不可抗拒的冲动）与「产物」标准之间反复摇摆。

  - id: strict-liability
    name: 严格责任与责任主义
    original:
      de: Schuldprinzip
      ja: 責任主義
      en: strict liability / mens rea presumption
    kind: problem
    area: schuld
    tradition: both
    summary: >-
      「无责任则无刑罚」：能否在不要求任何故意或过失的情况下追究刑事责任？
      大陆法把责任主义视为宪法层次的原则；英美法则在公共福利犯罪等领域广泛承认严格责任，同时以「犯意推定」加以限制。

questions:
  - id: q-culp-ground
    concept: culpability-essence
    text: 责任的根据是道义上的非难（道义责任论），还是社会防卫的需要（社会责任论）？
    level: foundation
    aliases:
      - 道义责任论
      - 社会责任论
      - 人格责任论
      - 责任的根据
      - 性格责任论
    answers:
      - id: moral
        label: 道义责任论
      - id: social
        label: 社会责任论
      - id: character
        label: 人格责任论

  - id: q-culp-essence
    concept: culpability-essence
    text: 责任是心理事实（心理责任论）、规范的非难可能性（规范责任论），还是由预防需要决定的（功能责任论）？
    level: foundation
    aliases:
      - 心理责任论
      - 规范责任论
      - 功能责任论
      - 责任的本质
      - 非难可能性
      - 答责性
    answers:
      - id: psychological
        label: 心理责任论
      - id: normative
        label: 规范责任论
      - id: functional
        label: 功能责任论（含答责性理论）

  - id: q-expectability
    concept: culpability-essence
    text: 期待可能性能否作为超法规的责任阻却事由？
    level: applied
    aliases:
      - 期待可能性
      - 癖马案
      - 超法规的责任阻却事由
      - 期待不可能
      - 缺乏期待可能性
    answers:
      - id: "yes"
        label: 可以
      - id: statutory-only
        label: 只能在法定事由的范围内考虑
      - id: "no"
        label: 不承认期待可能性的独立地位

  - id: q-mistake-of-law
    concept: mistake-of-law
    text: 违法性认识（或其可能性）在犯罪论中处于什么地位？
    level: intermediate
    aliases:
      - 违法性认识
      - 法律认识错误
      - 不知法不免责
      - 故意说 责任说
      - 违法性认识的可能性
      - 禁止错误
    answers:
      - id: strict-intent
        label: 严格故意说（现实的违法性认识是故意的要素）
      - id: limited-intent
        label: 限制故意说（违法性认识的可能性是故意的要素）
      - id: culpability
        label: 责任说（违法性认识的可能性是独立的责任要素）
      - id: irrelevant
        label: 不要说（不知法不免责）

  - id: q-reliance-on-advice
    concept: mistake-of-law
    text: 行为人信赖官方意见、判例或律师意见而误认为行为合法时，能否阻却责任？
    level: applied
    aliases:
      - 信赖官方意见
      - 信赖律师意见
      - 违法性认识错误不可避免
      - 官方许可
      - 合规意见
      - 赵春华案
    answers:
      - id: excused
        label: 错误不可避免，阻却责任
      - id: not-excused
        label: 原则上不阻却（自担风险）

  - id: q-alic-model
    concept: alic
    text: 原因自由行为的可罚根据是什么：构成要件模式，还是例外模式？
    level: intermediate
    aliases:
      - 原因自由行为
      - 构成要件模式
      - 例外模式
      - 行为与责任同时存在原则
      - actio libera in causa
    answers:
      - id: tatbestand
        label: 构成要件模式（原因行为就是实行行为）
      - id: exception
        label: 例外模式（同时存在原则的例外）
      - id: rejected
        label: 不承认（违反同时存在原则）

  - id: q-intoxication
    concept: alic
    text: 自愿醉酒者在无责任能力状态下实施的犯罪应如何处理？
    level: applied
    aliases:
      - 醉酒的人犯罪
      - 醉酒 刑事责任
      - 自愿醉酒
      - Majewski
      - 完全醉酒罪
      - 刑法第18条第4款
    answers:
      - id: full-liability
        label: 一律负完全的刑事责任
      - id: alic
        label: 依原因自由行为理论处理
      - id: separate-offense
        label: 另设醉酒状态下的犯罪（完全醉酒罪）
      - id: basic-intent
        label: 区分特定意图犯与基本意图犯（Majewski）

  - id: q-insanity-method
    concept: insanity
    text: 责任能力（精神障碍）应采生物学方法、心理学方法，还是混合方法判断？
    level: intermediate
    aliases:
      - 责任能力
      - 精神病人犯罪
      - 刑事责任能力的判断
      - 辨认能力 控制能力
      - 混合方法
      - 心神丧失 心神耗弱
    answers:
      - id: biological
        label: 生物学方法（只看是否患有精神疾病）
      - id: psychological
        label: 心理学方法（只看辨认、控制能力）
      - id: mixed
        label: 混合方法（精神障碍导致辨认或控制能力丧失）

  - id: q-insanity-test
    concept: insanity
    text: 英美法上的精神失常抗辩应采何种标准？
    level: applied
    aliases:
      - M'Naghten 规则
      - 麦克诺顿规则
      - insanity defense
      - 精神失常抗辩
      - Durham rule
      - 不可抗拒的冲动
      - Hinckley 案
    answers:
      - id: mnaghten
        label: M'Naghten 规则（认知标准）
      - id: irresistible
        label: 不可抗拒的冲动（加入意志标准）
      - id: product
        label: Durham 规则（行为是精神疾病的产物）
      - id: mpc
        label: MPC 标准（缺乏辨认违法性或使行为合乎法律的实质能力）

  - id: q-strict-liability
    concept: strict-liability
    text: 能否在不要求任何故意或过失的情况下追究刑事责任？
    level: intermediate
    aliases:
      - 严格责任
      - 绝对责任
      - 责任主义
      - 无罪过责任
      - strict liability
      - 公共福利犯罪
    answers:
      - id: never
        label: 不能（无责任则无刑罚）
      - id: regulatory
        label: 在公共福利犯罪等轻微犯罪中可以
      - id: presumed-fault
        label: 只能推定过失，允许反证

  - id: q-statutory-mens-rea
    concept: strict-liability
    text: 法律条文没有写明罪过要求时，法院是否应推定需要犯意？
    level: applied
    aliases:
      - 犯意推定
      - Sweet v Parsley
      - Morissette
      - 条文未规定罪过
    answers:
      - id: presume
        label: 推定需要犯意
      - id: literal
        label: 按条文字面，不要求犯意

prerequisites:
  - question: q-culp-ground
    requires: q-free-will
    kind: foundational
    why: 能否对行为人进行道义上的非难，取决于他是否能够自由地选择。
    branches:
      - answer: free-will
        leadsTo: 行为人本可以选择不犯罪 → 道义责任论。
      - answer: determinism
        leadsTo: 非难没有意义，责任只是社会对危险性格采取防卫措施的根据 → 社会责任论。
      - answer: soft
        leadsTo: 以相对的意志自由为前提，非难行为人人格形成中可归责的部分 → 人格责任论（团藤）。

  - question: q-culp-ground
    requires: q-school
    kind: foundational
    why: 责任论是学派之争最集中的战场之一。
    branches:
      - answer: act
        leadsTo: 非难的对象是个别行为 → 道义责任论（行为责任）。
      - answer: actor
        leadsTo: 责任针对行为人的危险性格 → 社会责任论（性格责任）。
      - answer: mixed
        leadsTo: 人格责任论。

  - question: q-culp-essence
    requires: q-culp-ground
    kind: logical
    why: 责任的结构如何，要先看责任的根据是什么。
    branches:
      - answer: moral
        leadsTo: 非难需要「本可以合法行为」的前提 → 规范责任论。
      - answer: social
        leadsTo: 责任由社会防卫的需要决定 → 接近功能的理解。
      - answer: character
        leadsTo: 在规范责任论的框架内考虑人格形成。

  - question: q-culp-essence
    requires: q-punish-basis
    kind: foundational
    why: 责任与刑罚目的的关系，决定了责任是先于刑罚的事实，还是由刑罚目的界定的概念。
    branches:
      - answer: retribution
        leadsTo: 报应以非难可能性为前提 → 规范责任论。
      - answer: general-prevention
        leadsTo: 责任由维护规范信赖的需要来界定 → 功能责任论（雅科布斯）。
      - answer: special-prevention
        leadsTo: 责任让位于行为人的危险性。
      - answer: union
        leadsTo: 责任是刑罚的上限，预防必要性是第二个条件 → 答责性（罗克辛）。

  - question: q-expectability
    requires: q-culp-essence
    kind: logical
    why: 期待可能性是规范责任论的核心要素；问题在于能否超出法定事由适用。
    branches:
      - answer: normative
        leadsTo: 期待可能性是责任的一般要素，部分学者主张可以超法规地阻却责任；但为了法的安定性，多数德国学者只在法定事由内考虑。
      - answer: psychological
        leadsTo: 责任只是故意与过失，期待可能性没有独立地位。
      - answer: functional
        leadsTo: 是否免责取决于预防的需要，而不是行为人「能否」做出其他选择。

  - question: q-mistake-of-law
    requires: q-intent-position
    kind: systematic
    why: 违法性认识放在哪里，取决于故意本身放在哪里。
    branches:
      - answer: unrecht
        leadsTo: 故意在构成要件阶层，只是对事实的认识；违法性认识的可能性留在责任阶层 → 责任说。
      - answer: double
        leadsTo: 构成要件故意不包括违法性认识 → 责任说。
      - answer: schuld
        leadsTo: 故意是责任形式，可以把违法性认识（或其可能性）作为故意的要素 → 故意说。

  - question: q-mistake-of-law
    requires: q-culp-essence
    kind: logical
    why: 违法性认识的地位，是心理责任论与规范责任论分歧的直接体现。
    branches:
      - answer: psychological
        leadsTo: 责任即心理事实，违法性的认识是故意这一心理事实的一部分 → 故意说。
      - answer: normative
        leadsTo: 非难的根据是「本可以认识到违法」→ 违法性认识的可能性就够了，且独立于故意 → 责任说（或限制故意说）。
      - answer: functional
        leadsTo: 以预防的需要判断错误是否可避免。

  - question: q-reliance-on-advice
    requires: q-mistake-of-law
    kind: logical
    why: 信赖官方或专业意见的情形，是判断违法性认识错误是否「不可避免」的典型场合。
    branches:
      - answer: culpability
        leadsTo: 只要错误不可避免（尽到了查询义务，信赖了有权机关的意见），就阻却责任。
      - answer: limited-intent
        leadsTo: 欠缺违法性认识的可能性时阻却故意。
      - answer: strict-intent
        leadsTo: 欠缺现实的违法性认识即阻却故意。
      - answer: irrelevant
        leadsTo: 原则上不阻却；英美法通过信赖官方意见等抗辩例外地免责。

  - question: q-alic-model
    requires: q-culp-essence
    kind: logical
    why: 同时存在原则本身来自责任主义；原因自由行为是否构成例外，要看责任的结构。
    branches:
      - answer: normative
        leadsTo: 非难针对的是行为时的意志形成，因此必须说明原因行为时的责任如何延续到结果 → 构成要件模式或例外模式。
      - answer: psychological
        leadsTo: 故意、过失存在于原因行为时，可以直接以原因行为为基础。
      - answer: functional
        leadsTo: 自陷无能力的人仍有预防的必要 → 容易承认可罚性。

  - question: q-alic-model
    requires: q-commencement
    kind: logical
    why: 构成要件模式把原因行为（如饮酒）视为实行行为，这必须与实行着手的理论相协调。
    branches:
      - answer: formal
        leadsTo: 饮酒不是构成要件行为本身 → 构成要件模式难以成立。
      - answer: material-act
        leadsTo: 原因行为如果已经具有导致结果的现实危险，可以视为实行行为。
      - answer: material-result
        leadsTo: 着手要求结果发生的危险迫切，饮酒时通常还谈不上着手 → 构成要件模式难以成立，倾向例外模式。
      - answer: individual
        leadsTo: 按行为人的计划，开始饮酒即直接接近构成要件的实现 → 可能承认构成要件模式。
      - answer: subjective
        leadsTo: 犯意在原因行为时已经表现出来 → 容易承认。

  - question: q-intoxication
    requires: q-alic-model
    kind: logical
    why: 醉酒犯罪是原因自由行为最典型的适用场合，但很多立法另行处理。
    branches:
      - answer: tatbestand
        leadsTo: 只能处理在饮酒时已经有犯罪故意或过失的情形；其他情形需要立法（如完全醉酒罪）。
      - answer: exception
        leadsTo: 可以较广泛地处罚，但面临违反责任主义的批评。
      - answer: rejected
        leadsTo: 只能通过另设醉酒犯罪来处罚。

  - question: q-intoxication
    requires: q-culp-ground
    kind: foundational
    why: 自愿醉酒者是否「应得」完全的刑罚，取决于责任的根据。
    branches:
      - answer: moral
        leadsTo: 行为时无法辨认、控制，原则上不能非难；需要原因自由行为或特别立法。
      - answer: social
        leadsTo: 醉酒者的危险性不因醉酒而降低 → 可以负完全的刑事责任。
      - answer: character
        leadsTo: 自陷醉酒是人格中可归责的部分。

  - question: q-insanity-method
    requires: q-culp-essence
    kind: logical
    why: 责任能力是责任的前提，判断方法取决于责任要求的是什么。
    branches:
      - answer: normative
        leadsTo: 非难的前提是能够认识违法并据此控制行为 → 关注辨认与控制能力，以精神障碍为基础 → 混合方法。
      - answer: psychological
        leadsTo: 责任能力是故意、过失的前提条件，强调认识能力。
      - answer: functional
        leadsTo: 以是否能通过刑罚进行规范的沟通为准。

  - question: q-insanity-method
    requires: q-culp-ground
    kind: foundational
    why: 社会责任论下，责任能力的意义完全不同。
    branches:
      - answer: moral
        leadsTo: 责任能力是非难可能性的前提。
      - answer: social
        leadsTo: 责任能力只是「刑罚适应能力」；无能力者同样是社会防卫的对象，只是适用保安处分而非刑罚。
      - answer: character
        leadsTo: 以人格的主体性为准。

  - question: q-insanity-test
    requires: q-insanity-method
    kind: conceptual
    why: 英美法的各种标准都是混合方法的变体，分歧在于心理学要件的内容。
    branches:
      - answer: mixed
        leadsTo: M'Naghten 只承认认知要素；不可抗拒的冲动与 MPC 加入意志（控制）要素。
      - answer: biological
        leadsTo: 接近 Durham 规则：只要行为是精神疾病的产物即可。
      - answer: psychological
        leadsTo: 只看辨认与控制能力。

  - question: q-strict-liability
    requires: q-desert-limit
    kind: foundational
    why: 能否处罚没有责任的人，取决于责任在刑罚中扮演什么角色。
    branches:
      - answer: ground
        leadsTo: 责任是刑罚的根据 → 不能处罚无责任者。
      - answer: upper-limit
        leadsTo: 责任是刑罚的前提与上限 → 不能处罚无责任者（大陆法的宪法原则）。
      - answer: none
        leadsTo: 纯粹预防论下，严格责任可以以威慑效果与执法效率正当化（英美公共福利犯罪的逻辑）。

  - question: q-strict-liability
    requires: q-culp-essence
    kind: logical
    why: 责任是不是刑事责任不可缺少的要素，取决于责任的本质。
    branches:
      - answer: normative
        leadsTo: 没有非难可能性就没有责任 → 不能。
      - answer: psychological
        leadsTo: 没有故意或过失就没有责任 → 不能。
      - answer: functional
        leadsTo: 责任由预防需要决定，理论上为严格责任留出了空间。

  - question: q-statutory-mens-rea
    requires: q-strict-liability
    kind: logical
    why: 条文沉默时如何解释，是严格责任在实务中的主要战场。
    branches:
      - answer: never
        leadsTo: 当然推定需要故意或过失。
      - answer: regulatory
        leadsTo: 对传统的「真正犯罪」推定需要犯意，对公共福利犯罪可以按字面解释。
      - answer: presumed-fault
        leadsTo: 推定过失，允许被告人证明自己尽到了注意。

relations:
  - from: strict-liability
    to: culpability-essence
    type: opposes
    description: 严格责任与责任主义正面对立：前者允许没有责任的刑罚，后者认为无责任则无刑罚。
  - from: alic
    to: insanity
    type: derived_from
    description: 原因自由行为以行为时欠缺或减弱的责任能力为前提，是对「行为与责任同时存在」原则的修正。
  - from: mistake-of-law
    to: mistake-of-fact
    type: symmetric
    description: 事实错误与法律错误是错误论的两极；假想防卫这类「对正当化前提事实的错误」恰好处在两者之间。

