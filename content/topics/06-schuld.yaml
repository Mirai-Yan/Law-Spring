events:
  # ---------------- 责任的本质 ----------------
  - id: e-de-leinenfaenger-1897
    year: 1897
    jurisdiction: de
    type: case
    title: 癖马案
    description: 马车夫明知马有用尾巴缠绕缰绳的恶癖，向雇主提出更换未果，因担心失业只得继续驾驶，结果马失控伤人。帝国法院认为不能期待他冒着失业的风险拒绝驾驶，否定了过失责任。这一判决成为期待可能性思想的源头。
    concepts: [culpability-essence]
    works: [w-rgst-30-25]

  - id: e-de-frank-1907
    year: 1907
    jurisdiction: de
    type: origin
    originOf: culpability-essence
    originType: term
    title: 弗兰克：责任即非难可能性
    description: 责任不只是故意或过失这种心理关系，而是对行为人的「非难可能性」；附随情况的正常性（能否期待行为人实施合法行为）也是责任的要素。规范责任论由此诞生。
    concepts: [culpability-essence]
    scholars: [frank]
    works: [w-frank-1907]
    derivedFrom: [e-de-leinenfaenger-1897]

  - id: e-de-freudenthal-1922
    year: 1922
    jurisdiction: de
    type: development
    title: 弗洛伊登塔尔：期待不可能作为超法规的责任阻却事由
    description: 在不能期待行为人实施合法行为的场合，即使没有法律规定，也应阻却责任。这一主张后来在德国受到「法的安定性」的批评，却在日本获得广泛支持。
    concepts: [culpability-essence]
    scholars: [freudenthal]
    works: [w-freudenthal-1922]
    derivedFrom: [e-de-frank-1907, e-de-goldschmidt-1913]
    needsSource: true

  - id: e-jp-kashiwajima-1933
    year: 1933
    jurisdiction: jp
    type: case
    title: 第五柏岛丸案
    description: 渡船严重超载导致翻覆，大审院在量刑上考虑了船长受到的经营压力与警察管理的放任，只判处罚金。这被视为日本判例考虑期待可能性的先例。
    concepts: [culpability-essence]
    works: [w-jp-kashiwajima-1933]
    derivedFrom: [e-de-frank-1907]
    needsSource: true

  - id: e-jp-saeki-1947
    year: 1947
    jurisdiction: jp
    type: reception
    title: 期待可能性理论在日本的系统化
    description: 佐伯千仞系统介绍并发展期待可能性理论，主张期待不可能可以作为超法规的责任阻却事由。
    concepts: [culpability-essence]
    scholars: [saeki-chihiro]
    works: [w-saeki-1947]
    derivedFrom: [e-de-freudenthal-1922]
    needsSource: true

  - id: e-de-roxin-1973
    year: 1973
    jurisdiction: de
    type: development
    title: 罗克辛：答责性
    description: 刑法上的答责性由两部分组成：责任（能够受规范召唤而仍然实施不法），以及预防上的处罚必要性。责任是刑罚的必要条件，但不是充分条件。
    concepts: [culpability-essence]
    scholars: [roxin]
    works: [w-roxin-1973]
    derivedFrom: [e-de-frank-1907]
    needsSource: true

  - id: e-de-jakobs-1976
    year: 1976
    jurisdiction: de
    type: development
    title: 雅科布斯：责任与预防
    description: 责任不是先于刑罚目的的事实，而是由一般预防的需要决定的：当为了维护规范的效力需要把冲突归咎于行为人时，行为人就有责任。功能责任论由此提出。
    concepts: [culpability-essence]
    scholars: [jakobs]
    works: [w-jakobs-1976]
    derivedFrom: [e-de-frank-1907]

  # ---------------- 违法性认识 ----------------
  - id: e-uk-esop-1836
    year: 1836
    jurisdiction: uk-ew
    type: origin
    originOf: mistake-of-law
    originType: case
    title: R v Esop：不知法不免责
    description: 一名巴伐利亚船员在英国船上实施了在其本国不违法、在英国却构成犯罪的行为。法院认为，不知道英国法律不能作为抗辩。「不知法不免责」由此在普通法判例中得到确认。
    concepts: [mistake-of-law]
    works: [w-esop-1836]
    editorNote: 「法律的错误有害」（error iuris nocet）的法谚可以追溯到罗马法。

  - id: e-us-lambert-1957
    year: 1957
    jurisdiction: us
    type: case
    title: Lambert v. California：正当程序对「不知法」的有限保护
    description: 洛杉矶要求有前科者到警察局登记的条例被适用于一名完全不知道该义务的被告人。联邦最高法院认为，对这种纯粹的不作为义务，在行为人不知道且无从知道时科处刑罚，违反正当程序。
    concepts: [mistake-of-law]
    works: [w-lambert-1957]
    derivedFrom: [e-uk-esop-1836]

  - id: e-tw-2005-code
    year: 2005
    jurisdiction: tw
    type: legislation
    title: 刑法总则大幅修正（2005 年）：不能未遂不罚等
    description: >-
      2005 年修正、2006 年施行的总则改动很多：不能未遂改为不罚（第 26 条，「行为不能发生犯罪之结果，又无危险者，不罚」，立法理由采客观未遂论）；删除先行行为的明文规定（第 15 条）；
      违法性认识错误「有正当理由而无法避免者」免除刑事责任（第 16 条，采责任说的思路）；
      责任能力改采混合方法，并明文规定故意或过失自行招致者不适用（第 19 条，原因自由行为）；
      共同正犯改为「共同实行」（第 28 条），教唆犯改采从属性说（第 29 条）。
    concepts: [impossible-attempt, omission, mistake-of-law, insanity, alic, perpetration, complicity-basis]
    scholars: [huang-rongjian, lin-shantian]
    works: [w-tw-2005-code, w-tw-2005-art26]
    derivedFrom: [e-tw-1935, e-de-stgb-1975, e-jp-yamaguchi-1982]
    needsSource: true

  - id: e-cn-zhaochunhua-2017
    year: 2017
    jurisdiction: cn
    type: case
    title: 赵春华案
    description: 摆射击摊的赵春华因持有被鉴定为枪支的玩具枪，一审以非法持有枪支罪判处有期徒刑三年六个月；二审改判缓刑，并在说理中考虑了其对涉案物品性质的认识。行为人对行政法规标准的认识错误应当如何处理，由此引发广泛讨论。
    concepts: [mistake-of-law]
    works: [w-cn-zhaochunhua-2017]
    needsSource: true

  # ---------------- 原因自由行为 ----------------
  - id: e-de-alic-origin
    year: 1770
    circa: true
    jurisdiction: de
    type: origin
    originOf: alic
    originType: term
    title: 「原因上自由的行为」的归责思想
    description: 自然法学说提出，行为人如果在自由状态下设定了原因，即使结果发生时已不自由，结果仍可以归属于他。这一思想后来被刑法学用来处理醉酒等自陷无能力的情形。
    concepts: [alic]
    needsSource: true
    editorNote: 首提者与年份待考，年份为编者估计。

  - id: e-de-vollrausch-1933
    year: 1933
    jurisdiction: de
    type: legislation
    title: 增设完全醉酒罪
    description: 故意或过失地使自己陷入醉酒状态，并在无责任能力状态下实施违法行为的，处以独立的刑罚（后为第 323a 条）。立法者以另设犯罪的方式绕开原因自由行为的理论难题。
    concepts: [alic]
    works: [w-de-1933-vollrausch]
    derivedFrom: [e-de-alic-origin]
    needsSource: true

  - id: e-uk-gallagher-1961
    year: 1961
    jurisdiction: uk-ew
    type: case
    title: Gallagher 案：「借酒壮胆」
    description: 被告人决意杀妻，为此买了刀和一瓶威士忌，喝醉后实施了杀人。上议院认为，事先形成杀人意图并为此醉酒的人，不能以醉酒为抗辩。这与原因自由行为的构成要件模式在结论上相近。
    concepts: [alic]
    works: [w-gallagher-1961]

  - id: e-uk-majewski-1976
    year: 1976
    jurisdiction: uk-ew
    type: case
    title: DPP v Majewski：特定意图与基本意图
    description: 自愿醉酒可以否定「特定意图」犯罪（如谋杀）所需的意图，但不能成为「基本意图」犯罪（如伤害）的抗辩，因为自愿醉酒本身就是一种鲁莽。这一区分的理论基础一直受到批评。
    concepts: [alic]
    works: [w-majewski-1976]
    derivedFrom: [e-uk-gallagher-1961]

  - id: e-jp-1968-alic
    year: 1968
    jurisdiction: jp
    type: case
    title: 最高裁判所以原因自由行为处罚酒后驾驶
    description: 被告人在饮酒时就预定驾车，最高裁判所认为，即使驾驶时处于心神耗弱状态，也不适用减轻规定。原因自由行为理论由此在判例上获得承认。
    concepts: [alic]
    works: [w-jp-1968-alic]
    derivedFrom: [e-de-alic-origin]
    needsSource: true

  - id: e-de-bghst-1996
    year: 1996
    jurisdiction: de
    type: case
    title: 联邦最高法院限缩原因自由行为
    description: 联邦最高法院认为，对于危险驾驶等以「驾驶」为构成要件行为的犯罪，饮酒不能被视为实行行为，不能适用原因自由行为（构成要件模式）。原因自由行为的适用范围由此大幅收缩。
    concepts: [alic]
    works: [w-bghst-42-235]
    derivedFrom: [e-de-vollrausch-1933]

  # ---------------- 责任能力 ----------------
  - id: e-uk-mnaghten-1843
    year: 1843
    jurisdiction: uk-ew
    type: origin
    originOf: insanity
    originType: case
    title: M'Naghten 规则
    description: M'Naghten 因妄想而误杀了首相的秘书，被判因精神失常无罪，引发公众不满。上议院随后就精神失常抗辩的标准作出答复：行为人由于精神疾病而不知道其行为的性质，或者虽然知道但不知道其行为是错误的，才能免责。这一认知标准影响英美法至今。
    concepts: [insanity]
    works: [w-mnaghten-1843]

  - id: e-de-stgb-1871
    year: 1871
    jurisdiction: de
    type: origin
    originOf: commencement
    originType: statute
    title: 1871 年帝国刑法典
    description: >-
      帝国刑法典以「开始实施」（Anfang der Ausführung）界定未遂（第 43 条），规定了中止（第 46 条）、正犯、教唆犯与帮助犯的区分（第 47—49 条），
      以及因意识丧失或精神活动的病理障碍而排除自由意志决定时不罚（第 51 条）。这些条文是此后德国总论各项争论的出发点。
    concepts: [commencement, withdrawal, perpetration, insanity]
    works: [w-stgb-1871]

  - id: e-jp-1931-shinshin
    year: 1931
    jurisdiction: jp
    type: case
    title: 心神丧失与心神耗弱的界定
    description: 大审院把心神丧失界定为因精神障碍而不能辨别是非或不能按照这种辨别而行动的状态，心神耗弱则是这种能力显著减弱的状态。混合方法由此在日本判例中确立。
    concepts: [insanity]
    works: [w-jp-1931-shinshin]
    derivedFrom: [e-jp-code-1907]
    needsSource: true

  - id: e-us-durham-1954
    year: 1954
    jurisdiction: us
    type: case
    title: Durham 规则
    description: 哥伦比亚特区巡回法院认为，如果违法行为是精神疾病或精神缺陷的产物，被告人就不负刑事责任。这一标准赋予精神科专家过大的影响，后被放弃。
    concepts: [insanity]
    works: [w-durham-1954]
    derivedFrom: [e-uk-mnaghten-1843]

  - id: e-us-idra-1984
    year: 1984
    jurisdiction: us
    type: legislation
    title: 精神失常抗辩改革法
    description: 刺杀里根总统未遂的欣克利以精神失常被判无罪后，国会收紧了联邦的精神失常抗辩：删除意志要素，只保留「不能辨认其行为的性质或错误性」，并把证明责任转移给被告人。
    concepts: [insanity]
    works: [w-idra-1984]
    derivedFrom: [e-us-mpc-1962, e-us-durham-1954]

  # ---------------- 严格责任与责任主义 ----------------
  - id: e-uk-prince-1875
    year: 1875
    jurisdiction: uk-ew
    type: origin
    originOf: strict-liability
    originType: case
    title: R v Prince：对年龄的错误不是抗辩
    description: 被告人带走一名不满 16 岁的少女，他有合理理由相信她已满 18 岁。法院认为，对年龄的认识不是这一犯罪的要件，被告人仍然有罪。严格责任由此成为英美刑法中反复出现的问题。
    concepts: [strict-liability]
    works: [w-prince-1875]

  - id: e-us-balint-1922
    year: 1922
    jurisdiction: us
    type: case
    title: United States v. Balint：管制性犯罪的严格责任
    description: 联邦最高法院认为，出售麻醉品的管制性犯罪不要求行为人知道所售物品的性质，立法者可以为了公共福利而要求经营者自担风险。
    concepts: [strict-liability]
    works: [w-balint-1922]
    derivedFrom: [e-uk-prince-1875]

  - id: e-us-morissette-1952
    year: 1952
    jurisdiction: us
    type: case
    title: Morissette v. United States：普通法犯罪推定需要犯意
    description: 被告人捡走了他以为被遗弃的空弹壳。联邦最高法院认为，源于普通法的犯罪（如盗窃）即使条文没有写明，也推定需要犯意；严格责任只适用于公共福利犯罪。
    concepts: [strict-liability]
    works: [w-morissette-1952]
    derivedFrom: [e-us-balint-1922]

  - id: e-jp-1957-ryobatsu
    year: 1957
    jurisdiction: jp
    type: case
    title: 两罚规定中业主的过失推定
    description: 最高裁判所大法庭认为，两罚规定处罚业主，是因为推定业主在选任、监督从业人员上存在过失；业主证明自己尽到了注意，就可以免责。这是以「推定过失」调和行政刑法与责任主义的方案，也是日本法人处罚的理论基础。
    concepts: [strict-liability, corporate-liability]
    works: [w-jp-1957-ryobatsu]
    needsSource: true

  - id: e-de-bverfg-1966
    year: 1966
    jurisdiction: de
    type: case
    title: 责任原则具有宪法位阶
    description: 联邦宪法法院认为，「无责任则无刑罚」是以法治国原则与人的尊严为根据的宪法原则，任何刑罚都以责任为前提。
    concepts: [strict-liability, culpability-essence]
    works: [w-bverfge-20-323]
    derivedFrom: [e-de-gg-1949]
    needsSource: true

  - id: e-uk-sweet-1969
    year: 1969
    jurisdiction: uk-ew
    type: case
    title: Sweet v Parsley：犯意推定
    description: 一名教师出租的房屋被房客用来吸食大麻，她对此毫不知情。上议院认为，除非议会明确排除，否则应推定犯罪需要犯意，撤销了她的有罪判决。
    concepts: [strict-liability]
    works: [w-sweet-1969]
    derivedFrom: [e-uk-prince-1875]

  - id: e-uk-b-v-dpp-2000
    year: 2000
    jurisdiction: uk-ew
    type: case
    title: B v DPP：诚实相信年龄可以免责
    description: 上议院认为，对于向不满 14 岁的儿童实施猥亵行为的犯罪，被告人诚实地相信对方已满 14 岁时，可以否定犯意。Prince 案的严格立场受到明显限制。
    concepts: [strict-liability]
    works: [w-b-v-dpp-2000]
    derivedFrom: [e-uk-sweet-1969]

positions:
  # ---- 责任的本质 ----
  - theory: classical-school
    question: q-culp-ground
    answer: moral
    derivation:
      - 以意志自由为前提。
      - 非难的对象是行为人自由选择的个别行为 → 道义责任论。
  - theory: modern-school
    question: q-culp-ground
    answer: social
    derivation:
      - 犯罪由素质与环境决定，道义上的非难没有意义。
      - 责任是社会对危险性格采取防卫措施的根据 → 社会责任论。
  - theory: retributivism
    question: q-culp-essence
    answer: normative
    derivation:
      - 刑罚是对应得的回应。
      - 只有能够做出其他选择而仍然实施不法的人才应得非难 → 规范责任论。
  - theory: union-theory
    question: q-culp-essence
    answer: functional
    derivation:
      - 责任是刑罚的上限，预防必要性是第二个条件。
      - 两者合起来构成答责性（罗克辛）。
    alternatives:
      - answer: normative
        note: 多数并合主义者在责任概念上仍采规范责任论。
  - theory: normative-culp
    question: q-expectability
    answer: "yes"
    derivation:
      - 期待可能性是责任的一般要素。
      - 法律无法穷尽一切不能期待的情形 → 可以超法规地阻却责任。
    alternatives:
      - answer: statutory-only
        note: 德国多数说出于法的安定性，只在法定事由（如第 35 条）的范围内考虑。
        jurisdictions: [de]
    needsSource: true
  - theory: psychological-culp
    question: q-expectability
    answer: "no"
    derivation:
      - 责任只是故意与过失这种心理事实，期待可能性没有容身之处。
  - theory: functional-culp
    question: q-expectability
    answer: statutory-only
    derivation:
      - 是否免责取决于预防的需要，而不取决于行为人「能否」另作选择。
      - 超法规的免责会削弱规范的效力。
    needsSource: true

  # ---- 违法性认识 ----
  - theory: dual-act-disvalue
    question: q-mistake-of-law
    answer: culpability
    derivation:
      - 故意在构成要件阶层，只是对事实的认识。
      - 违法性认识的可能性是独立的责任要素 → 责任说（德国判例与第 17 条）。
  - theory: monist-act-disvalue
    question: q-mistake-of-law
    answer: culpability
    derivation:
      - 目的行为论把故意移入不法，违法性认识自然留在责任 → 责任说。
  - theory: result-disvalue
    question: q-mistake-of-law
    answer: null
    note: 结果无价值论者在这个问题上分为限制故意说与责任说。
    alternatives:
      - answer: limited-intent
        note: 故意是责任要素，违法性认识的可能性是故意的要素。
      - answer: culpability
        note: 违法性认识的可能性是独立的责任要素。
    needsSource: true
  - theory: psychological-culp
    question: q-mistake-of-law
    answer: strict-intent
    derivation:
      - 责任即心理事实。
      - 违法性的现实认识是故意这一心理事实的一部分 → 严格故意说。
  - theory: normative-culp
    question: q-mistake-of-law
    answer: culpability
    derivation:
      - 非难的根据是「本可以认识到违法」。
      - 违法性认识的可能性就够了，且独立于故意 → 责任说。
    alternatives:
      - answer: limited-intent
        note: 也有规范责任论者采限制故意说（如团藤重光）。
  - theory: normative-culp
    question: q-reliance-on-advice
    answer: excused
    derivation:
      - 行为人尽到了查询义务，信赖了有权机关或专业人士的意见。
      - 错误不可避免，欠缺非难可能性 → 阻却责任。

  # ---- 原因自由行为 ----
  - theory: modern-school
    question: q-intoxication
    answer: full-liability
    derivation:
      - 醉酒者的危险性不因醉酒而降低。
      - 从社会防卫的观点，应当负完全的刑事责任。
    needsSource: true
  - theory: normative-culp
    question: q-alic-model
    answer: tatbestand
    derivation:
      - 非难以行为时的意志形成为对象，同时存在原则不能随意突破。
      - 只能把原因行为本身视为实行行为 → 构成要件模式。
    alternatives:
      - answer: exception
        note: 也有学者承认例外模式。
    needsSource: true

  # ---- 责任能力 ----
  - theory: normative-culp
    question: q-insanity-method
    answer: mixed
    derivation:
      - 非难的前提是能够认识违法并据此控制行为。
      - 以精神障碍为基础，判断辨认与控制能力 → 混合方法。
  - theory: modern-school
    question: q-insanity-method
    answer: biological
    derivation:
      - 精神障碍者是社会防卫的对象，适用保安处分而非刑罚。
      - 重点在于确认精神疾病的存在。
    needsSource: true

  # ---- 严格责任 ----
  - theory: retributivism
    question: q-strict-liability
    answer: never
    derivation:
      - 刑罚以应得为根据。
      - 没有责任的人不应得刑罚。
  - theory: deterrence
    question: q-strict-liability
    answer: regulatory
    derivation:
      - 刑罚的正当性在于预防效果。
      - 在公共福利领域，严格责任可以促使经营者采取最大限度的注意，并提高执法效率。
  - theory: union-theory
    question: q-strict-liability
    answer: never
    derivation:
      - 责任是刑罚的上限，没有责任就没有刑罚的空间。
  - theory: normative-culp
    question: q-strict-liability
    answer: never
    derivation:
      - 没有非难可能性就没有责任，也就不能科处刑罚。
  - theory: cl-subjectivism
    question: q-statutory-mens-rea
    answer: presume
    derivation:
      - 刑事责任取决于行为人可责的心态。
      - 条文沉默时，应推定需要犯意（Sweet v Parsley、B v DPP）。
