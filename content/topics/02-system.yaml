events:
  - id: e-de-mezger-1931
    year: 1931
    jurisdiction: de
    type: development
    title: 新古典体系：构成要件是违法类型
    description: 梅茨格认为构成要件不是价值中立的，而是类型化的不法；构成要件该当性不只是违法性的认识根据，而是其存在根据。价值关系的、目的论的思考进入犯罪论体系。
    concepts: [crime-system]
    scholars: [mezger]
    works: [w-mezger-1931]
    derivedFrom: [e-de-beling-1906]

  - id: e-uk-woolmington-1935
    year: 1935
    jurisdiction: uk-ew
    type: case
    title: Woolmington v DPP：「金线」
    description: 上议院确认，证明被告人有罪是控方的责任，这是贯穿英国刑法的「金线」。犯罪本体要件由控方证明，辩护事由则由被告人提出证据，英美的二元结构由此得到程序上的支撑。
    concepts: [crime-system]
    works: [w-woolmington-1935]

  - id: e-uk-bratty-1961
    year: 1961
    jurisdiction: uk-ew
    type: case
    title: Bratty 案：理智的与精神失常的自动症
    description: 上议院区分了由外部因素引起的「理智的自动症」（导致无罪释放）与由内部疾病引起的「精神失常的自动症」（按精神失常处理）。自愿行为要求与精神失常抗辩的界线由此成为难题。
    concepts: [action-theory, insanity]
    works: [w-bratty-1961]

  - id: e-cn-gao-2009
    year: 2009
    jurisdiction: cn
    type: critique
    title: 高铭暄为四要件辩护
    description: 四要件体系符合中国国情，逻辑严密且便于司法操作；以阶层论取代四要件缺乏必要性。犯罪构成体系之争由此进入高潮。
    concepts: [crime-system]
    scholars: [gao-mingxuan]
    works: [w-gao-2009]
    derivedFrom: [e-cn-chen-2006]
    needsSource: true

dialogues:
  - id: dlg-cn-system
    title: 四要件还是阶层论（陈兴良 × 高铭暄）
    concept: crime-system
    jurisdictions: [cn]
    summary: 2000 年代中国刑法学最根本的体系之争。
    needsSource: true
    turns:
      - id: t1
        scholar: chen-xingliang
        work: w-chen-2006
        year: 2006
        claim: 四要件体系源于苏俄刑法学，平面耦合、缺乏位阶，无法为出罪提供有效的逻辑顺序；应当清理苏俄刑法学的知识遗产，转向阶层式体系。
      - id: t2
        scholar: gao-mingxuan
        work: w-gao-2009
        year: 2009
        respondsTo: t1
        claim: 四要件体系逻辑严密、符合中国的司法实践，不存在必须推倒重来的理由；可以在四要件内部吸收阶层论的有益成分。
