# 违法性：正当防卫（根据与限度）、紧急避险、违法的统一性
# 起草：AI（Claude）。全部为 draft；中国大陆案件的细节尤需核实。

concepts:
  - id: self-defense
    name: 正当防卫（根据与限度）
    original:
      de: Notwehr
      ja: 正当防衛
      en: self-defence
    kind: problem
    area: unrecht
    tradition: both
    summary: >-
      正当防卫为什么正当（个人保全、法确证，还是优越利益）？是否要求法益均衡？防卫过当如何认定？
      德国以「法无须向不法让步」为原则只要求必要性；日本与中国大陆要求一定的相当性，中国大陆近年因于欢案、昆山案而重新界定防卫限度。
      英美法的核心问题则是：误以为需要自卫时，信念是否须合理。

  - id: necessity
    name: 紧急避险
    original:
      de: Notstand（rechtfertigender / entschuldigender）
      ja: 緊急避難
      en: necessity / duress of circumstances
    kind: problem
    area: unrecht
    tradition: both
    summary: >-
      为了避免危险而损害无辜第三人的利益，是阻却违法还是阻却责任？德国以二分说区分两种避险，日本与中国大陆多采阻却违法一元说。
      最尖锐的问题是生命对生命：从卡涅阿德斯之板、Dudley and Stephens 案，到联体婴儿分离手术与击落被劫持客机。

questions:
  - id: q-unity
    concept: wrongfulness-essence
    text: 刑法上的违法性与民法、行政法上的违法性是否统一？
    level: intermediate
    aliases:
      - 违法一元论
      - 违法相对论
      - 违法多元论
      - 可罚的违法性
      - 法秩序的统一性
      - 民法上合法 刑法上违法
      - 刑民交叉
    answers:
      - id: strict
        label: 严格的违法一元论
        summary: 违法性在整个法秩序中统一；民法上合法的行为在刑法上不可能违法，反之亦然。
      - id: moderate
        label: 缓和的违法一元论
        summary: 违法性在根本上统一，但刑法要求达到「可罚的」程度。
      - id: relative
        label: 违法相对论（多元论）
        summary: 各法域的目的不同，违法性可以各自判断。

  - id: q-defense-basis
    concept: self-defense
    text: 正当防卫为什么正当？
    level: intermediate
    aliases:
      - 正当防卫的根据
      - 正当防卫的正当化根据
      - 正不必让于不正
      - 法确证原理
      - 个人保全原理
    answers:
      - id: dual-basis
        label: 个人保全与法确证（二元论）
      - id: individual
        label: 个人保全（一元论）
      - id: rechtsbewaehrung
        label: 法确证（维护法秩序）
      - id: interest
        label: 优越利益（不法侵害者的法益要保护性降低）

  - id: q-defense-proportionality
    concept: self-defense
    text: 正当防卫是否要求防卫行为与不法侵害之间的法益均衡（相当性）？
    level: intermediate
    aliases:
      - 防卫限度
      - 防卫的必要性
      - 防卫的相当性
      - 正当防卫的限度
      - 明显超过必要限度
    answers:
      - id: no-balance
        label: 只要求必要性，不要求法益均衡
      - id: necessity-plus
        label: 必要性，外加社会伦理的限制（不得极端失衡）
      - id: proportionality
        label: 要求一定的相当性（基本相当）

  - id: q-excessive-defense
    concept: self-defense
    text: 防卫是否过当，应站在防卫人行为时的立场判断，还是以事后查明的结果判断？
    level: applied
    aliases:
      - 防卫过当
      - 于欢案
      - 昆山反杀案
      - 唯结果论
      - 正当防卫的司法认定
      - 特殊防卫
      - 正当防卫 指导意见
    answers:
      - id: ex-ante
        label: 站在防卫人行为时的立场，作事前的综合判断
      - id: ex-post
        label: 以事后查明的侵害与损害对比判断

  - id: q-cl-belief
    concept: self-defense
    text: 行为人误以为需要自卫时，其信念是否须合理？
    level: applied
    aliases:
      - honest belief
      - 合理相信
      - Beckford
      - Goetz 案
      - 英美法上的误想防卫
      - 自卫 合理性
    answers:
      - id: honest
        label: 诚实相信即可
      - id: reasonable
        label: 须为合理相信

  - id: q-necessity-nature
    concept: necessity
    text: 紧急避险的法律性质是阻却违法、阻却责任，还是区分两种情形（二分说）？
    level: intermediate
    aliases:
      - 紧急避险的法律性质
      - 二分说
      - 阻却违法的紧急避险
      - 阻却责任的紧急避险
      - 违法阻却一元说
    answers:
      - id: justification
        label: 阻却违法一元说
      - id: excuse
        label: 阻却责任说
      - id: differentiated
        label: 二分说（保全利益明显优越时阻却违法，否则可能阻却责任）

  - id: q-life-vs-life
    concept: necessity
    text: 为了保全自己或他人的生命而牺牲无辜者的生命，能否正当化或免责？
    level: applied
    aliases:
      - 生命冲突
      - 以命换命
      - 电车难题
      - 卡涅阿德斯之板
      - Dudley and Stephens
      - 击落被劫持客机
      - 航空安全法
      - 联体婴儿分离
    answers:
      - id: justified
        label: 可以阻却违法
      - id: excused
        label: 不阻却违法，但可以阻却责任
      - id: liable
        label: 既不阻却违法，也不阻却责任

prerequisites:
  - question: q-unity
    requires: q-unrecht-core
    kind: foundational
    why: 违法的实质是什么，影响刑法的违法判断能否独立于其他法域。
    branches:
      - answer: result
        leadsTo: 刑法只保护值得以刑罚保护的法益，可以要求更高程度的违法（可罚的违法性）→ 缓和的一元论或相对论。
      - answer: dual
        leadsTo: 行为规范在整个法秩序中统一，刑法上的违法以法秩序的违反为前提 → 倾向违法一元论。
      - answer: monist-act
        leadsTo: 违法即规范违反，倾向统一。

  - question: q-unity
    requires: q-task
    kind: foundational
    why: 刑法是否具有独立于其他法域的保护目的，决定了它能否独立判断违法。
    branches:
      - answer: rechtsgut
        leadsTo: 刑法的法益保护具有补充性，可以只处罚其中值得处罚的部分。
      - answer: ethic
        leadsTo: 刑法维护的是统一的法秩序与伦理秩序 → 倾向违法一元论。

  - question: q-defense-basis
    requires: q-just-principle
    kind: logical
    why: 正当防卫是正当化事由之一，它的根据要从正当化的一般原理推出。
    branches:
      - answer: interest
        leadsTo: 不法侵害者的法益要保护性降低，被防卫者的利益在衡量上占优 → 优越利益说。
      - answer: social-adequacy
        leadsTo: 防卫是社会伦理秩序所容许的行为。
      - answer: purpose
        leadsTo: 为了保护正当利益而采取的相当手段。

  - question: q-defense-proportionality
    requires: q-defense-basis
    kind: logical
    why: 防卫为什么正当，决定了防卫可以走多远。
    branches:
      - answer: dual-basis
        leadsTo: 「法无须向不法让步」，只要求必要性，不要求法益均衡；但社会伦理会限制极端失衡的防卫。
      - answer: rechtsbewaehrung
        leadsTo: 防卫同时在维护法秩序，不要求法益均衡。
      - answer: individual
        leadsTo: 以保全个人法益所必要的限度为准。
      - answer: interest
        leadsTo: 利益衡量的观点要求一定的均衡，至少不能明显失衡。

  - question: q-excessive-defense
    requires: q-defense-proportionality
    kind: logical
    why: 只有先确定限度的标准，才能判断是否过当。
    branches:
      - answer: no-balance
        leadsTo: 只看是否必要，结果的轻重不是决定因素。
      - answer: necessity-plus
        leadsTo: 原则上看必要性，只有极端失衡时才认定过当。
      - answer: proportionality
        leadsTo: 需要对比侵害与损害，但应综合考虑侵害的强度、紧迫性与防卫人的处境。

  - question: q-excessive-defense
    requires: q-norm-type
    kind: foundational
    why: 防卫限度是事前判断还是事后判断，与违法评价面向行为规范还是评价规范相对应。
    branches:
      - answer: determination
        leadsTo: 行为规范面向行为时的防卫人 → 站在防卫人的立场事前判断，避免「唯结果论」。
      - answer: evaluation
        leadsTo: 违法是对结果的事后评价 → 但对防卫人的错误判断可以在责任阶层考虑。
      - answer: both
        leadsTo: 以事前判断为主。

  - question: q-cl-belief
    requires: q-cl-basis
    kind: foundational
    why: 误信的自卫能否免责，是主观主义与客观主义在正当防卫上的直接分歧。
    branches:
      - answer: subjectivism
        leadsTo: 以行为人实际相信的情况为准 → 诚实相信即可（R v Williams、Beckford）；MPC 对诚实但不合理的信念按鲁莽或疏忽的犯罪处理。
      - answer: objectivism
        leadsTo: 自卫须以一个合理的人在当时情况下的判断为准 → 合理相信（People v. Goetz）。

  - question: q-necessity-nature
    requires: q-just-principle
    kind: logical
    why: 紧急避险是「正对正」，能否正当化取决于正当化的一般原理。
    branches:
      - answer: interest
        leadsTo: 保全利益优于损害利益时阻却违法；利益同等时是否阻却违法，有争议。
      - answer: social-adequacy
        leadsTo: 以避险行为是否符合社会伦理秩序为准。
      - answer: purpose
        leadsTo: 以是否为正当目的的相当手段为准。

  - question: q-necessity-nature
    requires: q-culp-essence
    kind: logical
    why: 不能阻却违法的避险能否阻却责任，取决于责任是否包含期待可能性。
    branches:
      - answer: normative
        leadsTo: 在生命、身体面临危险的极端状态下，不能期待行为人实施合法行为 → 可以阻却责任 → 二分说。
      - answer: psychological
        leadsTo: 责任只是故意、过失的心理事实，无法说明阻却责任的避险。
      - answer: functional
        leadsTo: 极端状态下没有预防的必要 → 阻却责任（答责性）。

  - question: q-life-vs-life
    requires: q-necessity-nature
    kind: logical
    why: 生命对生命的冲突，是检验紧急避险性质的极限案例。
    branches:
      - answer: justification
        leadsTo: 生命不能比较，等价利益之间多数否认阻却违法；部分学者在此例外承认阻却责任或超法规的责任阻却。
      - answer: differentiated
        leadsTo: 不能阻却违法（生命不得衡量），但可能依阻却责任的紧急避险免责（德国刑法第 35 条）。
      - answer: excuse
        leadsTo: 阻却责任。

  - question: q-life-vs-life
    requires: q-punish-basis
    kind: foundational
    why: 对极端状态下的行为人科处刑罚是否有意义，取决于刑罚为什么正当。
    branches:
      - answer: retribution
        leadsTo: 牺牲无辜者的行为仍是不法，但在极端状态下行为人的可责性大幅降低。
      - answer: general-prevention
        leadsTo: 刑罚对极端状态下的人没有威慑效果 → 支持免责。
      - answer: special-prevention
        leadsTo: 行为人没有再犯危险 → 支持免责。
      - answer: union
        leadsTo: 不阻却违法，以免动摇生命保护的规范；但可以阻却责任或减免刑罚。

relations:
  - from: accidental-defense
    to: self-defense
    type: part_of
    description: 偶然防卫是正当防卫的主观要件（防卫意思）问题。
  - from: putative-defense
    to: self-defense
    type: part_of
    description: 假想防卫是关于正当防卫前提事实的错误。
  - from: self-defense
    to: necessity
    type: symmetric
    description: 正当防卫是「正对不正」，紧急避险是「正对正」；两者的根据与限度因此不同。

