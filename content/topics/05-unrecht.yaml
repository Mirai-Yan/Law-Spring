events:
  # ---------------- 违法的统一性 ----------------
  - id: e-jp-kabatsu
    year: 1935
    circa: true
    jurisdiction: jp
    type: development
    title: 「可罚的违法性」思想
    description: 宫本英脩等人提出，刑法上的违法不只是一般的违法，还必须达到值得以刑罚处罚的程度（可罚的违法性）。这一思想后来由佐伯千仞等人发展，成为违法一元论与相对论之争的焦点。
    concepts: [wrongfulness-essence]
    scholars: [miyamoto, saeki-chihiro]
    needsSource: true
    editorNote: 年份为编者估计，首倡者与文献待核。

  # ---------------- 正当防卫 ----------------
  - id: e-de-berner-1848
    year: 1848
    jurisdiction: de
    type: origin
    originOf: self-defense
    originType: term
    title: 「法无须向不法让步」
    description: 黑格尔学派的贝尔纳以这一命题表述正当防卫的严格立场：防卫者不负退避义务，也不受法益均衡的限制，因为防卫本身就是对法的确证。这一思想奠定了德国正当防卫论的基调。
    concepts: [self-defense]
    scholars: [berner]
    works: [w-berner-1848]
    derivedFrom: [e-de-hegel-1820]
    needsSource: true

  - id: e-uk-williams-gladstone-1983
    year: 1983
    jurisdiction: uk-ew
    type: case
    title: R v Williams (Gladstone)：诚实相信即可
    description: 被告人误以为有人在殴打一名少年而上前制止。上诉法院认为，应以被告人诚实相信的事实来判断其使用武力是否合理，即使这种相信并不合理。
    concepts: [self-defense]
    works: [w-williams-gladstone-1983]

  - id: e-us-goetz-1986
    year: 1986
    jurisdiction: us
    type: case
    title: People v. Goetz：合理性须有客观标准
    description: 被告人在地铁上向四名向他要钱的青年开枪。纽约上诉法院认为，自卫的信念必须是一个处于被告人境况中的合理的人也会持有的，不能只看被告人主观上是否相信。
    concepts: [self-defense]
    works: [w-goetz-1986]

  - id: e-uk-beckford-1987
    year: 1987
    jurisdiction: uk-ew
    type: case
    title: Beckford v The Queen
    description: 枢密院确认，被告人诚实地相信需要自卫就可以主张自卫，信念的合理性只是判断其是否真诚相信的证据。
    concepts: [self-defense]
    works: [w-beckford-1987]
    derivedFrom: [e-uk-williams-gladstone-1983]

  - id: e-us-florida-2005
    year: 2005
    jurisdiction: us
    type: legislation
    title: 「不退让」法
    description: 佛罗里达州规定，在任何有权停留的场所遭受攻击时，没有退避的义务，可以使用包括致命武力在内的武力。此后多州效仿，引发关于自卫限度的激烈争论。
    concepts: [self-defense]
    works: [w-florida-2005]

  - id: e-uk-cjia-2008
    year: 2008
    jurisdiction: uk-ew
    type: legislation
    title: 2008 年法将自卫规则成文化
    description: 第 76 条确认：以被告人相信的情况判断，武力是否合理；但在一般情况下，「明显不成比例」的武力不合理。2013 年又对住宅防卫放宽为「严重不成比例」的武力才不合理。
    concepts: [self-defense]
    works: [w-uk-cjia-2008]
    derivedFrom: [e-uk-beckford-1987]

  - id: e-cn-yuhuan-2017
    year: 2017
    jurisdiction: cn
    type: case
    title: 于欢案
    description: 于欢在母亲遭受催债人员长时间凌辱、警察离开现场后，持刀刺伤多人致一人死亡。一审以故意伤害罪判处无期徒刑；二审认定其行为具有防卫性质但明显超过必要限度，改判有期徒刑五年。防卫限度的判断标准由此引发全国讨论。
    concepts: [self-defense]
    works: [w-cn-yuhuan-2017]
    derivedFrom: [e-cn-1997]
    needsSource: true

  - id: e-cn-kunshan-2018
    year: 2018
    jurisdiction: cn
    type: case
    title: 昆山反杀案
    description: 于海明遭持刀袭击后夺刀反击致对方死亡，公安机关与检察机关认定其行为属于特殊防卫，不负刑事责任。司法实践开始纠正正当防卫认定中的「唯结果论」。
    concepts: [self-defense]
    derivedFrom: [e-cn-yuhuan-2017]
    needsSource: true

  - id: e-cn-guideline-2020
    year: 2020
    jurisdiction: cn
    type: legislation
    title: 正当防卫指导意见
    description: 两高一部的指导意见要求立足防卫人防卫时所处的情境，结合社会公众的一般认知作出判断，不能苛求防卫人；防卫过当须同时满足「明显超过必要限度」与「造成重大损害」。
    concepts: [self-defense]
    works: [w-cn-guideline-2020]
    derivedFrom: [e-cn-kunshan-2018]

  # ---------------- 紧急避险 ----------------
  - id: e-uk-dudley-1884
    year: 1884
    jurisdiction: uk-ew
    type: origin
    originOf: necessity
    originType: case
    title: R v Dudley and Stephens：紧急避险不是谋杀的抗辩
    description: 船难后在救生艇上漂流多日的船员杀死并食用了濒死的少年帕克。法院认为，紧急避险不能成为杀人的抗辩，判处死刑（后减为六个月监禁）。生命对生命的冲突由此成为紧急避险论的核心难题。
    concepts: [necessity]
    works: [w-dudley-1884]
    editorNote: 卡涅阿德斯之板等思想实验与康德的讨论更早；这里以近代判例作为起点。

  - id: e-de-goldschmidt-1913
    year: 1913
    jurisdiction: de
    type: development
    title: 戈尔德施密特：紧急避险是责任问题
    description: 区分「法规范」与「义务规范」：在紧急状态下，行为虽然违反法规范，但不违反义务规范，因此阻却的是责任。二分说与规范责任论由此相互支撑。
    concepts: [necessity, culpability-essence]
    scholars: [goldschmidt]
    works: [w-goldschmidt-1913]
    derivedFrom: [e-de-kant-1797]
    needsSource: true

  - id: e-uk-re-a-2000
    year: 2000
    jurisdiction: uk-ew
    type: case
    title: 联体婴儿分离案
    description: 不分离，两个婴儿都会死亡；分离，较弱的一个必然死亡。上诉法院认为，在这种特殊情况下，以紧急避险为根据实施分离手术是合法的。这在一定程度上偏离了 Dudley and Stephens 的结论。
    concepts: [necessity]
    works: [w-re-a-2000]
    derivedFrom: [e-uk-dudley-1884]

  - id: e-de-bverfg-2006
    year: 2006
    jurisdiction: de
    type: case
    title: 航空安全法判决
    description: 联邦宪法法院宣告授权击落被劫持客机的条款违宪：国家不能为了拯救更多人的生命而有意杀死机上无辜的乘客，这会把他们当作纯粹的客体，违反人的尊严。
    concepts: [necessity]
    works: [w-bverfge-115-118]
    derivedFrom: [e-de-stgb-1975]

positions:
  # ---- 违法的统一性 ----
  - theory: result-disvalue
    question: q-unity
    answer: null
    note: 结果无价值论者在这个问题上没有统一立场，可罚的违法性论与违法相对论都有支持者。
    alternatives:
      - answer: relative
        note: 刑法只保护值得以刑罚保护的法益，违法可以相对地判断。
      - answer: moderate
        note: 违法在根本上统一，但刑法要求可罚的违法性。
    needsSource: true

  # ---- 正当防卫 ----
  - theory: result-disvalue
    question: q-defense-basis
    answer: interest
    derivation:
      - 违法即法益侵害，正当化以利益衡量来说明。
      - 不法侵害者在侵害的限度内法益的要保护性降低 → 优越利益说。
    alternatives:
      - answer: individual
        note: 也有学者以个人保全说明正当防卫。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-defense-basis
    answer: dual-basis
    derivation:
      - 正当防卫既保护被侵害者的个人法益，也确证法秩序的效力（德国通说）。
  - theory: dual-act-disvalue
    question: q-defense-proportionality
    answer: necessity-plus
    derivation:
      - 法无须向不法让步 → 原则上只要求必要性。
      - 但社会伦理限制极端失衡的防卫（例如为保护轻微财物而杀人）。
    alternatives:
      - answer: proportionality
        note: 日本与中国大陆的通说要求一定的相当性。
        jurisdictions: [jp, cn]
  - theory: result-disvalue
    question: q-defense-proportionality
    answer: proportionality
    derivation:
      - 优越利益说要求衡量双方的利益。
      - 至少不能造成与侵害明显失衡的损害 → 一定的相当性。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-excessive-defense
    answer: ex-ante
    derivation:
      - 行为规范面向行为时的防卫人。
      - 站在防卫人当时的处境作事前判断，不能以事后的结果苛求防卫人。
  - theory: result-disvalue
    question: q-excessive-defense
    answer: null
    note: 以法益侵害为中心的立场容易被理解为事后的结果比较，但多数论者同样承认应考虑防卫人行为时的处境与侵害的危险性。
    needsSource: true
  - theory: cl-subjectivism
    question: q-cl-belief
    answer: honest
    derivation:
      - 以行为人实际相信的情况判断可责性。
      - 诚实相信需要自卫的人没有可责的心态。
  - theory: cl-objectivism
    question: q-cl-belief
    answer: reasonable
    derivation:
      - 自卫的正当性要以合理的人在当时情况下的判断为准。
    needsSource: true

  # ---- 紧急避险 ----
  - theory: result-disvalue
    question: q-necessity-nature
    answer: justification
    derivation:
      - 违法即法益侵害，正当化以利益衡量为原理。
      - 保全的利益不小于损害的利益时，阻却违法 → 违法阻却一元说（日本与中国大陆的通说）。
  - theory: dual-act-disvalue
    question: q-necessity-nature
    answer: differentiated
    derivation:
      - 保全利益明显优越时阻却违法（德国刑法第 34 条）。
      - 生命、身体等面临危险而不能期待行为人忍受时，阻却责任（第 35 条）。
    alternatives:
      - answer: justification
        note: 日本与中国大陆的行为无价值论者也多采违法阻却一元说，因为法条只有一种避险。
        jurisdictions: [jp, cn]
  - theory: dual-act-disvalue
    question: q-life-vs-life
    answer: excused
    derivation:
      - 生命不能被衡量，牺牲无辜者的生命不阻却违法。
      - 但在极端状态下不能期待行为人实施合法行为 → 阻却责任。
  - theory: result-disvalue
    question: q-life-vs-life
    answer: null
    note: 违法阻却一元说下，等价法益之间的避险如何处理有争议；有学者主张阻却违法，有学者在此例外承认阻却责任。
    needsSource: true
  - theory: normative-culp
    question: q-life-vs-life
    answer: excused
    derivation:
      - 责任是非难可能性。
      - 生命面临危险时不能期待行为人选择牺牲自己 → 阻却责任。
  - theory: retributivism
    question: q-life-vs-life
    answer: liable
    derivation:
      - 杀死无辜者是不法，应得刑罚（Dudley and Stephens 的结论）。
      - 但极端状态可以成为减轻或赦免的理由。
    needsSource: true
