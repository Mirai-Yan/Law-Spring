# 分论与特殊主体：财产犯罪的保护法益、单位（法人）犯罪
# 起草：AI（Claude）。全部为 draft；日本判例与中国大陆合规改革的细节尤需核实。

concepts:
  - id: property-rechtsgut
    name: 财产犯罪的保护法益
    original:
      de: Schutzgut der Vermögensdelikte / Vermögensbegriff
      ja: 財産犯の保護法益（本権説・占有説）
      en: property offences — the protected interest
    kind: problem
    area: special
    tradition: both
    summary: >-
      盗窃罪保护的是所有权等本权，还是事实上的占有？诈骗罪中的「财产」是法律上的权利，还是经济上的价值？
      这两个问题都取决于刑法与民法的关系（违法一元论还是相对论），在「所有人窃回自己的财物」「骗取赌资、毒品」等案件中直接决定结论。

  - id: corporate-liability
    name: 单位（法人）犯罪
    original:
      de: Unternehmensstrafbarkeit / Verbandsgeldbuße
      ja: 法人処罰（両罰規定）
      en: corporate criminal liability
    kind: problem
    area: special
    tradition: both
    summary: >-
      法人能否犯罪？德国坚持「法人不能犯罪」，以秩序违反法上的罚款处理；日本以两罚规定处罚业主；中国大陆在刑法总则中规定单位犯罪；
      英美法则从替代责任、同一视原则走向以合规缺陷为核心的组织责任（「未能预防」型犯罪）。企业合规因此成为当代刑法的热点。

questions:
  - id: q-theft-rechtsgut
    concept: property-rechtsgut
    text: 盗窃罪的保护法益是所有权等本权，还是事实上的占有？
    level: intermediate
    aliases:
      - 本权说
      - 占有说
      - 盗窃罪的保护法益
      - 中间说
      - 平稳占有说
      - 财产犯罪的保护法益
    answers:
      - id: honken
        label: 本权说
      - id: possession
        label: 占有说
      - id: intermediate
        label: 中间说（平稳占有说等）

  - id: q-self-help-recovery
    concept: property-rechtsgut
    text: 所有人从窃贼或合法占有人处窃回自己的财物，是否构成盗窃罪？
    level: applied
    aliases:
      - 窃回自己的财物
      - 所有人取回
      - 自救行为
      - 窃取自己所有的财物
      - 自動車金融事件
      - R v Turner
    answers:
      - id: not-theft
        label: 不构成
      - id: theft
        label: 构成要件该当（再考虑是否因自救行为等阻却违法）

  - id: q-fraud-property
    concept: property-rechtsgut
    text: 诈骗罪中的「财产」应采法律的财产说、经济的财产说，还是法律—经济的财产说？
    level: intermediate
    aliases:
      - 财产概念
      - 经济的财产说
      - 法律的财产说
      - 法律经济的财产说
      - 诈骗罪的财产损失
      - 骗取赌资
      - 骗取毒品
    answers:
      - id: juristic
        label: 法律的财产说
      - id: economic
        label: 经济的财产说
      - id: juristic-economic
        label: 法律—经济的财产说

  - id: q-corp-possible
    concept: corporate-liability
    text: 法人（单位）能否成为犯罪主体？
    level: intermediate
    aliases:
      - 单位犯罪
      - 法人犯罪
      - 法人能否犯罪
      - 企业刑事责任
      - societas delinquere non potest
      - 公司犯罪
    answers:
      - id: "no"
        label: 不能（法人不能犯罪）
      - id: "yes"
        label: 能

  - id: q-corp-model
    concept: corporate-liability
    text: 法人的刑事责任应以何种模式归责？
    level: applied
    aliases:
      - 同一视原则
      - 替代责任
      - 组织责任
      - 企业合规
      - failure to prevent
      - 单位意志
      - 合规不起诉
    answers:
      - id: vicarious
        label: 替代责任（雇员的行为与心态归属于法人）
      - id: identification
        label: 同一视原则（高级管理人员的心态即法人的心态）
      - id: organizational
        label: 组织责任（合规缺陷、组织文化）
      - id: collective-decision
        label: 单位意志（经集体研究决定或负责人决定）

prerequisites:
  - question: q-theft-rechtsgut
    requires: q-unity
    kind: logical
    why: 刑法能否保护民法上不被保护的占有，取决于违法在各法域之间是否统一。
    branches:
      - answer: strict
        leadsTo: 刑法上的财产保护从属于民法 → 本权说。
      - answer: moderate
        leadsTo: 原则上从属于民法，但保护平稳的占有 → 中间说。
      - answer: relative
        leadsTo: 刑法可以独立地保护事实上的财产秩序 → 占有说。

  - question: q-theft-rechtsgut
    requires: q-rechtsgut-critical
    kind: conceptual
    why: 财产犯罪的保护法益是法益概念在分论中的具体化。
    branches:
      - answer: critical
        leadsTo: 法益须是值得保护的利益，单纯的占有是否值得刑法保护需要论证。
      - answer: immanent
        leadsTo: 以条文的保护目的为准。

  - question: q-self-help-recovery
    requires: q-theft-rechtsgut
    kind: logical
    why: 所有人取回自己的财物是否侵害了法益，取决于法益是本权还是占有。
    branches:
      - answer: honken
        leadsTo: 所有人没有侵害任何人的本权 → 不构成盗窃。
      - answer: possession
        leadsTo: 侵害了他人事实上的占有 → 构成要件该当，再看是否阻却违法（自救行为）。
      - answer: intermediate
        leadsTo: 窃贼的占有不是平稳的占有，从窃贼处取回不构成；从合法占有人（如担保权人）处取回则构成。

  - question: q-fraud-property
    requires: q-unity
    kind: logical
    why: 民法上不受保护的利益（如赌资、毒品）能否成为诈骗罪的财产，取决于刑法与民法的关系。
    branches:
      - answer: strict
        leadsTo: 财产即法律上的权利 → 法律的财产说。
      - answer: relative
        leadsTo: 一切具有经济价值的利益都是财产 → 经济的财产说。
      - answer: moderate
        leadsTo: 具有经济价值且不为法秩序所否定的利益 → 法律—经济的财产说。

  - question: q-corp-possible
    requires: q-action-concept
    kind: conceptual
    why: 法人能否「行为」，取决于刑法上的行为概念。
    branches:
      - answer: causal
        leadsTo: 行为是有意志的身体动静，法人没有身体与意志 → 不能。
      - answer: final
        leadsTo: 行为是目的性的操纵，只有自然人才能 → 不能。
      - answer: social
        leadsTo: 法人的活动同样具有社会意义 → 可以。
      - answer: personal
        leadsTo: 人格是自然人的属性 → 倾向不能。

  - question: q-corp-possible
    requires: q-culp-essence
    kind: logical
    why: 法人能否「有责任」，取决于责任的本质。
    branches:
      - answer: normative
        leadsTo: 非难可能性以个人的意志自由为前提 → 法人不能有责任。
      - answer: psychological
        leadsTo: 法人没有心理 → 不能。
      - answer: functional
        leadsTo: 责任由预防需要决定，法人的组织缺陷可以成为归责的根据 → 可以。

  - question: q-corp-possible
    requires: q-punish-basis
    kind: foundational
    why: 处罚法人有没有意义，取决于刑罚为什么正当。
    branches:
      - answer: retribution
        leadsTo: 法人不能「应得」报应 → 不能。
      - answer: general-prevention
        leadsTo: 处罚法人可以促使企业预防犯罪 → 可以。
      - answer: special-prevention
        leadsTo: 可以针对企业的组织缺陷进行矫正（如合规整改）→ 可以。
      - answer: union
        leadsTo: 以预防为目的，但需要找到法人自身的「责任」→ 组织责任。

  - question: q-corp-model
    requires: q-corp-possible
    kind: logical
    why: 只有承认法人可以犯罪，才需要决定如何归责。
    branches:
      - answer: "yes"
        leadsTo: 进入归责模式之争：替代责任、同一视原则、组织责任，或单位意志。
      - answer: "no"
        leadsTo: 只能处罚自然人，或以行政罚款处理法人。

relations:
  - from: property-rechtsgut
    to: rechtsgut
    type: derived_from
    description: 财产犯罪的保护法益之争，是法益概念在分论中的具体化。
  - from: corporate-liability
    to: strict-liability
    type: derived_from
    description: 英美的法人替代责任在历史上与严格责任相伴而生，都与责任主义存在紧张关系。

