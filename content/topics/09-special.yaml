events:
  # ---------------- 财产犯罪的保护法益 ----------------
  - id: e-de-rgst-1910
    year: 1910
    jurisdiction: de
    type: origin
    originOf: property-rechtsgut
    originType: case
    title: 帝国法院采经济的财产概念
    description: 帝国法院的联合审判庭认为，诈骗罪中的财产是一个人所拥有的具有经济价值的财物的总和，而不限于法律上的权利。法律的财产说（宾丁）与经济的财产说之争由此成为财产犯罪论的基本问题。
    concepts: [property-rechtsgut]
    works: [w-rgst-44-230]
    needsSource: true

  - id: e-jp-1918-honken
    year: 1918
    jurisdiction: jp
    type: case
    title: 大审院采本权说
    description: 大审院认为，盗窃罪保护的是所有权等本权，所有人取回自己的财物不构成盗窃。
    concepts: [property-rechtsgut]
    works: [w-jp-1918-honken]
    needsSource: true

  - id: e-jp-1959-possession
    year: 1959
    jurisdiction: jp
    type: case
    title: 最高裁判所转向占有说
    description: 最高裁判所认为，即使是法律上禁止持有的财物，其事实上的占有也受刑法保护。判例由此从本权说转向占有说。
    concepts: [property-rechtsgut]
    works: [w-jp-1959-possession]
    derivedFrom: [e-jp-1918-honken]
    needsSource: true

  - id: e-uk-theft-act-1968
    year: 1968
    jurisdiction: uk-ew
    type: legislation
    title: 1968 年盗窃法：财物「属于」占有或控制者
    description: 第 5 条第 1 款规定，财物被视为属于对其享有占有、控制或任何财产权益的人。所有人取走他人占有中的自己的财物，也可能构成盗窃。
    concepts: [property-rechtsgut]
    works: [w-uk-theft-act-1968]

  - id: e-uk-turner-1971
    year: 1971
    jurisdiction: uk-ew
    type: case
    title: R v Turner (No 2)：从修车厂开走自己的车
    description: 被告人把车送去修理，修好后趁修车厂不注意把车开走，以逃避支付修理费。上诉法院认为，修车厂对车辆的占有与控制使车辆「属于」修车厂，被告人构成盗窃。
    concepts: [property-rechtsgut]
    works: [w-turner-1971]
    derivedFrom: [e-uk-theft-act-1968]

  - id: e-jp-1989-car-finance
    year: 1989
    jurisdiction: jp
    type: case
    title: 汽车金融案：占有说的确立
    description: 被告人以汽车作为借款担保并转移了所有权，却在债务人仍可使用期间趁机把车开走。最高裁判所认为，即使被告人在民法上可能有权取回，债务人对车辆的占有仍受刑法保护，被告人构成盗窃。
    concepts: [property-rechtsgut]
    works: [w-jp-1989-car-finance]
    derivedFrom: [e-jp-1959-possession]
    needsSource: true
    editorNote: 案情中谁是所有人、谁是占有人，需核对原判决。

  # ---------------- 单位（法人）犯罪 ----------------
  - id: e-uk-birmingham-1842
    year: 1842
    jurisdiction: uk-ew
    type: origin
    originOf: corporate-liability
    originType: case
    title: 铁路公司因不作为被起诉
    description: 铁路公司因未履行拆除桥梁的法定义务而被起诉，法院认为法人可以因不作为而承担刑事责任。英美法上的法人刑事责任由此起步，此后逐步扩展到作为犯与需要犯意的犯罪。
    concepts: [corporate-liability]
    works: [w-birmingham-1842]

  - id: e-us-nyc-railroad-1909
    year: 1909
    jurisdiction: us
    type: case
    title: 美国确立法人的替代责任
    description: 联邦最高法院认为，法人可以因其雇员在职务范围内为法人利益实施的犯罪承担刑事责任（雇主责任原则）。美国的法人刑事责任由此采取了非常宽的替代责任模式。
    concepts: [corporate-liability]
    works: [w-nyc-railroad-1909]
    derivedFrom: [e-uk-birmingham-1842]

  - id: e-de-owig-1968
    year: 1968
    jurisdiction: de
    type: legislation
    title: 秩序违反法上的团体罚款
    description: 法人的机关或代表人实施犯罪或秩序违反行为，违反了法人的义务或使法人获利的，可以对法人科处罚款。德国以此回避法人的刑事责任，维持「法人不能犯罪」的原则。
    concepts: [corporate-liability]
    works: [w-de-owig-1968]

  - id: e-uk-tesco-1971
    year: 1971
    jurisdiction: uk-ew
    type: case
    title: Tesco v Nattrass：同一视原则
    description: 上议院认为，只有法人「指挥中枢」（董事会与高级管理人员）的心态才能被视为法人的心态，分店经理的过失不能归属于公司。这一原则使大型企业很难被追究需要犯意的犯罪。
    concepts: [corporate-liability]
    works: [w-tesco-1971]
    derivedFrom: [e-uk-birmingham-1842]

  - id: e-cn-customs-1987
    year: 1987
    jurisdiction: cn
    type: legislation
    title: 海关法首次规定单位走私犯罪
    description: 1987 年海关法规定企业事业单位、国家机关、社会团体走私的，追究刑事责任。单位犯罪由此进入中国大陆的刑事立法，1997 年刑法在总则中作出系统规定。
    concepts: [corporate-liability]
    works: [w-cn-customs-1987]

  - id: e-us-ussg-1991
    year: 1991
    jurisdiction: us
    type: legislation
    title: 组织体量刑指南：合规计划可以减轻刑罚
    description: 联邦量刑指南第八章规定，企业实施有效的合规与道德计划，可以显著减轻罚金。合规由此从企业管理问题变成刑事责任问题。
    concepts: [corporate-liability]
    works: [w-ussg-1991]
    derivedFrom: [e-us-nyc-railroad-1909, e-us-sra-1984]

  - id: e-uk-cmcha-2007
    year: 2007
    jurisdiction: uk-ew
    type: legislation
    title: 法人杀人罪法
    description: 法人的活动因高级管理层的组织与管理方式存在严重违反注意义务的缺陷而导致他人死亡的，构成法人杀人罪。立法由此绕开同一视原则，转向组织责任。
    concepts: [corporate-liability]
    works: [w-uk-cmcha-2007]
    derivedFrom: [e-uk-tesco-1971]

  - id: e-uk-bribery-2010
    year: 2010
    jurisdiction: uk-ew
    type: legislation
    title: 反贿赂法：「未能预防」型犯罪
    description: 与商业组织有关联的人员为该组织的利益行贿的，组织构成「未能预防贿赂」罪，除非证明自己已经建立了「充分的程序」。以合规缺陷为核心的组织责任由此成为立法模式，此后被推广到逃税、欺诈等领域。
    concepts: [corporate-liability]
    works: [w-uk-bribery-2010]
    derivedFrom: [e-uk-cmcha-2007]

  - id: e-de-vsg-2020
    year: 2020
    jurisdiction: de
    type: legislation
    title: 团体制裁法草案未能通过
    description: 联邦政府提出团体制裁法草案，拟对企业科处与营业额挂钩的制裁，并以合规措施作为减免事由；草案最终未能在议会通过，德国仍维持秩序违反法的模式。
    concepts: [corporate-liability]
    works: [w-de-vsg-2020]
    derivedFrom: [e-de-owig-1968]
    needsSource: true

  - id: e-cn-compliance-2020
    year: 2020
    jurisdiction: cn
    type: legislation
    title: 涉案企业合规改革试点
    description: 最高人民检察院启动涉案企业合规改革试点，对承诺并有效实施合规整改的涉案企业依法作出不起诉等从宽处理。合规由此进入中国大陆的刑事程序。
    concepts: [corporate-liability]
    derivedFrom: [e-cn-1997, e-us-ussg-1991]
    needsSource: true

positions:
  - theory: retributivism
    question: q-corp-possible
    answer: "no"
    derivation:
      - 刑罚以应得为根据。
      - 法人没有自己的意志与罪责，不能应得报应。
  - theory: deterrence
    question: q-corp-possible
    answer: "yes"
    derivation:
      - 处罚法人可以促使企业采取措施预防内部人员犯罪。
  - theory: normative-culp
    question: q-corp-possible
    answer: "no"
    derivation:
      - 责任是对个人意志形成的非难。
      - 法人没有意志，不能成为非难的对象（法人不能犯罪）。
    alternatives:
      - answer: "yes"
        note: 也有学者以「组织责任」「经营责任」类比规范责任，承认法人的可罚性。
  - theory: functional-culp
    question: q-corp-possible
    answer: "yes"
    derivation:
      - 责任由维护规范信赖的需要决定。
      - 法人的组织缺陷同样动摇规范的效力 → 法人可以负责。
    needsSource: true
  - theory: functional-culp
    question: q-corp-model
    answer: organizational
    derivation:
      - 法人的责任不是自然人责任的转嫁，而是其自身组织（合规制度、组织文化）的缺陷。
    needsSource: true
  - theory: deterrence
    question: q-corp-model
    answer: vicarious
    derivation:
      - 以最有效的威慑为准：只要雇员为企业利益犯罪，就让企业承担责任，促使其严加管理。
    needsSource: true
