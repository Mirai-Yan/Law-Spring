# 构成要件（客观面）：因果关系与客观归责、不作为犯
# 起草：AI（Claude）。全部为 draft，日本判例的日期与案名尤需核实。

concepts:
  - id: causation
    name: 因果关系与客观归责
    original:
      de: Kausalität und objektive Zurechnung
      ja: 因果関係・客観的帰属
      en: causation (factual and legal)
    kind: problem
    area: tatbestand
    tradition: both
    summary: >-
      结果在什么条件下可以归属于行为：条件说（等价说）、相当因果关系说、客观归责理论，以及日本判例发展出的「危险的现实化」。
      英美法区分事实因果（but-for）与法律因果（proximate / legal cause），以「介入行为中断因果链」等规则处理介入因素。
      在环境污染等公害犯罪中，能否以疫学（流行病学）证明认定因果关系，是这一专题在当代最具实践意义的延伸。

  - id: omission
    name: 不作为犯
    original:
      de: unechte Unterlassungsdelikte / Garantenstellung
      ja: 不真正不作為犯
      en: omissions / duty to act
    kind: problem
    area: tatbestand
    tradition: both
    summary: >-
      不作为在什么情况下与作为同样可罚：作为义务从哪里来（形式的法义务说、功能二分说、事实上的排他支配说），
      先行行为能否产生作为义务，以及不真正不作为犯的处罚是否违反罪刑法定。英美法原则上不承认一般的救助义务，只在特定关系中课以作为义务。

questions:
  # ---------------- 因果关系 ----------------
  - id: q-causation-test
    concept: causation
    text: 刑法上的因果关系应如何判断：条件说、相当因果关系说、客观归责理论，还是危险的现实化？
    level: intermediate
    aliases:
      - 因果关系
      - 因果关系的判断标准
      - 条件说
      - 相当因果关系说
      - 客观归责
      - 客观归责理论
      - 危险的现实化
      - 结果归属
    answers:
      - id: conditio
        label: 条件说（等价说）
        summary: 「若无前者即无后者」的一切条件都是原因。
      - id: adequacy
        label: 相当因果关系说
        summary: 以社会生活经验判断，该行为通常会导致该结果时才肯定因果关系。
      - id: imputation
        label: 客观归责理论
        summary: 行为制造了法所不允许的危险，且该危险在构成要件的范围内实现为结果。
      - id: realization
        label: 危险的现实化
        summary: 行为所具有的危险在结果中现实化了（日本判例的框架）。

  - id: q-adequacy-basis
    concept: causation
    text: 相当因果关系说中，「相当性」的判断以哪些事实为基础：行为人认识的事实、行为时存在的全部事实，还是一般人可认识的事实？
    level: intermediate
    aliases:
      - 相当性的判断基础
      - 主观的相当因果关系说
      - 客观的相当因果关系说
      - 折中的相当因果关系说
      - 被害人特殊体质
    answers:
      - id: subjective
        label: 主观说（行为人认识或能认识的事实）
      - id: objective
        label: 客观说（行为时存在的全部客观事实）
      - id: eclectic
        label: 折中说（一般人能认识的事实，加上行为人特别认识的事实）

  - id: q-intervening-act
    concept: causation
    text: 介入因素（被害人或第三人的行为、偶然事件）在什么情况下排除结果归属？
    level: applied
    aliases:
      - 介入因素
      - 因果关系的中断
      - 第三人介入
      - 被害人的特殊体质
      - 大阪南港事件
      - novus actus interveniens
      - 溯及禁止
      - 医疗过失介入
    answers:
      - id: never
        label: 原则上不排除（条件说）
      - id: abnormal
        label: 介入因素异常、不可预见时排除
      - id: free-act
        label: 第三人或被害人自由、故意、知情的行为排除归属（溯及禁止、自我答责）
      - id: risk-realization
        label: 看最初行为的危险是否在结果中实现

  - id: q-epidemiological
    concept: causation
    text: 在环境污染、公害等案件中，能否以疫学（流行病学）证明认定刑法上的因果关系？
    level: applied
    aliases:
      - 疫学因果关系
      - 流行病学因果关系
      - 污染环境罪 因果关系
      - 污染环境罪的因果关系
      - 环境犯罪的因果关系
      - 公害犯罪 因果关系
      - 环境犯罪 因果关系
      - 疫学证明
      - 统计学因果关系
    answers:
      - id: "yes"
        label: 可以
        summary: 疫学证明达到排除合理怀疑的程度时，可以认定因果关系。
      - id: limited
        label: 有限度地可以
        summary: 疫学证明只能证明集团层面的关联，须辅以个别证据，才能认定对具体被害人的因果关系。
      - id: "no"
        label: 不可以
        summary: 刑法要求的是对个别结果的因果关系，统计上的关联不足以证明。

  # ---------------- 不作为犯 ----------------
  - id: q-omission-equivalence
    concept: omission
    text: 处罚不真正不作为犯是否违反罪刑法定？
    level: intermediate
    aliases:
      - 不真正不作为犯与罪刑法定
      - 不作为与作为的等价性
      - 不作为犯的处罚根据
      - 德国刑法第13条
    answers:
      - id: no-violation
        label: 不违反（作为犯的构成要件本身可以由不作为实现）
      - id: needs-statute
        label: 需要总则的明文规定才不违反
      - id: equivalence
        label: 只要与作为具有等价性，即可处罚

  - id: q-duty-source
    concept: omission
    text: 作为义务（保证人地位）的来源应如何确定？
    level: intermediate
    aliases:
      - 作为义务的来源
      - 保证人地位
      - 形式的法义务说
      - 功能二分说
      - 排他支配说
      - 保护义务 监督义务
    answers:
      - id: formal
        label: 形式的法义务说（法律、契约、先行行为、条理）
      - id: functional
        label: 功能二分说（保护义务与危险源监督义务）
      - id: exclusive-control
        label: 事实上的排他支配说（结果原因的支配）
      - id: mixed
        label: 形式与实质相结合

  - id: q-prior-conduct
    concept: omission
    text: 先行行为能否产生作为义务？合法的先行行为（如正当防卫）呢？
    level: applied
    aliases:
      - 先行行为
      - 先行行为引起的作为义务
      - 正当防卫后的救助义务
      - Ingerenz
      - 交通肇事后逃逸
    answers:
      - id: yes-all
        label: 包括合法的先行行为
      - id: unlawful-only
        label: 仅限违反义务的先行行为
      - id: "no"
        label: 先行行为不是独立的义务来源

  - id: q-cl-omission
    concept: omission
    text: 刑法应否承认一般的救助义务，处罚「见危不救」？
    level: applied
    aliases:
      - 见危不救
      - Good Samaritan
      - Bad Samaritan
      - 一般救助义务
      - 不救助罪
      - 德国刑法第323c条
    answers:
      - id: no-general
        label: 不承认（只有特定关系才产生作为义务）
      - id: general
        label: 承认（设立见危不救罪）

prerequisites:
  # ---- 因果关系 ----
  - question: q-causation-test
    requires: q-unrecht-core
    kind: foundational
    why: 结果在多大程度上属于不法，决定了结果归属需要怎样的规范筛选。
    branches:
      - answer: result
        leadsTo: 结果归属以事后的客观判断为主；日本的结果无价值论者多批评客观归责论把行为无价值的判断（「法所不允许的危险」）混入构成要件，倾向相当因果关系说或危险的现实化。
      - answer: dual
        leadsTo: 不法包含行为无价值，「制造法所不允许的危险」正是其客观面 → 客观归责理论（德国通说）。
      - answer: monist-act
        leadsTo: 结果只是客观处罚条件；阿明·考夫曼质疑在故意犯中另设客观归责的必要性。

  - question: q-adequacy-basis
    requires: q-causation-test
    kind: logical
    why: 只有采相当因果关系说，才需要决定相当性的判断基础。
    branches:
      - answer: adequacy
        leadsTo: 进入判断基础之争。
      - answer: conditio
        leadsTo: 不需要。
      - answer: imputation
        leadsTo: 客观归责论中「危险的制造」通常从事前、一般人的视角判断，与折中说结构相近。
      - answer: realization
        leadsTo: 以事后查明的全部事实判断危险是否现实化，不再需要这个问题。

  - question: q-adequacy-basis
    requires: q-norm-type
    kind: foundational
    why: 事前判断还是事后判断，与违法评价面向行为规范还是评价规范相对应；这与不能犯中危险判断的基准是同一个问题。
    branches:
      - answer: determination
        leadsTo: 行为规范面向行为时的一般人 → 折中说。
      - answer: evaluation
        leadsTo: 违法是对客观事态的事后评价 → 客观说。
      - answer: both
        leadsTo: 折中说为主。

  - question: q-intervening-act
    requires: q-causation-test
    kind: logical
    why: 介入因素如何处理，是各种因果理论在具体案件中真正分出高下的地方。
    branches:
      - answer: conditio
        leadsTo: 条件关系不因介入而中断 → 原则上不排除（再由故意、过失或量刑调整）。
      - answer: adequacy
        leadsTo: 介入因素异常、超出经验法则时，否定相当性。
      - answer: imputation
        leadsTo: 第三人的自由、故意行为可能排除归属（溯及禁止、自我答责），否则看最初的危险是否实现。
      - answer: realization
        leadsTo: 即使介入因素异常，只要最初行为形成了死因或决定性地提高了危险，危险仍然现实化（大阪南港事件）。

  - question: q-epidemiological
    requires: q-causation-test
    kind: logical
    why: 先要确定因果关系的判断框架，才能讨论疫学证明能否满足它。
    branches:
      - answer: conditio
        leadsTo: 条件关系是事实问题，疫学证明是证明方法的问题；只要达到排除合理怀疑，即可肯定条件关系。
      - answer: adequacy
        leadsTo: 除条件关系外还须判断相当性；污染物质与疾病的关联在经验上已被确认时，相当性通常不成问题。
      - answer: imputation
        leadsTo: 排放行为制造了法所不允许的危险（超标排放），而这一危险在结果中实现；疫学证明主要用于证明危险的实现。
      - answer: realization
        leadsTo: 看排放行为的危险是否在被害人的疾病中现实化；集团层面的疫学证明能否推及个别被害人是关键。

  # ---- 不作为犯 ----
  - question: q-omission-equivalence
    requires: q-legality-basis
    kind: foundational
    why: 不真正不作为犯以作为犯的条文处罚不作为，是否构成类推，取决于罪刑法定要求什么。
    branches:
      - answer: liberal
        leadsTo: 只要作为义务的范围足够明确、国民可以预测，就不违反；否则有类推之嫌 → 倾向要求明文规定或严格限定作为义务。
      - answer: democratic
        leadsTo: 应当由立法者决定哪些不作为可罚 → 倾向需要总则的明文规定（如德国刑法第 13 条）。
      - answer: both
        leadsTo: 以等价性严格限定处罚范围。

  - question: q-duty-source
    requires: q-omission-equivalence
    kind: logical
    why: 确定了不作为可罚的条件之后，才需要追问作为义务从哪里来。
    branches:
      - answer: no-violation
        leadsTo: 作为义务的来源决定了不作为何时符合作为犯的构成要件。
      - answer: needs-statute
        leadsTo: 在法定的保证人地位框架内具体化作为义务。
      - answer: equivalence
        leadsTo: 作为义务必须使不作为与作为在不法上等价 → 倾向实质的义务来源。

  - question: q-duty-source
    requires: q-unrecht-core
    kind: foundational
    why: 不作为的不法是什么，影响作为义务应当以什么为实质根据。
    branches:
      - answer: result
        leadsTo: 不作为的不法在于没有阻止结果；作为义务的根据是对结果原因的支配 → 事实上的排他支配说、结果原因支配说。
      - answer: dual
        leadsTo: 保证人地位是一种特别的义务关系 → 功能二分说（保护义务与监督义务）。
      - answer: monist-act
        leadsTo: 义务违反本身就是不法的核心 → 功能二分说。

  - question: q-prior-conduct
    requires: q-duty-source
    kind: logical
    why: 先行行为是否属于义务来源，以及其范围，取决于义务来源的一般理论。
    branches:
      - answer: formal
        leadsTo: 先行行为是四种形式来源之一；合法的先行行为是否包括在内，存在争论。
      - answer: functional
        leadsTo: 先行行为是危险源监督义务的一种；多数说限于违反义务的先行行为。
      - answer: exclusive-control
        leadsTo: 先行行为本身不足以产生义务，关键是行为人是否事实上排他地支配了结果的发生。
      - answer: mixed
        leadsTo: 先行行为须创设了法所不允许的危险，且行为人支配着危险的进程。

  - question: q-cl-omission
    requires: q-harm
    kind: foundational
    why: 救助义务是否正当，取决于国家可以出于什么理由限制个人自由。
    branches:
      - answer: harm-only
        leadsTo: 不作为也可能「造成伤害」；伤害原则并不当然排除救助义务（范伯格支持处罚见危不救的立法）。
      - answer: harm-offense
        leadsTo: 同上。
      - answer: moralism
        leadsTo: 救助是道德义务，法律道德主义并不能直接推出法律上的救助义务。

relations:
  - from: omission
    to: legality
    type: derived_from
    description: 不真正不作为犯以作为犯的条文处罚不作为，始终面临与罪刑法定的紧张关系。
  - from: causation
    to: impossible-attempt
    type: symmetric
    description: 相当因果关系说的判断基础之争（主观说、客观说、折中说）与不能犯的危险判断基准之争（抽象、具体、客观危险说）在结构上平行：都是在问以事前还是事后、以谁的认识为基础判断危险。

