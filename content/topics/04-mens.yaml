# 主观要件：故意（未必故意与有认识的过失）、事实认识错误
# 起草：AI（Claude）。全部为 draft；学者的立场归属尤需核实。

concepts:
  - id: intent
    name: 故意（未必故意与有认识的过失）
    original:
      de: Vorsatz（dolus eventualis / bewusste Fahrlässigkeit）
      ja: 故意（未必の故意）
      en: intention / recklessness
    kind: problem
    area: mens
    tradition: both
    summary: >-
      故意的本质是认识还是意欲？未必故意（间接故意）与有认识的过失（过于自信的过失）如何区分？
      英美法以意图（intention）、明知（knowledge）、鲁莽（recklessness）、疏忽（negligence）分级，围绕间接意图与鲁莽的主客观标准反复摇摆。

  - id: mistake-of-fact
    name: 事实认识错误
    original:
      de: Tatbestandsirrtum（error in persona, aberratio ictus）
      ja: 事実の錯誤
      en: mistake of fact / transferred malice
    kind: problem
    area: mens
    tradition: both
    summary: >-
      行为人的认识与实际发生的事实不一致时，是否还成立故意：对象错误、打击错误、因果关系错误。
      大陆法上是具体符合说与法定符合说之争，英美法上则以「转移的恶意」（transferred malice）处理。

questions:
  - id: q-intent-essence
    concept: intent
    text: 故意的本质是对构成要件事实的认识（认识说），还是在认识之上的意欲（意欲说）？
    level: intermediate
    aliases:
      - 故意的本质
      - 认识说
      - 意欲说
      - 表象说
      - 意思说
      - 什么是故意
    answers:
      - id: cognition
        label: 认识说（表象说）
      - id: volition
        label: 意欲说（意思说）

  - id: q-dolus-eventualis
    concept: intent
    text: 未必故意（间接故意）与有认识的过失（过于自信的过失）应如何区分？
    level: applied
    aliases:
      - 未必故意
      - 间接故意
      - 有认识的过失
      - 过于自信的过失
      - 放任
      - 间接故意与过于自信的过失的区别
      - 容认说
      - 盖然性说
      - dolus eventualis
    answers:
      - id: acceptance
        label: 容认说（认容说）
        summary: 认识到结果可能发生并容认其发生的，是未必故意。
      - id: probability
        label: 盖然性说
        summary: 认识到结果发生的高度盖然性的，是未必故意。
      - id: motive
        label: 动机说
        summary: 认识到结果可能发生，却没有以此作为放弃行为的动机的，是未必故意。

  - id: q-cl-intention
    concept: intent
    text: 英美法上的「意图」（intention）是否包括对几乎确定会发生的后果的认识（间接意图）？
    level: applied
    aliases:
      - oblique intention
      - 间接意图
      - Woollin
      - virtual certainty
      - 几乎确定的后果
    answers:
      - id: direct-only
        label: 只包括直接意图（目的）
      - id: virtual-certainty
        label: 包括对几乎确定的后果的认识

  - id: q-cl-recklessness
    concept: intent
    text: 鲁莽（recklessness）应采主观标准（行为人实际意识到风险），还是客观标准（理性人会意识到的明显风险）？
    level: applied
    aliases:
      - recklessness
      - 鲁莽
      - Caldwell
      - Cunningham
      - R v G
      - 主观鲁莽 客观鲁莽
    answers:
      - id: subjective
        label: 主观标准
      - id: objective
        label: 客观标准

  - id: q-mistake-standard
    concept: mistake-of-fact
    text: 构成要件事实的错误，应采具体符合说，还是法定符合说？
    level: intermediate
    aliases:
      - 具体符合说
      - 法定符合说
      - 事实认识错误
      - 认识错误的处理
      - 抽象符合说
    answers:
      - id: concrete
        label: 具体符合说
        summary: 认识的事实与发生的事实须具体一致（至少在法益主体上一致）。
      - id: legal
        label: 法定符合说
        summary: 在同一构成要件的范围内一致即可。

  - id: q-aberratio
    concept: mistake-of-fact
    text: 打击错误（如甲向乙开枪，却误中旁边的丙）应如何处理？
    level: applied
    aliases:
      - 打击错误
      - 方法错误
      - 误中他人
      - aberratio ictus
      - 转移的恶意
      - transferred malice
    answers:
      - id: attempt-plus-negligence
        label: 对乙成立未遂，对丙成立过失
      - id: intentional
        label: 对丙成立故意既遂（一故意说）
      - id: multiple-intent
        label: 对乙未遂、对丙既遂，想象竞合（数故意说）

  - id: q-error-in-persona-instigator
    concept: mistake-of-fact
    text: 被教唆者发生对象错误时（罗泽—罗萨尔案），教唆者应如何处理？
    level: applied
    aliases:
      - 罗泽罗萨尔案
      - Rose-Rosahl
      - 被教唆者的对象错误
      - 教唆 对象错误
      - Hoferben 案
    answers:
      - id: instigation-completed
        label: 教唆者成立既遂罪的教唆
      - id: aberratio-for-instigator
        label: 对教唆者而言属于打击错误

prerequisites:
  - question: q-intent-essence
    requires: q-unrecht-core
    kind: foundational
    why: 故意是不法要素还是责任要素、承担什么功能，影响它的核心是认识还是意志。
    branches:
      - answer: result
        leadsTo: 故意是责任要素，非难的根据在于行为人认识到了结果却仍然行为 → 倾向认识说（动机说）。
      - answer: dual
        leadsTo: 故意是行为无价值的核心，体现行为人对法益的敌对意志 → 倾向意欲说（容认说）。
      - answer: monist-act
        leadsTo: 故意就是实现构成要件的意志（目的性）→ 意欲说。

  - question: q-dolus-eventualis
    requires: q-intent-essence
    kind: logical
    why: 未必故意的界限，取决于故意的本质是认识还是意欲。
    branches:
      - answer: cognition
        leadsTo: 以认识的程度或其对动机的影响为准 → 盖然性说、动机说。
      - answer: volition
        leadsTo: 以行为人对结果的意志态度为准 → 容认说。

  - question: q-cl-intention
    requires: q-cl-basis
    kind: foundational
    why: 意图的范围，取决于刑事责任以行为人的内心还是外在标准为准。
    branches:
      - answer: subjectivism
        leadsTo: 以行为人实际的认识为准；认识到后果几乎确定，与追求它同样可责 → 包括间接意图（Woollin）。
      - answer: objectivism
        leadsTo: 历史上曾以「自然而可能的后果」客观推定意图（DPP v Smith），后被立法否定。

  - question: q-cl-recklessness
    requires: q-cl-basis
    kind: foundational
    why: 鲁莽的标准之争，就是主观主义与客观主义在可责性层面的直接交锋。
    branches:
      - answer: subjectivism
        leadsTo: 只有行为人实际意识到风险才可责 → 主观标准（Cunningham、R v G）。
      - answer: objectivism
        leadsTo: 没有注意到明显风险本身也值得谴责 → 客观标准（Caldwell）。

  - question: q-mistake-standard
    requires: q-unrecht-core
    kind: foundational
    why: 故意要「符合」到什么程度，取决于不法以具体的法益侵害为准，还是以规范的违反为准。
    branches:
      - answer: result
        leadsTo: 不法是对具体法益主体的侵害，故意也应针对具体的法益主体 → 倾向具体符合说（平野、西田、山口）。
      - answer: dual
        leadsTo: 规范地看，行为人违反了「不得杀人」的规范，杀「人」的故意已经实现 → 倾向法定符合说（日本判例与团藤、大塚）；但德国的通说采具体化说。
      - answer: monist-act
        leadsTo: 以行为人的意志是否实现了其所针对的对象为准。

  - question: q-aberratio
    requires: q-mistake-standard
    kind: logical
    why: 打击错误是具体符合说与法定符合说分歧最明显的场合。
    branches:
      - answer: concrete
        leadsTo: 行为人想杀的是乙，丙的死亡不在其故意之内 → 对乙未遂、对丙过失。
      - answer: legal
        leadsTo: 杀「人」的故意已经实现 → 对丙成立故意既遂；对乙是否另成立未遂，有一故意说与数故意说之争。

  - question: q-error-in-persona-instigator
    requires: q-mistake-standard
    kind: logical
    why: 被教唆者的对象错误对教唆者意味着什么，取决于错误论的一般立场。
    branches:
      - answer: concrete
        leadsTo: 教唆者所针对的是特定的人，被教唆者杀错了人，对教唆者而言类似打击错误 → 争议很大。
      - answer: legal
        leadsTo: 教唆者教唆的是「杀人」，被教唆者实现了杀人 → 成立既遂罪的教唆。

  - question: q-error-in-persona-instigator
    requires: q-comp-basis
    kind: logical
    why: 教唆者为什么要对正犯的结果负责，影响正犯的错误能否归属于教唆者。
    branches:
      - answer: causation
        leadsTo: 教唆者通过正犯引起了法益侵害；被教唆者的对象错误是否超出了教唆者所引起的危险，成为判断关键。
      - answer: unrecht
        leadsTo: 教唆者从属于正犯的违法行为，正犯的对象错误不影响其故意 → 成立既遂罪的教唆。
      - answer: schuld
        leadsTo: 同上。

relations:
  - from: intent
    to: negligence-structure
    type: symmetric
    description: 未必故意与有认识的过失之间的界线，是故意论与过失论共同的边界问题。
  - from: mistake-of-fact
    to: intent
    type: derived_from
    description: 事实认识错误是故意认识内容的反面：错误到什么程度会阻却故意，取决于故意需要认识什么。

