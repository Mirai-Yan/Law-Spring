events:
  # ---------------- 故意 ----------------
  - id: e-de-frank-1890
    year: 1890
    jurisdiction: de
    type: origin
    originOf: intent
    originType: problem
    title: 认识说与意欲说之争
    description: 弗兰克等人围绕故意的本质展开争论：故意是对构成要件事实的表象（认识说），还是对结果的意欲（意欲说）？与之相连的「弗兰克公式」以「即使知道结果确定发生也仍然会行为」作为未必故意的标准。
    concepts: [intent]
    scholars: [frank]
    works: [w-frank-1890]
    needsSource: true
    editorNote: 故意概念本身古已有之，这里以近代认识说与意欲说的对立作为起点。

  - id: e-de-lederriemen-1955
    year: 1955
    jurisdiction: de
    type: case
    title: 皮带案：以「容认」界定未必故意
    description: 被告人用皮带勒住被害人颈部以便抢劫，虽然不希望其死亡，但认识到死亡的可能并为了达到目的而接受了这种可能。联邦最高法院认为，只要行为人「在法律意义上容认」结果的发生，即使内心不希望，也成立未必故意。
    concepts: [intent]
    works: [w-bghst-7-363]
    derivedFrom: [e-de-frank-1890]

  - id: e-uk-cunningham-1957
    year: 1957
    jurisdiction: uk-ew
    type: case
    title: R v Cunningham：主观的鲁莽
    description: 被告人为偷硬币扯断煤气表，泄漏的煤气使邻居中毒。法院认为，成文法中的「恶意」要求行为人实际预见到了这种伤害的可能性。
    concepts: [intent]
    works: [w-cunningham-1957]

  - id: e-uk-dpp-smith-1960
    year: 1960
    jurisdiction: uk-ew
    type: case
    title: DPP v Smith：以客观标准推定意图
    description: 上议院认为，一个理性人会预见到的自然而可能的后果，可以推定为行为人所意图。这一客观标准受到主观主义学者的强烈批评。
    concepts: [intent]
    works: [w-dpp-smith-1960]

  - id: e-uk-cja-1967
    year: 1967
    jurisdiction: uk-ew
    type: legislation
    title: 1967 年刑事司法法第 8 条
    description: 法院不得仅因后果是行为自然而可能的结果，就认定行为人意图或预见到了它，而应综合全部证据判断。DPP v Smith 的客观推定由此被立法否定。
    concepts: [intent]
    works: [w-uk-cja-1967]
    derivedFrom: [e-uk-dpp-smith-1960]

  - id: e-uk-caldwell-1981
    year: 1981
    jurisdiction: uk-ew
    type: case
    title: Caldwell 案：客观的鲁莽
    description: 上议院认为，没有考虑到一个明显的风险，也构成鲁莽。这使鲁莽在相当范围内客观化，引发持续二十年的批评。
    concepts: [intent]
    works: [w-caldwell-1981]
    derivedFrom: [e-uk-cunningham-1957]

  - id: e-uk-woollin-1998
    year: 1998
    jurisdiction: uk-ew
    type: case
    title: R v Woollin：几乎确定的后果
    description: 上议院认为，如果死亡或重伤是被告人行为几乎确定的后果，且被告人认识到这一点，陪审团就可以认定其具有意图。间接意图的标准由此确立。
    concepts: [intent]
    works: [w-woollin-1998]
    derivedFrom: [e-uk-cja-1967]

  - id: e-uk-r-v-g-2003
    year: 2003
    jurisdiction: uk-ew
    type: turn
    title: R v G：推翻 Caldwell
    description: 两名少年点燃报纸引发大火，但没有意识到风险。上议院推翻 Caldwell，恢复了主观的鲁莽标准：只有行为人意识到风险而不合理地冒险，才构成鲁莽。
    concepts: [intent]
    works: [w-r-v-g-2003]
    derivedFrom: [e-uk-caldwell-1981]

  # ---------------- 事实认识错误 ----------------
  - id: e-de-rose-rosahl-1859
    year: 1859
    jurisdiction: de
    type: origin
    originOf: mistake-of-fact
    originType: case
    title: 罗泽—罗萨尔案
    description: 罗萨尔教唆罗泽杀害某人，罗泽在黑暗中误杀了另一个人。普鲁士最高法院认为，正犯的对象错误不影响其故意，也不影响教唆者的责任。对象错误、打击错误的区分以及「被教唆者的错误对教唆者意味着什么」由此成为经典问题。
    concepts: [mistake-of-fact]
    works: [w-rose-rosahl-1859]
    needsSource: true

  - id: e-uk-pembliton-1874
    year: 1874
    jurisdiction: uk-ew
    type: case
    title: R v Pembliton：恶意不能跨罪名转移
    description: 被告人向人群扔石头，却打碎了窗户。法院认为，伤害他人的恶意不能转移为毁损财物的恶意。
    concepts: [mistake-of-fact]
    works: [w-pembliton-1874]

  - id: e-uk-latimer-1886
    year: 1886
    jurisdiction: uk-ew
    type: case
    title: R v Latimer：转移的恶意
    description: 被告人用皮带打人，皮带反弹伤及旁人。法院认为，针对甲的恶意可以转移到实际受害的乙，被告人对乙成立伤害罪。英美法以此处理打击错误。
    concepts: [mistake-of-fact]
    works: [w-latimer-1886]
    derivedFrom: [e-uk-pembliton-1874]

  - id: e-jp-1978-byouuchi
    year: 1978
    jurisdiction: jp
    type: case
    title: 铆钉枪案：数故意犯说
    description: 被告人用改造的铆钉枪射击警察，子弹贯穿警察后又击中路人。最高裁判所认为，对警察与路人都成立杀人未遂（数故意犯说）。法定符合说由此在判例上确立。
    concepts: [mistake-of-fact]
    works: [w-jp-1978-byouuchi]
    derivedFrom: [e-de-rose-rosahl-1859]
    needsSource: true

  - id: e-de-hoferben-1990
    year: 1990
    jurisdiction: de
    type: case
    title: 农场继承人案
    description: 父亲教唆他人杀害儿子，被教唆者误杀了一名邻居。联邦最高法院认为，被教唆者的对象错误对教唆者来说原则上也不重要，教唆者成立谋杀教唆；但若错误超出了可预见的范围，则另当别论。
    concepts: [mistake-of-fact]
    works: [w-bghst-37-214]
    derivedFrom: [e-de-rose-rosahl-1859]

positions:
  # ---- 故意 ----
  - theory: result-disvalue
    question: q-intent-essence
    answer: cognition
    derivation:
      - 故意是责任要素。
      - 非难的根据在于行为人认识到结果仍然行为 → 认识说。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-intent-essence
    answer: volition
    derivation:
      - 故意是行为无价值的核心。
      - 它体现了行为人对法益的敌对意志 → 意欲说。
  - theory: monist-act-disvalue
    question: q-intent-essence
    answer: volition
    derivation:
      - 故意就是实现构成要件的意志（目的性）。
  - theory: result-disvalue
    question: q-dolus-eventualis
    answer: motive
    derivation:
      - 以认识为核心。
      - 认识到结果可能发生，却没有以此作为放弃行为的动机 → 动机说。
    alternatives:
      - answer: probability
        note: 也有结果无价值论者采盖然性说。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-dolus-eventualis
    answer: acceptance
    derivation:
      - 以意志为核心。
      - 认识到结果可能发生并容认其发生 → 容认说（日本与中国大陆的通说，德国判例的「法律意义上的容认」）。
  - theory: cl-subjectivism
    question: q-cl-intention
    answer: virtual-certainty
    derivation:
      - 刑事责任取决于行为人实际的认识。
      - 认识到后果几乎确定却仍然行为，与追求它同样可责。
  - theory: cl-subjectivism
    question: q-cl-recklessness
    answer: subjective
    derivation:
      - 只有行为人实际意识到风险，才有可责的选择。
  - theory: cl-objectivism
    question: q-cl-recklessness
    answer: objective
    derivation:
      - 没有注意到明显的风险，本身就体现了对他人利益的漠视。
    needsSource: true

  # ---- 事实认识错误 ----
  - theory: result-disvalue
    question: q-mistake-standard
    answer: concrete
    derivation:
      - 不法是对具体法益主体的侵害。
      - 故意也应针对具体的法益主体 → 具体符合说。
    alternatives:
      - answer: legal
        note: 也有结果无价值论者采法定符合说（如前田雅英）。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-mistake-standard
    answer: legal
    derivation:
      - 行为人违反了「不得杀人」的规范。
      - 在同一构成要件内，杀「人」的故意已经实现 → 法定符合说。
    alternatives:
      - answer: concrete
        note: 德国的通说采具体化说。
        jurisdictions: [de]
  - theory: result-disvalue
    question: q-aberratio
    answer: attempt-plus-negligence
    derivation:
      - 采具体符合说。
      - 行为人的故意针对乙，丙的死亡不在故意之内 → 对乙未遂、对丙过失。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-aberratio
    answer: multiple-intent
    derivation:
      - 采法定符合说。
      - 对乙、丙都存在杀人的故意 → 对乙未遂、对丙既遂，想象竞合（日本判例的数故意犯说）。
    alternatives:
      - answer: attempt-plus-negligence
        note: 德国通说采具体化说，结论同具体符合说。
        jurisdictions: [de]

