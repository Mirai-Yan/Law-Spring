events:
  - id: e-de-liszt-bridge
    year: 1881
    jurisdiction: de
    type: origin
    originOf: withdrawal
    originType: term
    title: 李斯特：中止犯是一座「黄金桥」
    description: 立法者在行为人已经越过未遂的界线之后，为他架起一座退回的「黄金桥」，以鼓励他放弃犯罪、保护被害人。中止犯的减免根据由此成为独立的问题。
    concepts: [withdrawal]
    scholars: [liszt]
    works: [w-liszt-1881]
    derivedFrom: [e-de-stgb-1871]
    needsSource: true
    editorNote: 中止的规定在 1871 年刑法典中已经存在；这里以「为什么减免」这一问题的经典表述作为起点。

  - id: e-us-rizzo-1927
    year: 1927
    jurisdiction: us
    type: case
    title: People v. Rizzo：危险接近
    description: 被告人与同伙携枪驾车寻找预定抢劫的工资押运员，却始终没有找到他，随即被捕。法院认为，他们的行为尚未达到「危险接近」犯罪完成的程度，不成立抢劫未遂。
    concepts: [commencement]
    works: [w-rizzo-1927]

  - id: e-uk-gullefer-1987
    year: 1987
    jurisdiction: uk-ew
    type: case
    title: R v Gullefer：开始实施犯罪本身
    description: 被告人冲进赛狗场跑道，想让比赛作废以收回赌注。上诉法院认为，「超出单纯预备」意味着行为人已经开始实施「犯罪本身」，本案尚未达到这一程度。
    concepts: [commencement]
    works: [w-gullefer-1987]
    derivedFrom: [e-uk-caa-1981]

  - id: e-uk-geddes-1996
    year: 1996
    jurisdiction: uk-ew
    type: case
    title: R v Geddes：在学校厕所里等待
    description: 被告人带着绳索与胶带藏在学校的男厕所里，显然意图绑架学生，但尚未接触任何人。上诉法院认为，他只是做了准备，不成立未遂。英格兰标准的严格程度由此显现。
    concepts: [commencement]
    works: [w-geddes-1996]
    derivedFrom: [e-uk-gullefer-1987]

  - id: e-jp-chloroform-2004
    year: 2004
    jurisdiction: jp
    type: case
    title: 氯仿案：构成要件的提前实现
    description: 被告人计划先用氯仿使被害人昏迷，再连车推入海中溺死，但被害人可能在吸入氯仿时就已死亡。最高裁判所认为，使用氯仿的行为与推入海中的行为紧密相连，在使用氯仿时已经着手，成立杀人既遂。
    concepts: [commencement]
    works: [w-jp-chloroform-2004]
    derivedFrom: [e-jp-code-1907]
    needsSource: true

positions:
  # ---- 着手 ----
  - theory: result-disvalue
    question: q-commencement
    answer: material-result
    derivation:
      - 未遂的处罚根据是法益侵害的危险。
      - 只有当这种危险达到具体、紧迫的程度时，才进入未遂 → 实质客观说（结果说）。
    alternatives:
      - answer: material-act
        note: 也有结果无价值论者采行为说。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-commencement
    answer: individual
    derivation:
      - 未遂的不法包含行为人的意思。
      - 以行为人的计划为基础，判断行为是否直接接近构成要件的实现（德国刑法第 22 条）。
    alternatives:
      - answer: material-act
        note: 日本的行为无价值论者多采实质客观说（行为说）。
        jurisdictions: [jp]
  - theory: monist-act-disvalue
    question: q-commencement
    answer: individual
    derivation:
      - 未遂与既遂的不法相同，核心是行为人的意志。
      - 以行为人的计划为基础判断着手。
    needsSource: true
  - theory: classical-school
    question: q-commencement
    answer: formal
    derivation:
      - 刑法评价的是构成要件所描述的行为。
      - 开始实施构成要件行为时才是着手 → 形式客观说。
  - theory: modern-school
    question: q-commencement
    answer: subjective
    derivation:
      - 刑法评价的是行为人的危险性格。
      - 犯意确定地、飞跃性地表现于外部时即为着手 → 主观说。
  - theory: cl-subjectivism
    question: q-cl-attempt-actus
    answer: substantial-step
    derivation:
      - 以行为人的危险意图为核心。
      - 只要行为强有力地确证了犯罪意图即可 → 实质步骤（MPC）。
  - theory: cl-objectivism
    question: q-cl-attempt-actus
    answer: proximity
    derivation:
      - 未遂要求外在的、显现的犯罪性。
      - 行为须接近完成 → 危险接近。
    needsSource: true
  - theory: dual-act-disvalue
    question: q-premature-realization
    answer: completed
    derivation:
      - 按行为人的计划，第一行为已经直接接近构成要件的实现 → 已经着手。
      - 已着手后的因果偏离在同一构成要件内不重要 → 故意既遂。
  - theory: result-disvalue
    question: q-premature-realization
    answer: completed
    derivation:
      - 第一行为若已使死亡的危险迫切化，即为着手。
      - 结果是该危险的现实化 → 故意既遂。
    alternatives:
      - answer: attempt-plus-negligence
        note: 也有学者认为故意必须在实际导致结果的行为时存在，第一行为只成立未遂与过失致死。
    needsSource: true

  # ---- 中止 ----
  - theory: dual-act-disvalue
    question: q-withdrawal-basis
    answer: purpose
    derivation:
      - 自动中止表明行为人的犯罪意志并不坚定。
      - 一般预防与特别预防的必要性都降低 → 刑罚目的说（德国通说）。
    alternatives:
      - answer: schuld-decrease
        note: 日本与中国大陆的学说多从违法减少或责任减少说明。
        jurisdictions: [jp, cn]
  - theory: result-disvalue
    question: q-withdrawal-basis
    answer: unrecht-decrease
    derivation:
      - 中止消除了法益侵害的危险。
      - 违法因此减少 → 违法减少说。
    alternatives:
      - answer: schuld-decrease
        note: 也有结果无价值论者采责任减少说，或两者并用。
    needsSource: true
  - theory: special-prevention
    question: q-withdrawal-basis
    answer: purpose
    derivation:
      - 中止表明行为人没有再犯的危险。
      - 特别预防的必要性消失 → 减免刑罚。
  - theory: deterrence
    question: q-withdrawal-basis
    answer: policy
    derivation:
      - 以减免刑罚为诱因，鼓励行为人中途放弃 → 黄金桥。
  - theory: cl-subjectivism
    question: q-cl-abandonment
    answer: recognized
    derivation:
      - 刑法针对的是行为人的危险意图。
      - 自愿而彻底的放弃表明这种危险已经消失 → 承认（MPC）。
    needsSource: true
  - theory: cl-objectivism
    question: q-cl-abandonment
    answer: not-recognized
    derivation:
      - 未遂的外在不法已经完成。
      - 事后的放弃不能抹去已经发生的不法 → 不承认（英格兰）。
    needsSource: true
