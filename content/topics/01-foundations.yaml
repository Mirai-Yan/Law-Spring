events:
  # ---------------- 罪刑法定 ----------------
  - id: e-uk-magna-carta-1215
    year: 1215
    jurisdiction: uk-ew
    type: prehistory
    title: 大宪章第 39 条
    description: 非经同侪的合法裁判或依国法，不得逮捕、监禁或剥夺任何自由人的权利。常被视为罪刑法定与正当程序的远源。
    concepts: [legality]
    works: [w-magna-carta-1215]

  - id: e-de-feuerbach-legality-1801
    year: 1801
    jurisdiction: de
    type: origin
    originOf: legality
    originType: term
    title: 费尔巴哈：「无法律则无犯罪，无法律则无刑罚」
    description: 费尔巴哈以拉丁法谚的形式表述罪刑法定，并以心理强制说为其理论基础：只有事先以法律明示刑罚，才能产生威慑。罪刑法定从此成为近代刑法的基石。
    concepts: [legality]
    scholars: [feuerbach]
    works: [w-feuerbach-1801]

  - id: e-us-constitution-1787
    year: 1787
    jurisdiction: us
    type: legislation
    title: 美国宪法禁止事后法
    description: 宪法第 1 条第 9、10 款禁止联邦与各州制定事后法（ex post facto law），使禁止溯及成为宪法原则。
    concepts: [legality]
    works: [w-us-constitution-1787]
    derivedFrom: [e-uk-magna-carta-1215]

  - id: e-jp-old-code-1880
    year: 1880
    jurisdiction: jp
    type: legislation
    title: 旧刑法第 2 条明文规定罪刑法定
    description: 受法国法影响的旧刑法规定，法律没有正式条文的，不论何种行为都不得处罚。
    concepts: [legality]
    works: [w-jp-old-code-1880]
    derivedFrom: [e-de-feuerbach-legality-1801]
    editorNote: 旧刑法主要继受法国刑法（博瓦索纳德起草），这里的「派生」指罪刑法定思想的传播，而非直接继受德国。

  - id: e-jp-code-1907
    year: 1907
    jurisdiction: jp
    type: legislation
    title: 现行刑法公布
    description: >-
      转而参照德国法制定，法定刑幅度宽、广泛承认酌量减轻，带有近代学派的色彩；没有再明文规定罪刑法定。
      总则中规定了正当防卫（第 36 条）、紧急避险（第 37 条）、不知法不免责但可减轻（第 38 条第 3 款）、心神丧失与心神耗弱（第 39 条）、
      未遂与中止（第 43 条，中止「必须」减免）等。
    concepts: [criminal-law-schools, legality, self-defense, necessity, mistake-of-law, insanity, commencement, withdrawal]
    works: [w-jp-code-1907]
    derivedFrom: [e-de-liszt-1882, e-jp-old-code-1880]
    needsSource: true

  - id: e-de-1935-analogy
    year: 1935
    jurisdiction: de
    type: legislation
    title: 纳粹时期允许依「健全的国民感情」类推处罚
    description: 修正后的刑法第 2 条规定，依照刑法的基本思想与健全的国民感情应受处罚的行为，即使没有法律规定也应处罚。罪刑法定被正式废弃。
    concepts: [legality]
    works: [w-de-1935-analogy]
    derivedFrom: [e-de-feuerbach-legality-1801]

  - id: e-de-radbruch-1946
    year: 1946
    jurisdiction: de
    type: development
    title: 拉德布鲁赫公式
    description: 实在法原则上优先，即使其内容不正义；但当其与正义的冲突达到不能容忍的程度时，「不正当的法」应让位于正义。这个公式后来成为处理纳粹与东德不法的重要依据，也与禁止溯及原则形成张力。
    concepts: [legality]
    scholars: [radbruch]
    works: [w-radbruch-1946]
    derivedFrom: [e-de-1935-analogy]

  - id: e-de-gg-1949
    year: 1949
    jurisdiction: de
    type: legislation
    title: 基本法第 103 条第 2 款
    description: 行为只有在实施之前已由法律规定为可罚时，才能受处罚。罪刑法定由此获得宪法位阶。
    concepts: [legality]
    works: [w-de-gg-1949]
    derivedFrom: [e-de-1935-analogy]

  - id: e-uk-shaw-1961
    year: 1961
    jurisdiction: uk-ew
    type: case
    title: Shaw v DPP：法院承认「共谋败坏公共道德罪」
    description: 上议院认可了一个此前没有先例的普通法犯罪，被批评为法院在事后创设犯罪，也与德夫林的法律道德主义相呼应。
    concepts: [legality, harm-principle]
    works: [w-shaw-1961]
    derivedFrom: [e-uk-devlin-1959]

  - id: e-us-connally-1926
    year: 1926
    jurisdiction: us
    type: case
    title: 「因模糊而无效」原则
    description: 联邦最高法院认为，如果法律的用语模糊到一般智力的人只能猜测其含义，就违反正当程序。明确性原则由此在美国以宪法形式出现。
    concepts: [legality]
    works: [w-connally-1926]
    derivedFrom: [e-us-constitution-1787]

  - id: e-jp-constitution-1946
    year: 1946
    jurisdiction: jp
    type: legislation
    title: 日本国宪法为罪刑法定提供宪法依据
    description: 第 31 条（非依法律规定的程序，不得剥夺生命、自由或科处其他刑罚）与第 39 条（禁止溯及处罚）被理解为罪刑法定的宪法根据。
    concepts: [legality]
    works: [w-jp-constitution-1946]
    derivedFrom: [e-jp-old-code-1880]

  - id: e-de-mauerschuetzen-1992
    year: 1992
    jurisdiction: de
    type: case
    title: 柏林墙射杀案
    description: 联邦最高法院认为，东德边境法中允许向越境者开枪的规定因明显违反正义而不能作为正当化事由。禁止溯及原则与实质正义之间的冲突由此成为罪刑法定论的重要课题。
    concepts: [legality]
    works: [w-bghst-39-1]
    derivedFrom: [e-de-radbruch-1946, e-de-gg-1949]

  - id: e-cn-2010-interp
    year: 2010
    jurisdiction: cn
    type: critique
    title: 形式解释论与实质解释论之争
    description: 陈兴良与张明楷在同一年分别撰文，重申形式解释论与实质解释论。争论的焦点是：在罪刑法定之下，形式判断是否必须先于实质判断。
    concepts: [legality]
    scholars: [chen-xingliang, zhang-mingkai]
    works: [w-chen-2010, w-zhang-2010]
    derivedFrom: [e-cn-1997]
    needsSource: true

  # ---------------- 学派之争 ----------------
  - id: e-de-liszt-1882
    year: 1882
    jurisdiction: de
    type: origin
    originOf: criminal-law-schools
    originType: problem
    title: 李斯特的马堡计划
    description: 刑罚是实现目的的手段：对可改善者改善，对不需改善者威吓，对不可改善者隔离。应受处罚的「不是行为，而是行为人」。德国的近代学派由此登场，学派之争随之展开（意大利的龙勃罗梭、菲利已更早提出实证学派的主张）。
    concepts: [criminal-law-schools, punishment-justification]
    scholars: [liszt]
    works: [w-liszt-1882]

  - id: e-de-ikv-1889
    year: 1889
    jurisdiction: de
    type: development
    title: 国际刑事学协会成立
    description: 李斯特与荷兰的范·哈默尔、比利时的普林斯共同创立国际刑事学协会，推动以刑事政策为导向的刑法改革。
    concepts: [criminal-law-schools]
    scholars: [liszt]
    derivedFrom: [e-de-liszt-1882]

  - id: e-de-birkmeyer-1907
    year: 1907
    jurisdiction: de
    type: critique
    title: 比克迈尔：李斯特还给刑法留下了什么？
    description: 后期古典学派批判近代学派：以行为人的危险性取代行为的不法与责任，会瓦解刑法的法治国界限。
    concepts: [criminal-law-schools]
    scholars: [birkmeyer]
    works: [w-birkmeyer-1907]
    derivedFrom: [e-de-liszt-1882]
    needsSource: true

  - id: e-jp-makino-1909
    year: 1909
    circa: true
    jurisdiction: jp
    type: reception
    title: 牧野英一倡导主观主义刑法学
    description: 牧野英一继受李斯特与意大利学派，主张目的刑论、社会责任论，在未遂上采主观说，在共犯上采共犯独立性说与行为共同说，成为日本新派的代表。
    concepts: [criminal-law-schools, commencement, perpetration, complicity-basis]
    scholars: [makino]
    derivedFrom: [e-de-liszt-1882]
    needsSource: true
    editorNote: 年份为编者估计。

  - id: e-jp-takigawa-1933
    year: 1933
    jurisdiction: jp
    type: development
    title: 泷川事件
    description: 京都大学教授泷川幸辰因其自由主义的刑法学说被文部省停职，法学部教授集体辞职抗议。旧派客观主义刑法学的法治国立场在政治压力下受到打压。
    concepts: [criminal-law-schools, legality]
    scholars: [takigawa]

  - id: e-us-martinson-1974
    year: 1974
    jurisdiction: us
    type: critique
    title: 「什么有效？」与矫正理想的衰落
    description: 马丁森对大量矫正项目的评估结论被概括为「没有什么有效」，以特别预防为核心的矫正理想与不定期刑制度由此受到普遍质疑。
    concepts: [criminal-law-schools, punishment-justification]
    scholars: [martinson]
    works: [w-martinson-1974]

  - id: e-us-von-hirsch-1976
    year: 1976
    jurisdiction: us
    type: turn
    title: 冯·赫希《实现正义》：应得模式
    description: 刑罚应当与犯罪的严重性相称（commensurate deserts），而不以改善或威慑效果为依据。美国量刑由此从矫正理想转向以应得为基础。
    concepts: [punishment-justification, criminal-law-schools]
    scholars: [von-hirsch]
    works: [w-von-hirsch-1976]
    derivedFrom: [e-us-martinson-1974]

  # ---------------- 刑罚根据 ----------------
  - id: e-uk-bentham-1789
    year: 1789
    jurisdiction: uk-ew
    type: origin
    originOf: punishment-justification
    originType: problem
    title: 边沁：功利主义的刑罚论
    description: 一切刑罚本身都是恶；只有当它能排除更大的恶时才能被允许。刑罚的正当性完全在于其预防效果。
    concepts: [punishment-justification]
    scholars: [bentham]
    works: [w-bentham-1789]
    editorNote: 报应与预防的对立可上溯至古代（柏拉图、塞涅卡），意大利的贝卡里亚（1764）也早于边沁；这里以本应用所收法域中的近代经典表述作为起点。

  - id: e-de-kant-1797
    year: 1797
    jurisdiction: de
    type: development
    title: 康德：刑罚只能因为犯罪而科处
    description: >-
      刑罚绝不能仅仅作为促进犯罪人自身或市民社会其他利益的手段，而只能因为他犯了罪而科处；即使市民社会即将解散，也应先处决监狱中最后一名杀人犯（「岛屿之例」）。
      康德也讨论了紧急状态（如船难中抢夺木板）：这种行为不可罚，但并不因此正当。
    concepts: [punishment-justification, necessity]
    scholars: [kant]
    works: [w-kant-1797]

  - id: e-de-feuerbach-psych-1801
    year: 1801
    jurisdiction: de
    type: development
    title: 费尔巴哈：心理强制说
    description: 以法律预告刑罚，使人们在权衡犯罪的快乐与刑罚的痛苦后放弃犯罪。这是一般预防论的经典形态，也是罪刑法定的理论基础。
    concepts: [punishment-justification]
    scholars: [feuerbach]
    works: [w-feuerbach-1801]
    derivedFrom: [e-de-kant-1797]

  - id: e-uk-hart-1959
    year: 1959
    jurisdiction: uk-ew
    type: development
    title: 哈特：区分刑罚的「一般正当化目的」与「分配」
    description: 刑罚制度的一般正当化目的可以是功利主义的（减少犯罪），但刑罚应该分配给谁、分配多少，必须受到报应性原则的约束（只惩罚有责任的人）。哈特同时以「选择的能力与公平机会」说明刑事责任。
    concepts: [punishment-justification, culpability-essence]
    scholars: [hart]
    works: [w-hart-1959]
    derivedFrom: [e-uk-bentham-1789, e-de-kant-1797]

  - id: e-de-bghst-1954
    year: 1954
    jurisdiction: de
    type: case
    title: 量刑上的幅的理论
    description: 联邦最高法院认为，与责任相适应的刑罚不是一个精确的点，而是一个幅度；法官可以在这个幅度内考虑预防的需要。
    concepts: [punishment-justification]
    works: [w-bghst-7-28]
    needsSource: true

  - id: e-de-roxin-1966
    year: 1966
    jurisdiction: de
    type: development
    title: 罗克辛：辩证的综合理论
    description: 刑罚的正当性分三个阶段说明：立法阶段着眼于一般预防，裁判阶段以责任为上限，执行阶段着眼于特别预防。责任限制预防，而不是刑罚的独立目的。
    concepts: [punishment-justification]
    scholars: [roxin]
    works: [w-roxin-1966]
    derivedFrom: [e-de-liszt-1882, e-de-kant-1797]

  - id: e-us-sra-1984
    year: 1984
    jurisdiction: us
    type: legislation
    title: 1984 年量刑改革法
    description: 设立联邦量刑委员会，制定量刑指南（1987 年生效），废除联邦假释，限制法官的自由裁量。应得模式在立法上得到体现。
    concepts: [punishment-justification]
    works: [w-us-sra-1984]
    derivedFrom: [e-us-von-hirsch-1976]

  - id: e-uk-cja-2003
    year: 2003
    jurisdiction: uk-ew
    type: legislation
    title: 2003 年刑事司法法列举量刑目的
    description: 第 142 条要求法院在量刑时考虑惩罚犯罪人、减少犯罪（包括威慑）、改造犯罪人、保护公众、向被害人赔偿等目的，是并合主义的立法表达。
    concepts: [punishment-justification]
    works: [w-uk-cja-2003]
    derivedFrom: [e-uk-hart-1959]

  - id: e-cn-kuanyan-2010
    year: 2010
    jurisdiction: cn
    type: legislation
    title: 宽严相济刑事政策的司法意见
    description: 最高人民法院发布贯彻宽严相济刑事政策的若干意见，要求根据犯罪的具体情况，该宽则宽、当严则严、宽严相济、罚当其罪。
    concepts: [punishment-justification]
    works: [w-cn-kuanyan-2010]
    derivedFrom: [e-cn-1997]
    needsSource: true

positions:
  # ---- 罪刑法定 ----
  - theory: result-disvalue
    question: q-formal-material
    answer: material
    derivation:
      - 刑法的目的是保护法益。
      - 构成要件应以法益侵害为指导进行解释，不值得处罚的行为在构成要件阶段即可排除 → 实质解释论。
    alternatives:
      - answer: formal
        note: 也有学者在坚持结果无价值论的同时主张形式判断优先。
    needsSource: true
  - theory: result-disvalue
    question: q-interp-goal
    answer: objective
    derivation:
      - 解释应当适应社会变化与法益保护的需要，并以文义的可能范围为界限 → 客观解释论。
    needsSource: true
  - theory: classical-school
    question: q-analogy
    answer: forbid-all
    derivation:
      - 刑法是对国家刑罚权的限制，罪刑法定是古典学派的核心主张。
      - 类推损害法的安定性 → 禁止。
    needsSource: true
  - theory: modern-school
    question: q-analogy
    answer: allow
    derivation:
      - 刑法的任务是社会防卫，罪刑法定的形式约束应当缓和。
      - 为了有效对付危险的行为人，可以容许类推（牧野英一的自由法论倾向）。
    note: 李斯特本人仍然坚持罪刑法定（「刑法典是犯罪人的大宪章」），以罪刑法定约束特别预防；主张缓和罪刑法定的是部分新派学者。
    needsSource: true

  # ---- 学派之争 ----
  - theory: classical-school
    question: q-free-will
    answer: free-will
    derivation:
      - 人具有自由意志，能够选择是否犯罪。
  - theory: modern-school
    question: q-free-will
    answer: determinism
    derivation:
      - 犯罪由行为人的素质与社会环境决定（实证主义）。
  - theory: classical-school
    question: q-punish-basis
    answer: retribution
    derivation:
      - 刑罚是对自由意志所选择的不法行为的报应。
    alternatives:
      - answer: general-prevention
        note: 前期古典学派（费尔巴哈）以心理强制说的一般预防为刑罚根据。
  - theory: modern-school
    question: q-punish-basis
    answer: special-prevention
    derivation:
      - 刑罚针对行为人的危险性格。
      - 目的在于改善、威吓或隔离 → 特别预防、社会防卫。
  - theory: classical-school
    question: q-attempt-basis
    answer: objective
    derivation:
      - 刑法评价的是行为及其结果。
      - 未遂的处罚以行为在客观上具有危险为前提 → 客观说。
  - theory: modern-school
    question: q-attempt-basis
    answer: subjective
    derivation:
      - 刑法评价的是行为人的危险性格。
      - 犯意一旦确定地表现于外部，危险性格就已经显现 → 主观说。
  - theory: classical-school
    question: q-danger-standard
    answer: objective
    derivation:
      - 以客观上结果发生是否可能为准（绝对不能与相对不能的区分）。
    needsSource: true
  - theory: modern-school
    question: q-danger-standard
    answer: abstract
    derivation:
      - 以行为人所认识的事实为准，只要行为人的意思具有危险性即可；只排除迷信犯。
  - theory: classical-school
    question: q-empty-bed
    answer: impossible
    derivation:
      - 对象在客观上不存在，属于绝对不能 → 不能犯。
    needsSource: true
  - theory: modern-school
    question: q-empty-bed
    answer: attempt
    derivation:
      - 行为人以杀人的意思开枪，危险性格已经显现 → 未遂。

  # ---- 刑罚根据 ----
  - theory: retributivism
    question: q-desert-limit
    answer: ground
    derivation:
      - 刑罚之所以正当，是因为犯罪人应得。
      - 因此责任就是刑罚的根据，刑罚应与责任相均衡。
  - theory: deterrence
    question: q-desert-limit
    answer: none
    derivation:
      - 刑罚的正当性完全在于预防效果。
      - 纯粹的预防论本身推不出责任的界限，这是它受到的核心批判。
  - theory: special-prevention
    question: q-desert-limit
    answer: none
    derivation:
      - 刑罚以行为人的危险性为尺度。
    note: 李斯特以罪刑法定而非责任来约束特别预防。
  - theory: union-theory
    question: q-desert-limit
    answer: upper-limit
    derivation:
      - 预防是刑罚的目的，责任是刑罚的前提与上限。
      - 预防只能在责任的范围内发挥作用。
  - theory: deterrence
    question: q-positive-gp
    answer: negative
    derivation:
      - 刑罚通过威吓使一般人放弃犯罪（心理强制）。
  - theory: union-theory
    question: q-positive-gp
    answer: positive
    derivation:
      - 刑罚维护国民对法秩序的信赖，而这种信赖只有在刑罚与责任相称时才能实现。
    alternatives:
      - answer: negative
        note: 也有并合主义者仍以威慑理解一般预防。
  - theory: union-theory
    question: q-sentencing-structure
    answer: spielraum
    derivation:
      - 责任刑是一个幅度。
      - 法官在幅度内考虑一般预防与特别预防的需要（德国判例）。
    alternatives:
      - answer: point
        note: 点的理论认为责任刑是一个点，预防只能在其下方调整；中国大陆也有学者主张此说（待核）。
    needsSource: true
  - theory: retributivism
    question: q-sentencing-structure
    answer: point
    derivation:
      - 刑罚应当精确对应罪责。
    needsSource: true

dialogues:
  - id: dlg-cn-formal-material
    title: 形式解释论与实质解释论（陈兴良 × 张明楷）
    concept: legality
    jurisdictions: [cn]
    summary: 罪刑法定之下，构成要件的解释应当形式判断优先，还是以实质的处罚必要性为导向？
    needsSource: true
    turns:
      - id: t1
        scholar: chen-xingliang
        work: w-chen-2010
        year: 2010
        claim: 形式判断应当先于实质判断：先以文义判断行为是否该当构成要件，才能守住罪刑法定的边界；以处罚必要性为导向的实质解释有入罪化的危险。
      - id: t2
        scholar: zhang-mingkai
        work: w-zhang-2010
        year: 2010
        respondsTo: t1
        claim: 构成要件本身就是违法类型，必须以法益为指导进行实质解释；实质解释同样可以出罪，且受文义可能范围的限制，并不违反罪刑法定。

  - id: dlg-de-schulenstreit
    title: 学派之争（李斯特 × 比克迈尔）
    concept: criminal-law-schools
    jurisdictions: [de]
    summary: 刑罚针对行为还是行为人？以目的取代报应，会不会瓦解刑法的法治国界限？
    needsSource: true
    turns:
      - id: t1
        scholar: liszt
        work: w-liszt-1882
        year: 1882
        claim: 刑罚只有作为实现目的（法益保护）的手段才是正当的；应受处罚的不是行为而是行为人，刑罚应按行为人的类型分别改善、威吓或隔离。
      - id: t2
        scholar: birkmeyer
        work: w-birkmeyer-1907
        year: 1907
        respondsTo: t1
        claim: 以行为人的危险性为中心，会使刑罚失去与行为不法和责任的对应，刑法将沦为没有界限的社会防卫手段。

  - id: dlg-punishment
    title: 刑罚为什么正当（边沁 × 康德 × 哈特 × 冯·赫希）
    concept: punishment-justification
    jurisdictions: [uk-ew, de, us]
    summary: 跨越两大法系的经典论争：预防、报应，以及两者的结合。
    needsSource: true
    turns:
      - id: t1
        scholar: bentham
        work: w-bentham-1789
        year: 1789
        claim: 一切刑罚本身都是恶；只有当它能排除更大的恶时，才能被允许。
      - id: t2
        scholar: kant
        work: w-kant-1797
        year: 1797
        respondsTo: t1
        claim: 人绝不能仅仅被当作手段；刑罚只能因为犯罪而科处，其尺度是同等报应。
      - id: t3
        scholar: hart
        work: w-hart-1959
        year: 1959
        respondsTo: t2
        claim: 两者回答的是不同的问题：刑罚制度的一般目的可以是预防，但刑罚的分配必须受「只惩罚有责任者」的原则约束。
      - id: t4
        scholar: von-hirsch
        work: w-von-hirsch-1976
        year: 1976
        respondsTo: t3
        claim: 矫正理想已经失败；刑罚的轻重应当与犯罪的严重性相称，这才是公正的量刑原则。

