# 刑法基础论与刑罚论：罪刑法定原则、刑法学派之争、刑罚的正当化根据
# 起草：AI（Claude）。全部为 draft，判例引注与期号尤需核实。

concepts:
  - id: legality
    name: 罪刑法定原则
    original:
      de: Gesetzlichkeitsprinzip（nullum crimen, nulla poena sine lege）
      ja: 罪刑法定主義
      en: principle of legality
    kind: foundation
    area: foundations
    tradition: both
    summary: >-
      没有法律就没有犯罪，没有法律就没有刑罚。它派生出成文法主义（排除习惯法）、禁止事后法、禁止类推、明确性原则等要求，
      也决定了刑法解释的界限。在普通法传统中，法官造法的历史使这一原则主要以「公平告知」和「因模糊而无效」等形式出现。

  - id: criminal-law-schools
    name: 刑法学派之争（古典学派与近代学派）
    original:
      de: Schulenstreit
      ja: 新旧両派の争い
      en: classical vs. positivist school
    kind: foundation
    area: foundations
    tradition: both
    summary: >-
      十九世纪末到二十世纪上半叶的根本立场之争：刑法评价的是行为还是行为人？犯罪是自由意志的产物，还是由素质与环境决定？
      它在未遂、共犯、责任、刑罚等几乎所有问题上都推出对立的结论，至今仍以「客观主义与主观主义」的形式影响日本与中国大陆的刑法学。

  - id: punishment-justification
    name: 刑罚的正当化根据
    original:
      de: Straftheorien
      ja: 刑罰論（応報刑論・目的刑論）
      en: justification of punishment
    kind: foundation
    area: sanctions
    tradition: both
    summary: >-
      国家凭什么科处刑罚？报应论回答「因为犯了罪」，预防论回答「为了不再犯罪」，并合主义试图把两者结合起来。
      这个根据论决定了责任主义的地位、量刑的结构，也影响中止犯、法人处罚、严格责任等问题的回答。

questions:
  # ---------------- 罪刑法定 ----------------
  - id: q-legality-basis
    concept: legality
    text: 罪刑法定原则的思想基础是什么？
    level: foundation
    aliases:
      - 罪刑法定的根据
      - 罪刑法定原则的基础
      - 罪刑法定主义
      - nullum crimen sine lege
      - 法无明文规定不为罪
    answers:
      - id: liberal
        label: 自由主义（预测可能性）
        summary: 国民只有事先知道什么行为会受处罚，才能自由地安排行为；罪刑法定是对国家刑罚权的限制。
      - id: democratic
        label: 民主主义
        summary: 什么是犯罪、科处什么刑罚，必须由国民的代表机关以法律决定。
      - id: both
        label: 两者兼具

  - id: q-analogy
    concept: legality
    text: 刑法中是否允许类推？有利于被告人的类推呢？
    level: intermediate
    aliases:
      - 类推解释
      - 禁止类推
      - 有利于被告人的类推
      - 类推与扩张解释的界限
    answers:
      - id: forbid-all
        label: 一律禁止
      - id: allow-favorable
        label: 禁止不利于被告人的类推，允许有利的类推
      - id: allow
        label: 允许类推（以类推填补法律漏洞）

  - id: q-interp-goal
    concept: legality
    text: 刑法解释的目标是探求立法者的原意（主观解释），还是法律文本的客观含义（客观解释）？
    level: intermediate
    aliases:
      - 主观解释论
      - 客观解释论
      - 刑法解释的目标
      - 立法者原意
    answers:
      - id: subjective
        label: 主观解释论
      - id: objective
        label: 客观解释论

  - id: q-formal-material
    concept: legality
    text: 解释构成要件时，应以形式判断为先（形式解释论），还是以处罚必要性为导向进行实质判断（实质解释论）？
    level: intermediate
    aliases:
      - 形式解释论
      - 实质解释论
      - 形式解释与实质解释
      - 陈兴良 张明楷 解释论之争
    answers:
      - id: formal
        label: 形式解释论
        summary: 先以文义判断是否该当构成要件，形式判断是出罪的第一道防线。
      - id: material
        label: 实质解释论
        summary: 以法益保护和处罚必要性来解释构成要件，实质判断既可入罪也可出罪，但不得超出文义的可能范围。

  # ---------------- 学派之争 ----------------
  - id: q-free-will
    concept: criminal-law-schools
    text: 犯罪是自由意志的产物，还是由素质与环境决定的？
    level: foundation
    aliases:
      - 意志自由
      - 决定论
      - 非决定论
      - 犯罪原因
      - 相对的意志自由论
    answers:
      - id: free-will
        label: 意志自由论（非决定论）
      - id: determinism
        label: 决定论
      - id: soft
        label: 相对的意志自由论（软决定论）

  - id: q-school
    concept: criminal-law-schools
    text: 刑法评价的重心是行为及其结果（客观主义），还是行为人的危险性格（主观主义）？
    level: foundation
    aliases:
      - 新旧学派之争
      - 古典学派 近代学派
      - 刑法的客观主义 主观主义
      - 行为主义 行为人主义
      - 新派 旧派
      - 学派之争
    answers:
      - id: act
        label: 客观主义（行为主义）
      - id: actor
        label: 主观主义（行为人主义）
      - id: mixed
        label: 折中（以行为为基础，兼顾行为人）

  # ---------------- 刑罚根据 ----------------
  - id: q-punish-basis
    concept: punishment-justification
    text: 刑罚的正当化根据是报应，还是预防？
    level: foundation
    aliases:
      - 刑罚的目的
      - 报应刑论
      - 目的刑论
      - 一般预防 特别预防
      - 并合主义
      - 为什么要惩罚犯罪
      - retributivism
      - deterrence
    answers:
      - id: retribution
        label: 报应（绝对理论）
      - id: general-prevention
        label: 一般预防（相对理论）
      - id: special-prevention
        label: 特别预防（相对理论）
      - id: union
        label: 并合主义（综合理论）

  - id: q-positive-gp
    concept: punishment-justification
    text: 一般预防应理解为威慑（消极一般预防），还是维护国民对规范的信赖（积极一般预防）？
    level: intermediate
    aliases:
      - 积极一般预防
      - 消极一般预防
      - 威慑
      - 规范信赖
    answers:
      - id: negative
        label: 消极一般预防（威慑）
      - id: positive
        label: 积极一般预防（维护规范信赖）

  - id: q-desert-limit
    concept: punishment-justification
    text: 责任（应受谴责性）是刑罚的根据本身，还是只是刑罚的上限？
    level: intermediate
    aliases:
      - 责任主义
      - 责任与预防的关系
      - 刑罚的上限
      - 责任刑与预防刑
    answers:
      - id: ground
        label: 责任是刑罚的根据
      - id: upper-limit
        label: 责任只是刑罚的上限（预防在责任限度内运作）
      - id: none
        label: 责任不构成独立的界限

  - id: q-sentencing-structure
    concept: punishment-justification
    text: 量刑时，与责任相适应的刑罚（责任刑）是一个幅度，还是一个点？
    level: applied
    aliases:
      - 量刑的基本方法
      - 幅的理论
      - 点的理论
      - 责任刑与预防刑
      - Spielraumtheorie
      - 量刑 责任 预防
    answers:
      - id: spielraum
        label: 幅的理论（在责任刑的幅度内考虑预防）
      - id: point
        label: 点的理论（责任刑是一个点，预防只能向下调整）
      - id: integrated
        label: 综合衡量

prerequisites:
  - question: q-analogy
    requires: q-legality-basis
    kind: foundational
    why: 类推之所以被禁止，取决于罪刑法定要保护的是什么。
    branches:
      - answer: liberal
        leadsTo: 不利于被告人的类推破坏国民的预测可能性，应当禁止；有利于被告人的类推不损害自由 → 允许有利的类推。
      - answer: democratic
        leadsTo: 类推意味着法官代替立法者创设犯罪 → 禁止不利的类推；有利的类推是否也侵犯立法权，存在争论。
      - answer: both
        leadsTo: 禁止不利于被告人的类推，有利的类推原则上允许。

  - question: q-interp-goal
    requires: q-legality-basis
    kind: foundational
    why: 解释应当忠于谁，取决于罪刑法定的正当性来自哪里。
    branches:
      - answer: democratic
        leadsTo: 尊重立法者的决定 → 倾向主观解释。
      - answer: liberal
        leadsTo: 国民只能根据文本来预测，文本的客观含义才是界限 → 倾向客观解释（受文义可能范围限制）。

  - question: q-formal-material
    requires: q-legality-basis
    kind: foundational
    why: 形式解释论把文义作为保障自由的第一道防线，实质解释论则认为实质判断同样可以保障自由；两者都以罪刑法定为出发点。
    branches:
      - answer: liberal
        leadsTo: 两说都主张保障预测可能性，分歧在于形式判断是否必须先行。
      - answer: democratic
        leadsTo: 尊重立法文本 → 倾向形式解释论。

  - question: q-formal-material
    requires: q-task
    kind: foundational
    why: 实质解释论以法益保护目的指导构成要件的解释。
    branches:
      - answer: rechtsgut
        leadsTo: 以法益侵害及其程度判断是否值得处罚 → 实质解释论的基础。
      - answer: ethic
        leadsTo: 以社会伦理充实构成要件，容易导致处罚扩大，形式解释论对此保持警惕。

  - question: q-school
    requires: q-free-will
    kind: foundational
    why: 学派之争的出发点是对犯罪原因的不同理解。
    branches:
      - answer: free-will
        leadsTo: 犯罪是自由选择的结果，可以对行为予以非难 → 客观主义（行为主义）。
      - answer: determinism
        leadsTo: 犯罪由素质与环境决定，非难行为没有意义，刑法应当针对行为人的危险性 → 主观主义（行为人主义）。
      - answer: soft
        leadsTo: 以行为为基础，同时考虑行为人的人格 → 折中（如人格责任论）。

  - question: q-punish-basis
    requires: q-free-will
    kind: foundational
    why: 只有能自由选择的人才「应得」报应；如果犯罪是被决定的，刑罚只能着眼于未来。
    branches:
      - answer: free-will
        leadsTo: 犯罪人自由地选择了不法，应得刑罚 → 报应。
      - answer: determinism
        leadsTo: 刑罚只能作为预防未来犯罪的手段 → 预防（尤其是特别预防）。
      - answer: soft
        leadsTo: 以应得为界限，在其范围内追求预防 → 并合主义。

  - question: q-punish-basis
    requires: q-school
    kind: foundational
    why: 刑罚针对的是行为还是行为人，决定了刑罚以什么为尺度。
    branches:
      - answer: act
        leadsTo: 刑罚与行为的不法和责任相均衡 → 报应（后期古典学派）或一般预防（前期古典学派）。
      - answer: actor
        leadsTo: 刑罚针对行为人的危险性 → 特别预防、社会防卫。
      - answer: mixed
        leadsTo: 并合主义。

  - question: q-positive-gp
    requires: q-punish-basis
    kind: logical
    why: 只有承认一般预防，才需要追问它是威慑还是规范信赖的维护。
    branches:
      - answer: general-prevention
        leadsTo: 进入内部之争：费尔巴哈、边沁式的威慑，还是雅科布斯式的规范信赖维护。
      - answer: union
        leadsTo: 并合主义多以积极一般预防来说明为什么刑罚不能超过责任。
      - answer: retribution
        leadsTo: 不必讨论；但有学者指出，黑格尔的「否定之否定」与积极一般预防在结构上相近。
      - answer: special-prevention
        leadsTo: 不必讨论。

  - question: q-desert-limit
    requires: q-punish-basis
    kind: logical
    why: 责任在刑罚中扮演什么角色，取决于刑罚为什么正当。
    branches:
      - answer: retribution
        leadsTo: 责任就是刑罚的根据，刑罚与责任相均衡。
      - answer: union
        leadsTo: 责任是刑罚的前提与上限，预防只能在责任的范围内发挥作用。
      - answer: general-prevention
        leadsTo: 纯粹的预防论难以从自身推出责任的界限，这正是它受到的主要批判（「为预防而惩罚无辜」）。
      - answer: special-prevention
        leadsTo: 以行为人的危险性为准，责任不构成独立的界限（李斯特以罪刑法定而非责任来约束特别预防）。

  - question: q-sentencing-structure
    requires: q-desert-limit
    kind: logical
    why: 量刑结构是「责任与预防的关系」在个案中的落实。
    branches:
      - answer: upper-limit
        leadsTo: 责任刑可以是一个幅度，在幅度内考虑预防（幅的理论），也可以是一个点，预防只能向下调整（点的理论）。
      - answer: ground
        leadsTo: 刑罚应当精确对应责任 → 倾向点的理论。
      - answer: none
        leadsTo: 综合衡量各种预防需要。

relations:
  - from: legality
    to: harm-principle
    type: derived_from
    description: 两者都是自由主义刑法思想的产物：罪刑法定限制的是「如何」处罚，伤害原则限制的是「处罚什么」。
  - from: punishment-justification
    to: criminal-law-schools
    type: derived_from
    description: 报应与预防的对立在学派之争中被推到极致：后期古典学派坚持报应，近代学派主张特别预防。

