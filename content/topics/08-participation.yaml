# 共犯论：正犯与共犯的区分（犯罪支配说、共谋共同正犯、犯罪共同说与行为共同说）；教唆未遂
# 起草：AI（Claude）。全部为 draft；中国大陆单一正犯体系之争的文献尤需核实。

concepts:
  - id: perpetration
    name: 正犯与共犯的区分
    original:
      de: Täterschaft und Teilnahme（Tatherrschaftslehre）
      ja: 正犯と共犯の区別
      en: principals and accessories
    kind: problem
    area: participation
    tradition: both
    summary: >-
      谁是正犯，谁只是教唆犯或帮助犯：形式客观说、主观说（浴缸案、斯塔辛斯基案）、犯罪支配说，还是重要作用说？
      应当区分正犯与共犯（区分制），还是一律作为正犯处理（单一正犯体系）？「共同」犯罪的本质是共同实施特定犯罪，还是共同实施行为？
      日本以共谋共同正犯扩张正犯的范围，中国大陆以作用为标准区分主犯与从犯；英美法则把帮助、教唆者作为正犯审判，并围绕「共同犯罪计划」反复调整。

questions:
  - id: q-perpetrator-concept
    concept: perpetration
    text: 应当区分正犯与共犯（区分制），还是采单一正犯体系？
    level: intermediate
    aliases:
      - 单一正犯体系
      - 区分制
      - 限制的正犯概念
      - 扩张的正犯概念
      - 主犯从犯与正犯共犯
      - 共同犯罪的体系
    answers:
      - id: differentiated
        label: 区分制（限制的正犯概念）
      - id: unitary
        label: 单一正犯体系（扩张的正犯概念）

  - id: q-perpetrator-criterion
    concept: perpetration
    text: 区分正犯与共犯的标准是什么？
    level: intermediate
    aliases:
      - 正犯与共犯的区分
      - 如何区分正犯与共犯
      - 犯罪支配说
      - 行为支配说
      - 正犯的标准
      - 间接正犯
      - 共同正犯的认定
      - 浴缸案
      - 斯塔辛斯基案
      - Tatherrschaft
    answers:
      - id: formal
        label: 形式客观说（是否亲自实施构成要件行为）
      - id: subjective
        label: 主观说（以正犯意思行为的是正犯）
      - id: tatherrschaft
        label: 犯罪支配说（行为支配说）
      - id: important-role
        label: 重要作用说（实质客观说）

  - id: q-conspiracy-coprincipal
    concept: perpetration
    text: 只参与共谋而没有参与实行的人，能否成立共同正犯（共谋共同正犯）？
    level: applied
    aliases:
      - 共谋共同正犯
      - 练马事件
      - 只共谋不实行
      - 幕后主使 共同正犯
      - 黑社会头目 共同正犯
      - 共同意思主体说
    answers:
      - id: "yes"
        label: 可以
      - id: "no"
        label: 不可以（只能成立教唆犯或帮助犯）
      - id: yes-if-dominant
        label: 在共谋者具有支配性或重要作用时可以

  - id: q-joint-nature
    concept: perpetration
    text: 共同犯罪的「共同」，是指共同实施特定的犯罪（犯罪共同说），还是共同实施行为（行为共同说）？
    level: intermediate
    aliases:
      - 犯罪共同说
      - 行为共同说
      - 部分犯罪共同说
      - 共同犯罪的本质
      - 甲以伤害故意乙以杀人故意
    answers:
      - id: crime-joint
        label: 犯罪共同说（含部分犯罪共同说）
      - id: act-joint
        label: 行为共同说

  - id: q-cl-joint-enterprise
    concept: perpetration
    text: 共犯对正犯超出共同计划的犯罪承担责任，只需预见即可，还是需要意图帮助或鼓励？
    level: applied
    aliases:
      - joint enterprise
      - 共同犯罪计划
      - Jogee
      - Chan Wing-Siu
      - parasitic accessorial liability
      - 附随犯罪
    answers:
      - id: foresight
        label: 预见即可（Chan Wing-Siu）
      - id: intention
        label: 需要意图帮助或鼓励（Jogee）

  - id: q-instigation-attempt
    concept: complicity-basis
    text: 被教唆者没有实施被教唆的犯罪（教唆未遂）时，教唆者是否可罚？
    level: applied
    aliases:
      - 教唆未遂
      - 未遂的教唆
      - 刑法第29条第2款
      - 被教唆的人没有犯被教唆的罪
      - 共犯独立性说
      - 实行从属性
    answers:
      - id: not-punishable
        label: 不可罚（实行从属性）
      - id: punishable
        label: 可罚（共犯独立性说）

prerequisites:
  - question: q-perpetrator-concept
    requires: q-school
    kind: foundational
    why: 是否区分正犯与共犯，取决于刑法评价的是构成要件行为，还是每个参与者自身的危险性。
    branches:
      - answer: act
        leadsTo: 构成要件描述的是正犯行为，共犯只是从属地扩张处罚 → 区分制（限制的正犯概念）。
      - answer: actor
        leadsTo: 每个对结果有贡献的人都表现了危险性 → 扩张的正犯概念乃至单一正犯体系。
      - answer: mixed
        leadsTo: 区分制，但以实质的标准认定正犯。

  - question: q-comp-basis
    requires: q-perpetrator-concept
    kind: logical
    why: 只有在区分正犯与共犯的体系中，才需要追问共犯为什么、在什么条件下受处罚。
    branches:
      - answer: differentiated
        leadsTo: 共犯是对正犯的从属性参与，需要说明其处罚根据。
      - answer: unitary
        leadsTo: 所有参与者都是正犯，各自依其贡献负责，共犯处罚根据的问题在很大程度上被消解。

  - question: q-perpetrator-criterion
    requires: q-perpetrator-concept
    kind: logical
    why: 只有采区分制，才需要区分的标准。
    branches:
      - answer: differentiated
        leadsTo: 进入标准之争。
      - answer: unitary
        leadsTo: 不需要区分（量刑上仍需考虑参与的程度）。

  - question: q-perpetrator-criterion
    requires: q-causation-test
    kind: logical
    why: 如果一切条件在因果上都是等价的，就无法从客观上区分正犯与共犯。
    branches:
      - answer: conditio
        leadsTo: 正犯与共犯在因果上没有区别 → 只能以主观意思区分（冯·布里、帝国法院）→ 主观说。
      - answer: imputation
        leadsTo: 以规范的观点区分对事件进程的支配 → 犯罪支配说。
      - answer: adequacy
        leadsTo: 相当性本身不提供区分标准，需要另外的实质标准。
      - answer: realization
        leadsTo: 以谁的行为危险在结果中现实化、谁对结果起了重要作用为线索 → 重要作用说。

  - question: q-conspiracy-coprincipal
    requires: q-perpetrator-criterion
    kind: logical
    why: 只共谋者能否是正犯，完全取决于正犯的标准。
    branches:
      - answer: formal
        leadsTo: 没有亲自实施构成要件行为 → 不能成立正犯。
      - answer: subjective
        leadsTo: 只要以正犯的意思参与 → 可以。
      - answer: tatherrschaft
        leadsTo: 共谋者若通过分工对事件具有功能的支配 → 可以；单纯的共谋不够。
      - answer: important-role
        leadsTo: 共谋者在犯罪中起了重要作用 → 可以（日本学说的主流）。

  - question: q-joint-nature
    requires: q-school
    kind: foundational
    why: 犯罪共同说与行为共同说的对立，起源于新旧学派之争。
    branches:
      - answer: act
        leadsTo: 共同的对象是特定的犯罪（构成要件）→ 犯罪共同说。
      - answer: actor
        leadsTo: 各人通过共同的行为实现各自的犯罪 → 行为共同说（牧野英一）。
      - answer: mixed
        leadsTo: 部分犯罪共同说。

  - question: q-joint-nature
    requires: q-comp-basis
    kind: logical
    why: 当代的行为共同说以因果共犯论为基础重新获得支持。
    branches:
      - answer: causation
        leadsTo: 各共犯通过共同的行为各自引起法益侵害，罪名可以不同 → 行为共同说（平野、西田、山口、张明楷）。
      - answer: unrecht
        leadsTo: 共犯从属于正犯的违法行为 → 倾向犯罪共同说。
      - answer: schuld
        leadsTo: 犯罪共同说。

  - question: q-cl-joint-enterprise
    requires: q-cl-basis
    kind: foundational
    why: 共犯对附随犯罪的责任，取决于以共犯本人的心态还是以外在的共同计划为准。
    branches:
      - answer: subjectivism
        leadsTo: 共犯的责任应以其本人的可责心态为准 → 至少需要意图帮助或鼓励（Jogee）。
      - answer: objectivism
        leadsTo: 参与共同的犯罪计划本身就是外在的不法，可以较宽地归责 → 预见即可（Chan Wing-Siu）。

  - question: q-instigation-attempt
    requires: q-comp-basis
    kind: logical
    why: 被教唆者没有实行时，教唆者是否已经值得处罚，取决于共犯为什么受处罚。
    branches:
      - answer: causation
        leadsTo: 没有正犯的实行，就没有法益侵害或其危险的惹起 → 不可罚。
      - answer: unrecht
        leadsTo: 没有正犯的违法行为 → 不可罚。
      - answer: schuld
        leadsTo: 没有使正犯堕落到实施犯罪 → 不可罚。

  - question: q-instigation-attempt
    requires: q-school
    kind: foundational
    why: 共犯独立性说是近代学派的标志性主张之一。
    branches:
      - answer: act
        leadsTo: 共犯的处罚以正犯着手实行为前提 → 实行从属性，不可罚。
      - answer: actor
        leadsTo: 教唆行为本身就表现了行为人的危险性格 → 共犯独立性说，可罚。
      - answer: mixed
        leadsTo: 原则上不可罚，对重罪可以例外地处罚（德国刑法第 30 条）。

