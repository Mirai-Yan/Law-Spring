    title: 卡迪什：共犯的派生责任
    description: 正犯的行为是其自由意志的产物，不能被理解为共犯「引起」的结果；共犯的责任因此是从正犯派生出来的。这是英美法上对「共犯处罚根据」的代表性回答。
