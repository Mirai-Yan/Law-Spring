# 英格兰与威尔士、美国：学者、文献、演化事件
# 起草：AI（Claude）。判例引注、论文卷期需核实。

scholars:
  # ---------------- 英格兰与威尔士 ----------------
  - id: mill
    name: 密尔
    nameOriginal: John Stuart Mill
    jurisdiction: uk-ew
    born: 1806
    died: 1873
    bio: 哲学家。《论自由》提出伤害原则：对文明社会的任何成员违背其意志而正当行使权力的唯一目的，是防止对他人的伤害。
  - id: devlin
    name: 德夫林
    nameOriginal: Patrick Devlin (Lord Devlin)
    jurisdiction: uk-ew
    born: 1905
    died: 1992
    bio: 法官。主张社会有权以刑法维护其共享的道德（法律道德主义）。
  - id: hart
    name: 哈特
    nameOriginal: H. L. A. Hart
    jurisdiction: uk-ew
    born: 1907
    died: 1992
    affiliations: [牛津大学]
    influencedBy: [mill]
    bio: 法哲学家。在与德夫林的论战中为伤害原则辩护。
  - id: glanville-williams
    name: 格兰维尔·威廉姆斯
    nameOriginal: Glanville Williams
    jurisdiction: uk-ew
    born: 1911
    died: 1997
    affiliations: [剑桥大学]
    bio: 英国刑法学主观主义的代表人物。
  - id: jc-smith
    name: J. C. 史密斯
    nameOriginal: Sir John Cyril Smith
    jurisdiction: uk-ew
    born: 1922
    died: 2003
    affiliations: [诺丁汉大学]
    bio: 与 Hogan 合著的刑法教科书长期是英国的标准教科书；持主观主义立场。
  - id: ashworth
    name: 阿什沃斯
    nameOriginal: Andrew Ashworth
    jurisdiction: uk-ew
    born: 1947
    affiliations: [牛津大学]
    bio: 主观主义的当代代表，主张结果是运气，不应影响刑事责任。
  - id: duff
    name: 达夫
    nameOriginal: R. A. Duff
    jurisdiction: uk-ew
    born: 1945
    affiliations: [斯特灵大学]
    bio: 刑法哲学家，在未遂论上主张一种客观主义，强调行为与世界的「接触」。
  - id: gardner
    name: 加德纳
    nameOriginal: John Gardner
    jurisdiction: uk-ew
    born: 1965
    died: 2019
    affiliations: [牛津大学]
    teachers: [hart]
    bio: 法哲学家，从实践理性的角度论证正当化须基于正当化理由而行动。
    needsSource: true
    editorNote: 师承关系待核。

  # ---------------- 美国 ----------------
  - id: holmes
    name: 霍姆斯
    nameOriginal: Oliver Wendell Holmes Jr.
    jurisdiction: us
    born: 1841
    died: 1935
    bio: 《普通法》主张刑事责任应以「外部标准」衡量，而不取决于行为人实际的可责心态。
  - id: wechsler
    name: 韦克斯勒
    nameOriginal: Herbert Wechsler
    jurisdiction: us
    born: 1909
    died: 2000
    affiliations: [哥伦比亚大学]
    bio: 《模范刑法典》的首席起草人（Chief Reporter）。
  - id: fletcher
    name: 弗莱彻
    nameOriginal: George P. Fletcher
    jurisdiction: us
    born: 1939
    affiliations: [哥伦比亚大学]
    influencedBy: [welzel]
    bio: 把德国刑法学系统引入美国刑法理论；《反思刑法》区分「显现的犯罪性」与「主观的犯罪性」等模式。
    needsSource: true
  - id: robinson
    name: 罗宾逊
    nameOriginal: Paul H. Robinson
    jurisdiction: us
    born: 1948
    affiliations: [宾夕法尼亚大学]
    bio: 1975 年提出正当化的「行为说」（deeds theory）：正当化取决于客观上有无社会危害。
  - id: feinberg
    name: 范伯格
    nameOriginal: Joel Feinberg
    jurisdiction: us
    born: 1926
    died: 2004
    influencedBy: [mill, hart]
    bio: 四卷本《刑法的道德界限》系统发展了伤害原则与冒犯原则。
  - id: kadish
    name: 卡迪什
    nameOriginal: Sanford H. Kadish
    jurisdiction: us
    born: 1921
    died: 2014
    affiliations: [加州大学伯克利分校]
    bio: 以「派生责任」说明共犯：共犯的责任来自正犯基于自由意志实施的行为。
  - id: moore
    name: 摩尔
    nameOriginal: Michael S. Moore
    jurisdiction: us
    born: 1943
    bio: 报应主义者，主张实际造成的结果具有独立的道德意义。
  - id: alexander
    name: 亚历山大
    nameOriginal: Larry Alexander
    jurisdiction: us
    affiliations: [圣地亚哥大学]
    bio: 与 Ferzan 合著《犯罪与可责性》，主张刑事责任只取决于可责的选择，结果完全无关。
  - id: ferzan
    name: 费尔赞
    nameOriginal: Kimberly Kessler Ferzan
    jurisdiction: us
    bio: 与 Alexander 合著《犯罪与可责性》。

