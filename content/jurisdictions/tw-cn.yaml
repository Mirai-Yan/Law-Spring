events:
  # ---------------- 台湾地区 ----------------
  - id: e-tw-1935
    year: 1935
    jurisdiction: tw
    type: legislation
    title: 1935 年刑法公布
    description: 现行刑法的前身公布施行，体系上参照德、日的立法与学说。这部法典后来在台湾地区施行，德日刑法学也由此成为台湾刑法学的主要来源。其第 1 条规定罪刑法定。
    concepts: [wrongfulness-essence, legality]
    works: [w-tw-1935]
    derivedFrom: [e-de-beling-1906]
    needsSource: true

  - id: e-tw-hsu-1997
    year: 1997
    jurisdiction: tw
    type: reception
    title: 许玉秀：主观与客观之间
    description: 系统介绍并检讨德国的主观不法理论与客观归责理论，追问不法判断中主观与客观要素的关系。
    concepts: [subjective-unrecht, wrongfulness-essence]
    scholars: [hsu-yuhsiu]
    works: [w-hsu-1997]
    derivedFrom: [e-de-roxin-1970, e-de-welzel-1939]
    needsSource: true

  # ---------------- 中国大陆 ----------------
  - id: e-cn-soviet-1958
    year: 1958
    jurisdiction: cn
    type: reception
    title: 继受苏俄犯罪构成理论与社会危害性理论
    description: 1950 年代，苏联刑法学（如特拉伊宁的犯罪构成学说）被系统翻译引入。犯罪构成四要件与「社会危害性」成为此后数十年的通说框架；在这一框架中，违法性并不是独立的评价阶层。
    concepts: [wrongfulness-essence, crime-system]
    works: [w-trainin-1958]
    needsSource: true

  - id: e-cn-1979
    year: 1979
    jurisdiction: cn
    type: legislation
    title: 1979 年刑法
    description: >-
      第一部刑法典以社会危害性界定犯罪概念，并允许类推定罪（须报最高人民法院核准）。
      总则还规定了：故意是「明知」并「希望或者放任」结果发生；紧急避险；醉酒的人犯罪应当负刑事责任；
      未遂以「已经着手实行」为前提；中止犯应当免除或者减轻处罚；以作用为标准把共同犯罪人分为主犯、从犯、胁从犯与教唆犯；
      「被教唆的人没有犯被教唆的罪」时，对教唆犯可以从轻或者减轻处罚。
    concepts: [wrongfulness-essence, legality, intent, necessity, alic, commencement, withdrawal, perpetration, complicity-basis]
    works: [w-cn-1979]
    derivedFrom: [e-cn-soviet-1958]

  - id: e-cn-1997
    year: 1997
    jurisdiction: cn
    type: legislation
    title: 1997 年刑法修订
    description: >-
      明文规定罪刑法定原则（第 3 条）并废除类推；增设特殊防卫（第 20 条第 3 款）；
      以「不能辨认或者不能控制自己行为」规定精神病人的刑事责任（第 18 条）；规定不可抗力与意外事件不是犯罪（第 16 条）；
      在总则中系统规定单位犯罪及双罚制（第 30、31 条）。以形式的犯罪定义约束实质的社会危害性判断，成为此后学说转型的背景。
    concepts: [wrongfulness-essence, legality, self-defense, necessity, insanity, strict-liability, corporate-liability]
    works: [w-cn-1997]
    derivedFrom: [e-cn-1979]

  - id: e-cn-zhang-2000
    year: 2000
    jurisdiction: cn
    type: reception
    title: 张明楷《法益初论》
    description: 以法益概念取代社会危害性，作为犯罪本质与违法实质的说明，结果无价值论由此进入中国大陆。
    concepts: [rechtsgut, wrongfulness-essence]
    scholars: [zhang-mingkai]
    works: [w-zhang-2000]
    derivedFrom: [e-jp-hirano-1972, e-cn-1997]

  - id: e-cn-zhang-2002
    year: 2002
    jurisdiction: cn
    type: development
    title: 张明楷《刑法的基本立场》
    description: 明确提出刑法的基本立场应是客观主义与结果无价值论，并据此检讨一系列具体问题。
    concepts: [wrongfulness-essence, criminal-law-schools]
    scholars: [zhang-mingkai]
    works: [w-zhang-2002]
    derivedFrom: [e-cn-zhang-2000]

  - id: e-cn-chen-2006
    year: 2006
    jurisdiction: cn
    type: turn
    title: 刑法知识的「去苏俄化」
    description: 陈兴良主张清理苏俄刑法学的知识遗产，转向德日阶层式犯罪论体系。违法性作为独立阶层的地位由此在学界获得广泛讨论。
    concepts: [wrongfulness-essence, crime-system]
    scholars: [chen-xingliang]
    works: [w-chen-2006]
    derivedFrom: [e-cn-soviet-1958]
    needsSource: true

  - id: e-cn-zhou-2008
    year: 2008
    jurisdiction: cn
    type: critique
    title: 周光权提倡行为无价值论
    description: 违法判断不能只看结果；行为人对行为规范的违反同样是不法的核心，在中国语境中更应重视行为规范的指引功能。
    concepts: [wrongfulness-essence]
    scholars: [zhou-guangquan]
    works: [w-zhou-2008]
    derivedFrom: [e-cn-zhang-2002, e-jp-ida-2005]
    needsSource: true

  - id: e-cn-zhang-2009
    year: 2009
    jurisdiction: cn
    type: critique
    title: 张明楷质疑行为无价值论
    description: 行为无价值论会导致处罚范围扩大与刑法的伦理化，并在具体问题上得出不协调的结论。
    concepts: [wrongfulness-essence]
    scholars: [zhang-mingkai]
    works: [w-zhang-2009]
    derivedFrom: [e-cn-zhou-2008]
    needsSource: true

  - id: e-cn-zhou-2012
    year: 2012
    jurisdiction: cn
    type: development
    title: 新行为无价值论
    description: 以法益保护为前提，行为规范服务于法益保护，以此回应「刑法伦理化」的批评。
    concepts: [wrongfulness-essence]
    scholars: [zhou-guangquan]
    works: [w-zhou-2012]
    derivedFrom: [e-cn-zhang-2009]
    needsSource: true

  - id: e-cn-zhang-2012
    year: 2012
    jurisdiction: cn
    type: development
    title: 张明楷《行为无价值论与结果无价值论》
    description: 系统比较两种立场在各个具体问题上的结论，坚持结果无价值论。
    concepts: [wrongfulness-essence]
    scholars: [zhang-mingkai]
    works: [w-zhang-2012]
    derivedFrom: [e-cn-zhang-2009]
