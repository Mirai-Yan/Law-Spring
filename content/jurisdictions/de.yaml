# 德国：学者、文献、演化事件
# 起草：AI（Claude）。年份、卷期、师承关系均需逐条核实；没有把握的条目已标 needsSource。

scholars:
  - id: feuerbach
    name: 费尔巴哈
    nameOriginal: Paul Johann Anselm von Feuerbach
    jurisdiction: de
    born: 1775
    died: 1833
    bio: 近代刑法学之父，心理强制说与罪刑法定原则的提出者；主张未遂的处罚以行为在客观上的危险为前提。
  - id: hegel
    name: 黑格尔
    nameOriginal: Georg Wilhelm Friedrich Hegel
    jurisdiction: de
    born: 1770
    died: 1831
    bio: 哲学家。《法哲学原理》区分无犯意的不法、诈欺与犯罪，常被视为不法论的思想前史。
  - id: birnbaum
    name: 比恩鲍姆
    nameOriginal: Johann Michael Franz Birnbaum
    jurisdiction: de
    born: 1792
    died: 1877
    bio: 1834 年提出犯罪的本质是对「财」（Gut）的侵害而非对权利的侵害，被视为法益概念的源头。
    needsSource: true
  - id: jhering
    name: 耶林
    nameOriginal: Rudolf von Jhering
    jurisdiction: de
    born: 1818
    died: 1892
    bio: 民法学者。1867 年区分「客观的不法」与「主观的责任」，被视为客观违法论的源头。
  - id: merkel-adolf
    name: 阿道夫·默克尔
    nameOriginal: Adolf Merkel
    jurisdiction: de
    born: 1836
    died: 1896
    bio: 主观违法论（命令说）的代表：法是命令，只有能够理解命令的人才能违反它。
    needsSource: true
  - id: binding
    name: 宾丁
    nameOriginal: Karl Binding
    jurisdiction: de
    born: 1841
    died: 1920
    bio: 规范论（Normentheorie）的奠基者：犯罪人违反的不是刑法条文，而是条文背后的行为规范。也是「法益」这一术语的推广者。
  - id: liszt
    name: 李斯特
    nameOriginal: Franz von Liszt
    jurisdiction: de
    born: 1851
    died: 1919
    bio: 现代学派代表。区分形式违法与实质违法，把实质违法理解为对法益（法所保护的利益）的侵害。
  - id: beling
    name: 贝林
    nameOriginal: Ernst von Beling
    jurisdiction: de
    born: 1866
    died: 1932
    bio: 1906 年《犯罪论》确立构成要件理论：构成要件是客观的、记述的、价值中立的。
  - id: mayer-me
    name: 迈耶
    nameOriginal: Max Ernst Mayer
    jurisdiction: de
    born: 1875
    died: 1923
    bio: 文化规范论的提出者；主观违法要素的发现者之一。
  - id: hegler
    name: 黑格勒
    nameOriginal: August Hegler
    jurisdiction: de
    bio: 1915 年《犯罪的要素》较早系统地提出主观的违法要素。
    needsSource: true
  - id: mezger
    name: 梅茨格
    nameOriginal: Edmund Mezger
    jurisdiction: de
    born: 1883
    died: 1962
    bio: 新古典犯罪论体系的代表；以评价规范与决定规范的区分说明客观违法论，并系统化了主观违法要素。
  - id: engisch
    name: 恩吉施
    nameOriginal: Karl Engisch
    jurisdiction: de
    born: 1899
    died: 1990
    bio: 1930 年的故意与过失研究提出「外在的注意」，为过失犯的客观注意义务理论奠定了基础。
  - id: welzel
    name: 韦尔策尔
    nameOriginal: Hans Welzel
    jurisdiction: de
    born: 1904
    died: 1977
    affiliations: [哥廷根大学, 波恩大学]
    bio: 目的行为论与人的不法论的创立者。主张故意是行为的核心、属于不法；提出社会相当性理论。
  - id: henkel
    name: 亨克尔
    nameOriginal: Heinrich Henkel
    jurisdiction: de
    born: 1903
    died: 1981
    bio: 刑法与法哲学学者，Roxin 的老师。
    needsSource: true
  - id: gallas
    name: 加拉斯
    nameOriginal: Wilhelm Gallas
    jurisdiction: de
    born: 1903
    died: 1989
    bio: 二元的人的不法论的代表之一，批判一元论。
  - id: armin-kaufmann
    name: 阿明·考夫曼
    nameOriginal: Armin Kaufmann
    jurisdiction: de
    born: 1922
    died: 1985
    teachers: [welzel]
    bio: 目的行为论学派的核心人物，以规范论为基础发展出一元的人的不法论。
    needsSource: true
  - id: hirsch
    name: 希尔施
    nameOriginal: Hans Joachim Hirsch
    jurisdiction: de
    born: 1929
    died: 2011
    teachers: [welzel]
    bio: 目的行为论学派的代表学者之一。
    needsSource: true
  - id: zielinski
    name: 齐林斯基
    nameOriginal: Diethart Zielinski
    jurisdiction: de
    teachers: [armin-kaufmann]
    bio: 1973 年《不法概念中的行为无价值与结果无价值》系统提出一元的人的不法论：结果只是客观处罚条件。
    needsSource: true
  - id: jescheck
    name: 耶塞克
    nameOriginal: Hans-Heinrich Jescheck
    jurisdiction: de
    born: 1915
    died: 2009
    bio: 马普外国与国际刑法研究所所长；其总论教科书是二元论通说的代表性表述。
  - id: roxin
    name: 罗克辛
    nameOriginal: Claus Roxin
    jurisdiction: de
    born: 1931
    teachers: [henkel]
    bio: 目的理性（功能性）刑法体系的创立者；强调刑法的任务是辅助性的法益保护，主张批判立法的法益概念。
    needsSource: true
    editorNote: 师承关系待核。
  - id: jakobs
    name: 雅科布斯
    nameOriginal: Günther Jakobs
    jurisdiction: de
    born: 1937
    teachers: [welzel]
    bio: 功能主义规范论：刑法保护的是规范的效力，犯罪是对规范效力的否认。
    needsSource: true
  - id: luederssen
    name: 吕德森
    nameOriginal: Klaus Lüderssen
    jurisdiction: de
    born: 1932
    died: 2016
    bio: 1967 年《共犯的处罚根据》提出纯粹惹起说。
    needsSource: true

