    nameOriginal: 平野龍一
    jurisdiction: jp
    born: 1920
    died: 2004
    affiliations: [东京大学]
    teachers: [ono-seiichiro]
    bio: 日本结果无价值论的奠基者。批判以道义充实违法的立场，主张违法的实质是法益侵害或危险；在过失犯上主张修正的旧过失论。曾任东京大学校长。
    needsSource: true
    editorNote: 师承关系待核。
  - id: fujiki
    name: 藤木英雄
    nameOriginal: 藤木英雄
