    jurisdiction: jp
    born: 1913
    died: 2012
    affiliations: [东京大学, 最高裁判所]
    teachers: [ono-seiichiro]
    bio: 战后日本刑法学的代表人物之一，定型说与人格责任论的提出者；违法论上持行为无价值论。曾任最高裁判所裁判官。
