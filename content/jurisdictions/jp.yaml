events:
  - id: e-jp-ono-1953
    year: 1953
    jurisdiction: jp
    type: reception
    title: 小野清一郎系统继受构成要件论
    description: 小野清一郎继受贝林与 M. E. 迈耶的构成要件论，同时以「违反国家的道义（文化规范）」理解违法的实质。日本的违法论从一开始就带有伦理色彩。在体系上，小野把构成要件理解为违法有责类型。
    concepts: [wrongfulness-essence, crime-system]
    scholars: [ono-seiichiro]
    works: [w-ono-1953]
    derivedFrom: [e-de-beling-1906, e-de-subj-unrecht-1915]
    needsSource: true
    editorNote: 该书收录的论文发表于 1920 至 1950 年代，本事件以成书年份标注。

  - id: e-jp-fukuda-finalism
    year: 1955
    circa: true
    jurisdiction: jp
    type: reception
    title: 目的行为论传入日本
    description: 福田平等学者继受韦尔策尔的目的行为论与人的不法论，使故意属于不法的观点在日本获得有力支持。
    concepts: [wrongfulness-essence, subjective-unrecht]
    scholars: [fukuda]
    derivedFrom: [e-de-welzel-1939]
    needsSource: true
    editorNote: 年份为编者估计。

  - id: e-jp-dando-1957
    year: 1957
    jurisdiction: jp
    type: development
    title: 团藤重光《刑法纲要总论》
    description: 违法是对法秩序（含社会伦理规范）的违反；行为无价值处于违法判断的中心。这是战后行为无价值论的代表性表述。团藤同时主张人格行为论与人格责任论。
    concepts: [wrongfulness-essence, action-theory, culpability-essence]
    scholars: [dando]
    works: [w-dando-1957]
    derivedFrom: [e-jp-ono-1953]

  - id: e-jp-fujiki-1969
    year: 1969
    jurisdiction: jp
    type: reception
    title: 新过失论在日本确立
    description: 藤木英雄等人把过失的核心理解为违反结果回避义务，过失由此也成为不法的问题。
    concepts: [negligence-structure]
    scholars: [fujiki]
    works: [w-fujiki-1969]
    derivedFrom: [e-de-engisch-1930, e-de-welzel-1939]
    needsSource: true

  - id: e-jp-saibansho-1971
    year: 1971
    jurisdiction: jp
    type: case
    title: 最高裁判所：激愤中的反击不当然欠缺防卫意思
    description: 最高裁判所以正当防卫须有防卫意思为前提，但认为因激愤或冲动而反击并不当然欠缺防卫意思。判例由此采防卫意思必要说，并对其内容作宽松理解。
    concepts: [accidental-defense]
    works: [w-saibansho-1971]
    derivedFrom: [e-de-subj-justification]
    needsSource: true

  - id: e-jp-hirano-1972
    year: 1972
    jurisdiction: jp
    type: turn
    title: 平野龙一：结果无价值论
    description: 平野龙一批判以道义充实违法的立场，认为刑法不应维护伦理本身；违法的实质是法益侵害或危险，故意原则上属于责任。日本的违法论由此出现方向性的转变，过失论上也出现了修正的旧过失论。在故意论上，平野以动机说区分未必故意与有认识的过失；在事实错误上采具体符合说。
    concepts: [wrongfulness-essence, negligence-structure, subjective-unrecht, rechtsgut, intent, mistake-of-fact]
    scholars: [hirano]
    works: [w-hirano-1972, w-hirano-1975]
    derivedFrom: [e-jp-dando-1957, e-de-liszt-1881]
    needsSource: true

  - id: e-jp-morinaga-1973
    year: 1973
    jurisdiction: jp
    type: case
    title: 森永砒霜奶粉案与危惧感说
    description: 德岛地方裁判所在森永砒霜奶粉案的发回重审中，采纳了只要对危险有不能忽视的危惧感即可肯定预见可能性的见解（危惧感说）。
    concepts: [negligence-structure]
    scholars: [fujiki]
    works: [w-morinaga-1973]
    derivedFrom: [e-jp-fujiki-1969]
    needsSource: true

  - id: e-jp-okoshi-1981
    year: 1981
    jurisdiction: jp
    type: reception
    title: 共犯处罚根据论在日本的系统化
    description: 德国的共犯处罚根据论被系统介绍到日本，因果共犯论（惹起说）逐渐成为日本的通说。
    concepts: [complicity-basis]
    scholars: [okoshi]
    works: [w-okoshi-1981]
    derivedFrom: [e-de-luederssen-1967]
    needsSource: true

  - id: e-jp-yamaguchi-1982
    year: 1982
    jurisdiction: jp
    type: development
    title: 修正的客观危险说
    description: 以事后查明的客观事实为基础，追问「在什么样的假定事实下结果可能发生，以及这种假定事实存在的可能性有多大」。这是结果无价值论在不能犯问题上的精致化。
    concepts: [impossible-attempt]
    scholars: [yamaguchi]
    works: [w-yamaguchi-1982]
    derivedFrom: [e-jp-hirano-1972, e-de-feuerbach-1801]
    needsSource: true

  - id: e-jp-maeda-1988
    year: 1988
    jurisdiction: jp
    type: development
    title: 实质的犯罪论
    description: 前田雅英以处罚的必要性与合理性为导向，进一步发展结果无价值论。
    concepts: [wrongfulness-essence]
    scholars: [maeda]
    works: [w-maeda-1988]
    derivedFrom: [e-jp-hirano-1972]
    needsSource: true

  - id: e-jp-yamaguchi-2001
    year: 2001
    jurisdiction: jp
    type: development
    title: 山口厚《刑法总论》
    description: 结果无价值论在体系书中得到系统表述：违法判断以客观事实为基础，故意属于责任。
    concepts: [wrongfulness-essence]
    scholars: [yamaguchi]
    works: [w-yamaguchi-2001]
    derivedFrom: [e-jp-hirano-1972]

  - id: e-jp-ida-2005
    year: 2005
    jurisdiction: jp
    type: critique
    title: 井田良：规范论基础上的二元论
    description: 刑法通过面向行为时一般人的行为规范来保护法益，因此违法判断不能完全事后化。井田良以此回应结果无价值论的批判，重新为二元论奠基。
    concepts: [wrongfulness-essence]
    scholars: [ida]
    works: [w-ida-2005]
    derivedFrom: [e-jp-yamaguchi-2001, e-jp-fukuda-finalism]
    needsSource: true
