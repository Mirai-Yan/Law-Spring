# Netlify 部署（线上演示版）：从 Git 仓库构建，Netlify 会自动识别 Next.js。
# 账号与同步、个人资料库、建议与纠错在线上版关闭（Netlify 的服务器没有可长期保存数据的磁盘）。
# DEEPSEEK_API_KEY 与 ACCESS_CODE 是密钥，不写在这里，在 Netlify 后台的 Environment variables 里设置。
[build]
  command = "node scripts/check-deploy.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  FM_ONLINE_DEMO = "1"
